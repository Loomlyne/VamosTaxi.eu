name: Visual baselines

# Regenerates the darwin screenshot baselines (D-25) on a macOS runner, because they
# cannot be produced on Linux. Runs only for a pushed `visual-baselines/*` branch and
# commits the refreshed PNGs back to that same branch. Every changed image is reviewed
# before it is merged anywhere; this workflow never touches main or a PR branch.
on:
  push:
    branches: ["visual-baselines/**"]

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate darwin screenshot baselines
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      # `changed` rewrites only snapshots that no longer match. Behaviour assertions that
      # fail are not screenshots and stay failing; the step continues so the PNGs land.
      - name: Update mismatched screenshots
        timeout-minutes: 40
        run: pnpm --filter web exec playwright test --update-snapshots=changed || true

      - name: Commit refreshed baselines to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'apps/web/tests/**/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "No baseline changed."
          else
            git commit -m "test(visual): regenerate darwin baselines on macOS"
            git push
          fi
