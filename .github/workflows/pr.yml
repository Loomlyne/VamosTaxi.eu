name: Pull Request

# PLAT-03's pull-request gate plus every D-39 blocking check. Every step below fails
# the merge on a non-zero exit — none is advisory. The secret scan runs before any
# build or upload step so a leaked credential never reaches a published artifact.
on:
  pull_request:

# Two pushes to the same branch must not race two overlapping runs of this workflow —
# the second push cancels the first's in-flight run (01-CONTEXT.md's edge-coverage
# probe for PLAT-03, T-01-07).
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Typecheck, build, secret scan, preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scan first — before pnpm install, before build, before any artifact
      # is produced or uploaded (T-01-01).
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for GitHub orgs
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs scripts/check-next-public-allowlist.mjs (bound to `check:public-env` in
      # package.json) — fails on an undeclared NEXT_PUBLIC_* identifier (D-35, PLAT-06).
      - name: Client-exposure allowlist (D-35, PLAT-06)
        run: pnpm check:public-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (kernel + route contracts)
        run: pnpm test:unit

      - name: CSS law + RTL logical-property lint (D-21, D-32)
        run: pnpm lint:css

      # Runs eslint.config.mjs (plan 03-06) — needs no database, so it sits here next to
      # lint:css rather than in the `database` job below (D-08, D-10's two import fences
      # plus the `return tx` syntax fence).
      - name: Import and return-type fences (D-08, D-10)
        run: pnpm lint

      - name: i18n key-coverage check (D-17)
        run: pnpm i18n:check

      - name: Law 04 invented-numbers gate (D-40, D-46)
        run: pnpm check:numbers

      - name: Build
        run: pnpm build

      - name: Build Worker bundle (OpenNext)
        run: pnpm --filter web exec opennextjs-cloudflare build

      # Preview is owner-secret-gated. An empty token must not fail the merge gate;
      # the D-25 visual job and the rest of this job still fail closed.
      - name: Upload preview (Cloudflare Worker version preview)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: versions upload
          packageManager: pnpm

  # Baselines are committed as `-darwin.png`. ubuntu-latest looks for `-linux.png`
  # and fails regardless of fidelity (01-VERIFICATION.md). D-25 therefore runs on
  # macOS until linux baselines exist.
  visual:
    name: Visual + integration tests (D-25)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      - name: Visual + integration tests (screenshot diffs, D-25)
        run: pnpm test:visual

  database:
    name: "Schema: reset from zero, pgTAP, seed + types drift"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.115.0

      - name: Start local stack
        run: pnpm db:start

      # Applies all 24 migrations + supabase/seed.sql from zero (DATA-07's reset-from-zero
      # proof, reproduced in CI).
      - name: Apply every migration from zero + seed (DATA-07)
        run: pnpm db:reset

      - name: pgTAP suite (DATA-02/03/04, AUTH-05)
        run: pnpm db:test

      - name: Seed drift (D-22)
        run: pnpm db:seed:check

      - name: Generated types drift (D-23)
        run: pnpm db:types:check

      # Plan 03-06 (DATA-06's compile-time half + the full local Phase 3 gate) appends from
      # here. Ordering note: `pnpm db:local-roles` runs AFTER the pgTAP suite above, never
      # before — `extensions.test.sql` (Phase 2, plan 02-08) asserts `vamos_edge has no
      # password` (T-02-19), and Postgres roles are cluster-level objects that survive
      # `supabase db reset`, so setting the password earlier in this job would make that
      # pre-existing assertion fail. 03-05-SUMMARY.md's own deviation #4 hit this exact
      # ordering issue and recorded the same fix.
      - name: Local role passwords (D-04)
        env:
          # Scoped to this one step only, never job-wide (T-03-23) — local-role-passwords.mjs
          # refuses to run under a bare `CI=true` without this explicit opt-in.
          ALLOW_LOCAL_ROLE_PASSWORDS: "1"
        run: pnpm db:local-roles

      - name: DATA-06 local half — connection reuse, lost BEGIN (D-16, D-39)
        run: pnpm --filter @vamos/db exec vitest run test/local

      # Self-contained (D-18): resets to a password-free baseline, confirms the pgTAP suite,
      # re-sets local role passwords, confirms the local Vitest suite, then applies and
      # rolls back each packages/db/mutants/*.sql mutant in turn — one `supabase db reset`
      # per mutant, ending on a clean, password-free, freshly-reset database.
      - name: Mutation gate — the suite must go red against each mutant (D-18)
        env:
          ALLOW_LOCAL_ROLE_PASSWORDS: "1"
        run: pnpm db:mutation-gate

      # scripts/check-db-access-fences.mjs (plan 03-06) — a static walk+regex+allowlist scan,
      # needs no live database, but stays in this job (not `gate` above) to match the local
      # Phase 3 suite's own step grouping.
      - name: Data-access fences (D-05, D-06, D-08, D-10)
        run: pnpm check:db-fences

      - name: Stop local stack
        if: always()
        run: pnpm db:stop
