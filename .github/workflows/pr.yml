name: Pull Request

# PLAT-03's pull-request gate plus every D-39 blocking check. Every step below fails
# the merge on a non-zero exit — none is advisory. The secret scan runs before any
# build or upload step so a leaked credential never reaches a published artifact.
on:
  pull_request:
    # `labeled` lets adding the `visual` label start the macOS job below.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # Docs and planning changes run no code; skip CI so they spend no Actions minutes.
    paths-ignore:
      - "docs/**"
      - ".planning/**"
      - "deliverables/**"
      - "**/*.md"

# Two pushes to the same branch must not race two overlapping runs of this workflow —
# the second push cancels the first's in-flight run (01-CONTEXT.md's edge-coverage
# probe for PLAT-03, T-01-07).
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Typecheck, build, secret scan, preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scan first — before pnpm install, before build, before any artifact
      # is produced or uploaded (T-01-01).
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for GitHub orgs
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs scripts/check-next-public-allowlist.mjs (bound to `check:public-env` in
      # package.json) — fails on an undeclared NEXT_PUBLIC_* identifier (D-35, PLAT-06).
      - name: Client-exposure allowlist (D-35, PLAT-06)
        run: pnpm check:public-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (kernel + route contracts)
        run: pnpm test:unit

      - name: CSS law + RTL logical-property lint (D-21, D-32)
        run: pnpm lint:css

      # Runs eslint.config.mjs (plan 03-06) — needs no database, so it sits here next to
      # lint:css rather than in the `database` job below (D-08, D-10's two import fences
      # plus the `return tx` syntax fence).
      - name: Import and return-type fences (D-08, D-10)
        run: pnpm lint

      - name: i18n key-coverage check (D-17)
        run: pnpm i18n:check

      - name: Legal language claims (I18N-08)
        run: pnpm check:legal-claims

      - name: Law 04 invented-numbers gate (D-40, D-46)
        run: pnpm check:numbers

      - name: Build
        run: pnpm build

      - name: Build Worker bundle (OpenNext)
        run: pnpm --filter web exec opennextjs-cloudflare build

      # K98: do not versions-upload from PR CI. That command uses wrangler
      # name vamos-web and can create a second Worker.
      - name: Preview upload skipped
        run: echo K98 skip PR Worker preview upload

  # Baselines are committed as `-darwin.png`. ubuntu-latest looks for `-linux.png`
  # and fails regardless of fidelity (01-VERIFICATION.md). D-25 therefore runs on
  # macOS until linux baselines exist.
  visual:
    name: Visual + integration tests (D-25)
    # macOS minutes count 10x on a private repo. On a PR this job runs only when the PR
    # carries the `visual` label; every push to main still runs it before the staging deploy.
    if: contains(github.event.pull_request.labels.*.name, 'visual')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      # webhook_ordering.test.sql runs in the database job (`pnpm db:test`).
      # webhook-replay.spec.ts is in this glob (PAY-05 offline half).
      - name: Visual + integration tests (screenshot diffs, D-25)
        run: pnpm test:visual

  # 26.0 D-01 / e2e-linux-3: the booking-funnel specs on Linux. The jobs live in one reusable workflow
  # (e2e-linux.yml) so a push to a ci/** branch can prove a change to them on GitHub before main sees it.
  e2e-linux:
    name: Booking funnel e2e on Linux (D-01)
    uses: ./.github/workflows/e2e-linux.yml
    permissions:
      contents: read

  # 26.0 (main-green-3): the database job lives in schema.yml, so a push to a ci/** branch can prove it
  # on GitHub without a pull request. Same steps, same job name.
  database:
    name: "Schema: reset from zero, pgTAP, seed + types drift"
    uses: ./.github/workflows/schema.yml
    permissions:
      contents: read
