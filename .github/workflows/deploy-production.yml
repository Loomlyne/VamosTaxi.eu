name: Deploy Production

# PLAT-03's production deploy half. Triggers on a tag only — never on a branch push
# (T-01-06). Do not bind vamostaxi.eu. Public product is vamostaxi.site.
on:
  push:
    tags:
      - "v*"

# A second deploy queues behind the first instead of racing it — cancelling a
# half-finished deploy is worse than waiting (T-01-07).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Typecheck, build, secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for GitHub orgs
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client-exposure allowlist (D-35, PLAT-06)
        run: pnpm check:public-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Probe build output must not exist in a production deploy (D-20)
        run: test ! -d apps/isolation-probe/dist

      - name: Probe package name must not appear in anything production ships (D-20)
        run: |
          ! grep -rn "isolation-probe" apps/web packages/db/src \
            --include=*.ts --include=*.tsx --include=*.jsonc --include=*.json

      - name: PROBE_SECRET must not exist on the production Worker (D-20)
        # Fails closed, never skips: an unavailable Cloudflare token must not let this gate
        # silently pass. Plan 03-07 is the first run that can actually exercise this against a
        # real account (D-29) -- until then it fails here, which is the correct default for a
        # gate that cannot yet prove the negative it exists to prove.
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID unavailable -- this gate fails closed, it does not skip (D-20)."
            exit 1
          fi
          secret_list="$(
            pnpm --filter web exec wrangler secret list --env production --config wrangler.jsonc
          )" || {
            echo "::error::Unable to inspect production Worker secrets -- this gate fails closed."
            exit 1
          }
          if printf '%s\n' "$secret_list" | grep -q PROBE_SECRET; then
            echo "::error::PROBE_SECRET is present on the production Worker."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: CSS law + RTL logical-property lint (D-21, D-32)
        run: pnpm lint:css

      - name: i18n key-coverage check (D-17)
        run: pnpm i18n:check

      - name: Build
        run: pnpm build

  # See pr.yml — darwin baselines cannot pass on ubuntu-latest.
  visual:
    name: Visual + integration tests (D-25)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      - name: Visual + integration tests (screenshot diffs, D-25)
        run: pnpm test:visual

  # 26.0 D-01: the booking-funnel specs (Next + database) run here, on Linux, against the runner's own
  # throwaway Supabase stack on loopback. No secret is referenced: Stripe is the in-repo fake, Turnstile
  # uses Cloudflare's dummy keys, geo is stubbed (QUOTE_TEST_STUB_GEO). It deploys nothing and reaches no
  # live resource. darwin screenshot assertions are skipped here (VAMOS_E2E=1 sets ignoreSnapshots);
  # the pictures are compared on the owner's Mac.
  e2e-linux:
    name: Booking funnel e2e on Linux (D-01)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.115.0

      - name: Start local stack
        run: pnpm db:start

      - name: Apply every migration from zero + seed
        run: pnpm db:reset

      # The specs and the guard refuse a database without this marker role (plans 02 and 04).
      - name: Mark the throwaway stack
        run: node scripts/mark-test-stack.mjs postgres://postgres:postgres@127.0.0.1:54322/postgres

      - name: Local role passwords (D-04)
        env:
          ALLOW_LOCAL_ROLE_PASSWORDS: "1"
        run: pnpm db:local-roles

      # The local stack's own keys, never a repository secret. Masked before they reach the environment file.
      - name: Export the stack environment
        working-directory: packages/db
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VAMOS_TEST_DB_PORT=54322"
            echo "VAMOS_LOCAL_DB_PORT=54322"
            echo "VAMOS_TEST_DB_URL=postgres://postgres:postgres@127.0.0.1:54322/postgres"
            echo "VAMOS_TEST_MAIL_URL=http://127.0.0.1:54324"
            echo "REQUIRE_DB=1"
          } >> "$GITHUB_ENV"

      - name: Booking-funnel specs (VAMOS_E2E list, screenshots skipped)
        env:
          VAMOS_E2E: "1"
        run: pnpm test:visual --workers=2

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-linux-test-results
          path: apps/web/test-results
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: pnpm db:stop

  deploy:
    name: Deploy to production
    needs: [gate, visual, e2e-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # K95: never db:push the live bookings project. Never deploy
      # env.production (Worker name vamos-web-production). Public traffic is
      # vamos on vamostaxi.site. Cutover stays owner-gated.
      - name: Production cutover is owner-gated
        run: |
          echo "K95: skip db:push and env.production deploy."
          echo "Public Worker is vamos on vamostaxi.site."
