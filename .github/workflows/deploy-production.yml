name: Deploy Production

# PLAT-03's production deploy half. Triggers on a tag only — never on a branch push
# (T-01-06). Phase 11 is the cutover; a stray merge to main must not be able to
# publish to the vamostaxi.eu apex, which today still serves the live Freshpage site
# (D-33).
on:
  push:
    tags:
      - "v*"

# A second deploy queues behind the first instead of racing it — cancelling a
# half-finished deploy is worse than waiting (T-01-07).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Typecheck, build, secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for GitHub orgs
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client-exposure allowlist (D-35, PLAT-06)
        run: pnpm check:public-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Probe build output must not exist in a production deploy (D-20)
        run: test ! -d apps/isolation-probe/dist

      - name: Probe package name must not appear in anything production ships (D-20)
        run: |
          ! grep -rn "isolation-probe" apps/web packages/db/src \
            --include=*.ts --include=*.tsx --include=*.jsonc --include=*.json

      - name: PROBE_SECRET must not exist on the production Worker (D-20)
        # Fails closed, never skips: an unavailable Cloudflare token must not let this gate
        # silently pass. Plan 03-07 is the first run that can actually exercise this against a
        # real account (D-29) -- until then it fails here, which is the correct default for a
        # gate that cannot yet prove the negative it exists to prove.
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID unavailable -- this gate fails closed, it does not skip (D-20)."
            exit 1
          fi
          if npx wrangler secret list --env production --config apps/web/wrangler.jsonc | grep -q PROBE_SECRET; then
            echo "::error::PROBE_SECRET is present on the production Worker."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: CSS law + RTL logical-property lint (D-21, D-32)
        run: pnpm lint:css

      - name: i18n key-coverage check (D-17)
        run: pnpm i18n:check

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Visual + integration tests (screenshot diffs, D-25)
        run: pnpm test:visual

  deploy:
    name: Deploy to production
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.115.0

      # `--include-seed` re-run semantics are D-27/U3, RESOLVED (02-09-SUMMARY.md post-execution
      # fix): a second push does NOT re-run seed.sql once its content hash is recorded in
      # supabase_migrations.seed_files -- every seed INSERT is ON CONFLICT regardless, so a
      # changed seed file re-applying is safe either way. seed.sql also had to be restructured
      # into a single top-level `do $do$ … $do$;` block -- Supabase's Supavisor pooler
      # (transaction mode, what this linked connection resolves to) silently truncates a
      # multi-statement pgx batch to its last statement, which broke `create or replace function
      # public.__seed_apply()` + `revoke` + `select` as three separate top-level statements.
      # These secrets are not yet configured (owner-held, see SUPABASE-RESOURCES.md), so this
      # step fails closed until they exist — the Worker deploy was already blocked on the
      # Cloudflare secrets (01-VERIFICATION.md). One hosted project exists today (D-37), so
      # staging and production currently point at the same ref.
      - name: Apply migrations + seed to production (D-21, D-27)
        run: pnpm db:link && pnpm db:push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy Worker (production environment)
        run: pnpm --filter web deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # No-op until Phase 11 (Launch Cutover) points vamostaxi.eu's apex at this
      # Worker — today the domain still serves the live Freshpage site, so there is
      # nothing at that hostname yet for a smoke check to assert against (D-33).
      - name: Smoke test — deferred until Phase 11 cutover
        run: |
          echo "No production smoke check yet: vamostaxi.eu still serves the live"
          echo "Freshpage site until the Phase 11 cutover repoints the apex at this"
          echo "Worker. deploy-staging.yml already exercises the equivalent curl +"
          echo "locale assertions against staging.vamostaxi.eu on every main push."
