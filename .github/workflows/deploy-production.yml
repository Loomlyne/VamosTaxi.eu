name: Deploy Production

# PLAT-03's production deploy half. Triggers on a tag only — never on a branch push
# (T-01-06). Do not bind vamostaxi.eu. Public product is vamostaxi.site.
on:
  push:
    tags:
      - "v*"

# A second deploy queues behind the first instead of racing it — cancelling a
# half-finished deploy is worse than waiting (T-01-07).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Typecheck, build, secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for GitHub orgs
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client-exposure allowlist (D-35, PLAT-06)
        run: pnpm check:public-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Probe build output must not exist in a production deploy (D-20)
        run: test ! -d apps/isolation-probe/dist

      - name: Probe package name must not appear in anything production ships (D-20)
        run: |
          ! grep -rn "isolation-probe" apps/web packages/db/src \
            --include=*.ts --include=*.tsx --include=*.jsonc --include=*.json

      - name: PROBE_SECRET must not exist on the production Worker (D-20)
        # Fails closed, never skips: an unavailable Cloudflare token must not let this gate
        # silently pass. Plan 03-07 is the first run that can actually exercise this against a
        # real account (D-29) -- until then it fails here, which is the correct default for a
        # gate that cannot yet prove the negative it exists to prove.
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID unavailable -- this gate fails closed, it does not skip (D-20)."
            exit 1
          fi
          secret_list="$(
            pnpm --filter web exec wrangler secret list --env production --config wrangler.jsonc
          )" || {
            echo "::error::Unable to inspect production Worker secrets -- this gate fails closed."
            exit 1
          }
          if printf '%s\n' "$secret_list" | grep -q PROBE_SECRET; then
            echo "::error::PROBE_SECRET is present on the production Worker."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: CSS law + RTL logical-property lint (D-21, D-32)
        run: pnpm lint:css

      - name: i18n key-coverage check (D-17)
        run: pnpm i18n:check

      - name: Build
        run: pnpm build

  # See pr.yml — darwin baselines cannot pass on ubuntu-latest.
  visual:
    name: Visual + integration tests (D-25)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      - name: Visual + integration tests (screenshot diffs, D-25)
        run: pnpm test:visual

  deploy:
    name: Deploy to production
    needs: [gate, visual]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # K95: never db:push the live bookings project. Never deploy
      # env.production (Worker name vamos-web-production). Public traffic is
      # vamos on vamostaxi.site. Cutover stays owner-gated.
      - name: Production cutover is owner-gated
        run: |
          echo "K95: skip db:push and env.production deploy."
          echo "Public Worker is vamos on vamostaxi.site."
