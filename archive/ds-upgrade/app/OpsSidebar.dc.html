<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../tokens/fonts.css">
<link rel="stylesheet" href="../tokens/colors.css">
<link rel="stylesheet" href="../tokens/typography.css">
<link rel="stylesheet" href="../tokens/spacing.css">
<link rel="stylesheet" href="../tokens/elevation.css">
<link rel="stylesheet" href="../tokens/motion.css">
<link rel="stylesheet" href="../tokens/base.css">
<link rel="stylesheet" href="../components/mobile/fig-tokens.css">
<link rel="stylesheet" href="../components/mobile/fig-assets.css">
<link rel="stylesheet" href="../styles.css">
<script src="../_ds_bundle.js"></script>
<link rel="stylesheet" href="../assets/lenis.css">
<script src="../assets/lenis.js"></script>
<script src="../assets/lenis-boot.js"></script>
<script src="vamos-i18n-dict.js"></script>
<script src="vamos-locale.js"></script>
<style>:root{--vt-icon-base:"../assets/icons/";--vt-logo-base:"../assets/logo/";--vt-pattern-base:"../assets/patterns/";--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}.vt-select .vt-input--focus{box-shadow:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,[data-vtcombo] input:focus{outline:none;box-shadow:none}body{margin:0}</style>
</helmet>
<aside style="background:var(--vt-bg-inverse);min-height:100vh;box-sizing:border-box;padding:26px 18px;display:flex;flex-direction:column;gap:26px;width:236px">
<div style="padding:0 8px">
<a href="ops-board.dc.html" style="border:0;display:inline-flex">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Logo" variant="reversed" height="{{ n22 }}" hint-size="100px,22px"></x-import>
</a>
<p style="margin:10px 0 0;font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;color:var(--vt-text-inverse-muted)">{{ tDispatch }}</p>
</div>
<nav style="display:flex;flex-direction:column;gap:3px">
<sc-for list="{{ navItems }}" as="n" hint-placeholder-count="7">
<a href="{{ n.href }}" style="text-decoration:none;box-sizing:border-box;display:flex;align-items:center;gap:11px;height:44px;padding:0 14px;border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:{{ n.weight }};color:{{ n.color }};background:{{ n.bg }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ n.icon }}" size="{{ n18 }}" color="{{ n.color }}" hint-size="18px,18px"></x-import>{{ n.label }}
</a>
</sc-for>
</nav>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
<a href="home.dc.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--vt-text-inverse-muted);font-size:var(--vt-body-xs);text-decoration:none;border:0">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="chevron-left" size="{{ n14 }}" color="var(--vt-text-inverse-muted)" hint-size="14px,14px"></x-import>{{ tSiteLink }}
</a>
<div style="display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--vt-border-inverse)">
<span style="width:32px;height:32px;border-radius:999px;background:var(--vt-charcoal-800);display:flex;align-items:center;justify-content:center;flex:0 0 auto">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="user" size="{{ n16 }}" color="var(--vt-accent)" hint-size="16px,16px"></x-import>
</span>
<div style="font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-inverse);line-height:1.3;flex:1 1 auto;min-width:0">
{{ tDispatch }}<br><span style="color:var(--vt-text-inverse-muted)">{{ tAdminRole }}</span>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.IconButton" icon="log-out" label="{{ tSignOut }}" variant="inverse" size="sm" onClick="{{ signOut }}" hint-size="32px,32px"></x-import>
</div>
<a href="#" onClick="{{ toggleLang }}" style="color:var(--vt-text-inverse-muted);font-size:var(--vt-body-xs);text-decoration:none;font-weight:600;text-align:center">{{ langLabel }}</a>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:860},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bookings&quot;,&quot;options&quot;:[&quot;bookings&quot;,&quot;calendar&quot;,&quot;drivers&quot;,&quot;pricing&quot;,&quot;customers&quot;,&quot;coupons&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = [
  { key:'bookings', href:'ops-board.dc.html', icon:'layout-dashboard', en:'Bookings', de:'Buchungen' },
  { key:'calendar', href:'ops-coming-soon.dc.html?section=calendar', icon:'calendar-days', en:'Calendar', de:'Kalender' },
  { key:'drivers', href:'ops-coming-soon.dc.html?section=drivers', icon:'car', en:'Drivers & vehicles', de:'Fahrer & Fahrzeuge' },
  { key:'pricing', href:'ops-pricing.dc.html', icon:'banknote', en:'Pricing & routes', de:'Preise & Routen' },
  { key:'customers', href:'ops-coming-soon.dc.html?section=customers', icon:'users', en:'Customers', de:'Kunden' },
  { key:'coupons', href:'ops-coming-soon.dc.html?section=coupons', icon:'ticket', en:'Coupons', de:'Gutscheine' },
  { key:'settings', href:'ops-coming-soon.dc.html?section=settings', icon:'settings', en:'Settings', de:'Einstellungen' },
];
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('vamosLang')) || 'en' };
  componentDidMount() {
    this._onLocale = (e) => this.setState({ lang: e.detail.lang, cur: e.detail.cur });
    window.addEventListener('vamos:locale', this._onLocale);
  }
  componentWillUnmount() { if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale); }
  toggleLang = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const next = this.state.lang === 'de' ? 'en' : 'de';
    if (window.VamosLocale) window.VamosLocale.setLang(next);
    else { localStorage.setItem('vamosLang', next); location.reload(); }
  };
  signOut = () => { localStorage.removeItem('vamosOpsAuth'); location.href = 'ops-login.dc.html'; };
  renderVals() {
    const active = this.props.active || 'bookings';
    const lang = this.state.lang;
    const copy = {
      en: { dispatch:'Dispatch', adminRole:'Admin role', signOut:'Sign out', site:'Vamos Taxi site' },
      de: { dispatch:'Dispatch', adminRole:'Admin-Rolle', signOut:'Abmelden', site:'Vamos Taxi Website' },
    }[lang] || { dispatch:'Dispatch', adminRole:'Admin role', signOut:'Sign out', site:'Vamos Taxi site' };
    return {
      n14:14, n16:16, n18:18, n22:22,
      toggleLang: this.toggleLang, signOut: this.signOut,
      langLabel: lang === 'de' ? 'EN' : 'DE',
      tDispatch: copy.dispatch, tAdminRole: copy.adminRole, tSignOut: copy.signOut, tSiteLink: copy.site,
      navItems: NAV.map((n) => {
        const isActive = n.key === active;
        return {
          href: n.href, icon: n.icon, label: lang === 'de' ? n.de : n.en,
          bg: isActive ? 'var(--vt-accent)' : 'transparent',
          color: isActive ? 'var(--vt-charcoal-900)' : 'var(--vt-text-inverse-muted)',
          weight: isActive ? '600' : '400',
        };
      }),
    };
  }
}
</script>
</body>
</html>
