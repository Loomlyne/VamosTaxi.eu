<style>:root{--vt-icon-base:"../assets/icons/";--vt-logo-base:"../assets/logo/";--vt-pattern-base:"../assets/patterns/";--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}.vt-select .vt-input--focus{box-shadow:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,[data-vtcombo] input:focus{outline:none;box-shadow:none}
body{margin:0}
a{color:var(--vt-text-link);border-bottom:0}a:hover{color:var(--vt-text-link-hover)}
[data-hiw]{--s-bg:var(--vt-bg-page);--s-fg:var(--vt-text-primary);--s-sec:var(--vt-charcoal-600);--s-mut:var(--vt-grey-500);--s-rail:var(--vt-grey-300);--s-card:var(--vt-grey-50);--s-med:var(--vt-charcoal-900);background:var(--s-bg);color:var(--s-fg)}
[data-hiw][data-tone="dark"]{--s-bg:var(--vt-charcoal-900);--s-fg:var(--vt-white);--s-sec:rgb(255 255 255/.72);--s-mut:rgb(255 255 255/.52);--s-rail:rgb(255 255 255/.24);--s-card:rgb(255 255 255/.06);--s-med:var(--vt-charcoal-700)}
[data-hiw-link]{color:var(--s-fg)}
[data-hiw-link]:hover{color:var(--vt-yellow-700)}
[data-hiw][data-tone="dark"] [data-hiw-link]:hover{color:var(--vt-accent)}
[data-hiw-board]{position:relative;display:flex;flex-direction:column;gap:20px}
[data-hiw-spine]{position:absolute;top:28px;bottom:28px;left:27px;width:1px;background:var(--s-rail);transform-origin:top center}
[data-hiw-row]{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:20px;align-items:center}
[data-hiw-med]{width:56px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--s-med);box-shadow:0 0 0 8px var(--s-bg);z-index:1}
[data-hiw-med][data-accent="1"]{background:var(--vt-accent)}
[data-hiw-card]{background:var(--s-card);border-radius:var(--vt-radius-lg);padding:18px 20px;min-width:0}
@media (min-width:900px){
[data-hiw-board]{gap:clamp(20px,2.6vw,34px)}
[data-hiw-spine]{left:50%;margin-left:-0.5px}
[data-hiw-row]{grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);column-gap:0}
[data-hiw-med]{grid-column:2;justify-self:center}
[data-hiw-card]{padding:22px 24px}
[data-hiw-row][data-side="l"] [data-hiw-card]{grid-column:1;grid-row:1}
[data-hiw-row][data-side="r"] [data-hiw-card]{grid-column:3;grid-row:1}}
[data-hiw][data-anim="1"] [data-hiw-spine]{transform:scaleY(0);transition:transform 900ms cubic-bezier(.16,1,.3,1)}
[data-hiw][data-anim="1"] [data-hiw-med]{opacity:0;transform:translateY(14px);transition:opacity 520ms var(--vt-ease-out),transform 560ms cubic-bezier(.16,1,.3,1)}
[data-hiw][data-anim="1"] [data-hiw-card]{opacity:0;transform:translateY(14px);transition:opacity 560ms var(--vt-ease-out),transform 620ms cubic-bezier(.16,1,.3,1)}
[data-hiw][data-anim="1"][data-seen="1"] [data-hiw-spine]{transform:scaleY(1)}
[data-hiw][data-anim="1"][data-seen="1"] [data-hiw-med],[data-hiw][data-anim="1"][data-seen="1"] [data-hiw-card]{opacity:1;transform:none}
[data-hiw-row][data-i="1"] [data-hiw-med]{transition-delay:60ms}
[data-hiw-row][data-i="1"] [data-hiw-card]{transition-delay:150ms}
[data-hiw-row][data-i="2"] [data-hiw-med]{transition-delay:200ms}
[data-hiw-row][data-i="2"] [data-hiw-card]{transition-delay:290ms}
[data-hiw-row][data-i="3"] [data-hiw-med]{transition-delay:340ms}
[data-hiw-row][data-i="3"] [data-hiw-card]{transition-delay:430ms}
[data-hiw-row][data-i="4"] [data-hiw-med]{transition-delay:480ms}
[data-hiw-row][data-i="4"] [data-hiw-card]{transition-delay:570ms}
@media (min-width:900px){
[data-hiw][data-anim="1"] [data-hiw-row][data-side="l"] [data-hiw-card]{transform:translate(-14px,10px)}
[data-hiw][data-anim="1"] [data-hiw-row][data-side="r"] [data-hiw-card]{transform:translate(14px,10px)}}
@media (prefers-reduced-motion:reduce){[data-hiw][data-anim="1"] [data-hiw-spine],[data-hiw][data-anim="1"] [data-hiw-med],[data-hiw][data-anim="1"] [data-hiw-card]{opacity:1;transform:none;transition:none}}</style>

<span data-hiw-med="1" data-accent="{{ s.accent }}" aria-hidden="true">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ s.icon }}" size="{{ n24 }}" color="{{ s.iconColor }}" hint-size="24px,24px"></x-import></span>

<script type="text/x-dc" data-dc-script data-props="{&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;revealOnScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
const DEFAULT_TRIP = { pickup: 'Zurich Airport (ZRH), Terminal 2', dropoff: 'Zurich, Bahnhofstrasse 1', date: 'Fri 14 Aug', time: '08:15' };
const AIRPORT = /airport|flughafen|a[eé]roport|\((ZRH|GVA|BSL)\)/i;
function readTrip() {
  try { return Object.assign({}, DEFAULT_TRIP, JSON.parse(localStorage.getItem('vamosTrip') || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_TRIP); }
}
function minus(hm, mins) {
  const p = String(hm || '08:15').split(':');
  const m = ((+p[0]) * 60 + (+p[1]) - mins + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function shortPlace(s) {
  const str = String(s || '');
  const code = str.match(/\((ZRH|GVA|BSL)\)/i);
  if (code) return code[1].toUpperCase();
  return str.split(',')[0].trim() || DEFAULT_TRIP.pickup;
}
class Component extends DCLogic {
  state = (() => {
    const reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    return { trip: readTrip(), seen: false, anim: !reduce };
  })();
  rootRef = (el) => { this.root = el; };
  spineRef = (el) => { this.spine = el; this.fitSpine(); };
  /** Pin the rail between the first and last medallion centres. */
  fitSpine = () => {
    const sp = this.spine;
    if (!sp || !sp.parentElement) return;
    const meds = sp.parentElement.querySelectorAll('[data-hiw-med]');
    if (meds.length < 2) return;
    const base = sp.parentElement.getBoundingClientRect();
    const a = meds[0].getBoundingClientRect();
    const b = meds[meds.length - 1].getBoundingClientRect();
    const top = a.top + a.height / 2 - base.top;
    const h = (b.top + b.height / 2 - base.top) - top;
    if (h <= 0) return;
    sp.style.top = Math.round(top) + 'px';
    sp.style.bottom = 'auto';
    sp.style.height = Math.round(h) + 'px';
  };
  componentDidMount() {
    this._onLocale = (e) => this.setState({ lang: e.detail.lang, cur: e.detail.cur });
    window.addEventListener('vamos:locale', this._onLocale);
    this.onResize = () => { clearTimeout(this._rt); this._rt = setTimeout(this.fitSpine, 120); };
    window.addEventListener('resize', this.onResize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this.fitSpine);
    setTimeout(this.fitSpine, 120);
    this.onStore = (e) => { if (!e || e.key === 'vamosTrip') this.setState({ trip: readTrip() }); };
    window.addEventListener('storage', this.onStore);
    if (!(this.props.revealOnScroll ?? true) || !this.state.anim || typeof IntersectionObserver === 'undefined') {
      this.setState({ anim: false, seen: true });
      return;
    }
    this.io = new IntersectionObserver((es) => {
      if (es.some((e) => e.isIntersecting)) { this.setState({ seen: true }); this.io.disconnect(); }
    }, { rootMargin: '-6% 0px -14% 0px' });
    if (this.root) this.io.observe(this.root);
    this.safety = setTimeout(() => {
      const r = this.root && this.root.getBoundingClientRect();
      if (r && r.top < window.innerHeight && r.bottom > 0) this.setState({ seen: true });
    }, 1400);
  }
  componentDidUpdate() { this.fitSpine(); }
  componentWillUnmount() {
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    if (this.io) this.io.disconnect();
    clearTimeout(this.safety);
    clearTimeout(this._rt);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('storage', this.onStore);
  }
  steps() {
    const t = this.state.trip;
    const airport = AIRPORT.test(t.pickup || '');
    const place = shortPlace(t.pickup);
    const third = airport
      ? { time: minus(t.time, 45), sub: t.date, icon: 'plane-landing', title: 'Your flight lands',
          copy: 'Your pickup is set from the arrival, not from a guess. If the flight moves, the pickup moves with it.' }
      : { time: '−24 h', sub: 'before pickup', icon: 'user', title: 'A named driver is assigned',
          copy: 'Dispatch puts a driver and a vehicle against your slot. Free cancellation right up to this point.' };
    return [
      { time: 'Now', sub: 'today', icon: 'map-pin', title: 'Route or flight number',
        copy: 'Type a flight number and the pickup point and time come from the arrival. Nothing to look up yourself.' },
      { time: '+1 min', sub: 'today', icon: 'credit-card', title: 'Fixed price, paid by card',
        copy: 'Every class is priced as you type. Review the trip, pay securely, and the voucher lands immediately.' },
      third,
      { time: t.time, sub: t.date, icon: 'car-front', accent: '1', title: 'Your driver is waiting at ' + place,
        copy: 'Name board in hand, at the exact pickup time. Sixty minutes of airport waiting are included.' },
    ];
  }
  renderVals() {
    return {
      n16: 16, n24: 24,
      tone: (this.props.tone ?? 'light') === 'dark' ? 'dark' : 'light',
      animAttr: this.state.anim ? '1' : '0',
      seenAttr: this.state.seen ? '1' : '0',
      rootRef: this.rootRef,
      spineRef: this.spineRef,
      steps: this.steps().map((s, i) => ({
        i: String(i + 1), side: i % 2 === 0 ? 'l' : 'r',
        time: s.time, sub: s.sub, title: s.title, copy: s.copy, icon: s.icon,
        accent: s.accent || '0',
        iconColor: s.accent ? 'var(--vt-charcoal-900)' : 'var(--vt-accent)',
      })),
    };
  }
}
</script>
