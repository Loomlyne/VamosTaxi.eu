<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/colors.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/typography.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/spacing.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/elevation.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/motion.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/tokens/base.css">
<link rel="stylesheet" href="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/styles.css">
<script src="../_ds/vamos-taxi-design-system-245af154-0455-4c10-af76-5254642c3786/_ds_bundle.js"></script>
<style>:root{--vt-shadow-accent:none}
:root{--vt-icon-base:"../assets/icons/"}body{margin:0}a{color:var(--vt-text-link)}a:hover{color:var(--vt-text-link-hover)}</style>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;display:inline-flex;flex:0 0 auto;font-family:var(--vt-font-body)">
<button type="button" aria-haspopup="listbox" aria-label="{{ a11yLabel }}" onClick="{{ toggle }}" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--vt-white);border:1px solid rgb(30 31 31/.10);box-shadow:0 1px 2px rgb(0 0 0/.10);color:var(--vt-charcoal-900);font-family:var(--vt-font-body);font-size:13px;font-weight:600;line-height:1;letter-spacing:.01em;cursor:pointer;white-space:nowrap;transition:var(--vt-transition-control)" style-hover="box-shadow:0 4px 14px rgb(0 0 0/.18)">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ icon }}" size="{{ n16 }}" color="var(--vt-yellow-700)" hint-size="16px,16px"></x-import>
<span>{{ label }}</span>
<sc-if value="{{ showChevron }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="chevron-down" size="{{ n16 }}" color="var(--vt-grey-500)" hint-size="16px,16px"></x-import>
</sc-if>
</button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div role="listbox" aria-label="{{ a11yLabel }}" style="position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:214px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-lg);box-shadow:var(--vt-shadow-lg);padding:6px;z-index:90;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ rows }}" as="o" hint-placeholder-count="4">
<button type="button" role="option" aria-selected="{{ o.selStr }}" onClick="{{ o.pick }}" style="all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;cursor:pointer;font-family:var(--vt-font-body)" style-hover="background:var(--vt-grey-50)">
<span style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto">
<span style="font-size:13px;font-weight:600;color:var(--vt-text-primary);text-align:start">{{ o.label }}</span>
<span style="font-size:11px;color:var(--vt-text-muted);text-align:start">{{ o.note }}</span>
</span>
<sc-if value="{{ o.sel }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="check" size="{{ n16 }}" color="var(--vt-charcoal-900)" hint-size="16px,16px"></x-import>
</sc-if>
</button>
</sc-for>
</div>
</sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:260},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value:string,label:string,note?:string}[]&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;globe&quot;,&quot;banknote&quot;,&quot;user&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;globe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;a11yLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Language&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value:string)=&gt;void&quot;}}">
const DEMO = [
  { value: 'en', label: 'EN', note: 'English' },
  { value: 'de', label: 'DE', note: 'Deutsch' },
  { value: 'fr', label: 'FR', note: 'Français' },
  { value: 'ar', label: 'AR', note: 'العربية' },
];
class Component extends DCLogic {
  state = { open: false };
  _rootRef = (el) => { this._root = el; };
  componentDidMount() {
    this._away = (e) => { if (this.state.open && this._root && !this._root.contains(e.target)) this.setState({ open: false }); };
    this._esc = (e) => { if (e.key === 'Escape' && this.state.open) this.setState({ open: false }); };
    document.addEventListener('mousedown', this._away);
    document.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() {
    document.removeEventListener('mousedown', this._away);
    document.removeEventListener('keydown', this._esc);
  }
  renderVals() {
    const opts = (this.props.options && this.props.options.length) ? this.props.options : DEMO;
    const val = this.props.value;
    const sel = opts.find((o) => o.value === val) || opts[0];
    return {
      n16: 16,
      open: this.state.open,
      showChevron: !this.props.compact,
      icon: this.props.icon || 'globe',
      a11yLabel: this.props.a11yLabel || 'Select',
      label: sel ? sel.label : '',
      rootRef: this._rootRef,
      toggle: () => this.setState((s) => ({ open: !s.open })),
      rows: opts.map((o) => ({
        label: o.label, note: o.note || '',
        sel: o.value === val, selStr: o.value === val ? 'true' : 'false',
        pick: () => { this.setState({ open: false }); if (this.props.onSelect) this.props.onSelect(o.value); },
      })),
    };
  }
}

</script>
</body>
</html>
