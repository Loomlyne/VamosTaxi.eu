<script type="text/x-dc" data-dc-script>
function readTrip() {
  const DEFAULT_TRIP = { mode:'one-way', pickup:'Zurich Airport (ZRH), Terminal 2', dropoff:'Zurich, Bahnhofstrasse 1', date:'Fri 14 Aug', time:'08:15', pax:2, bags:2, vehicle:'business' };
  try { return Object.assign({}, DEFAULT_TRIP, JSON.parse(localStorage.getItem('vamosTrip') || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_TRIP); }
}
function saveTrip(patch) {
  const t = Object.assign({}, readTrip(), patch);
  localStorage.setItem('vamosTrip', JSON.stringify(t));
  return t;
}
const VEHICLE_NAME = { economy:'Economy', business:'Business', van:'Van', eclass:'E-Class', sclass:'S-Class', vclass:'V-Class', sprinter:'Sprinter' };
const T = {
  en: {
    changeVehicle:'Change vehicle', steps:['Trip','Details','Payment'],
    whoTravelling:'Who is travelling', firstName:'First name', lastName:'Last name', email:'Email', mobile:'Mobile',
    emailHint:'Your confirmation and voucher go here', mobileHint:'The driver calls this number on arrival',
    guest:'Continue as guest', guestDesc:'You can claim the booking into an account later',
    account:'Create an account', accountDesc:'Keeps your booking history and addresses',
    flightDetails:'Flight and pickup details', flightNumber:'Flight number', airline:'Airline',
    flightHint:'We track the flight and hold the driver if you land late', notes:'Notes for the driver', notesPh:'Meeting point, gate code, ski equipment…',
    extras:'Extras', childSeat:'Child seat', childSeatDesc:'Price pending — child-seat fee is a client input', additionalStops:'Additional stops',
    payment:'Payment', payCard:'Card, Apple Pay or TWINT', payCardDesc:'Charged now, secured by Stripe',
    payPaypal:'PayPal', payPaypalDesc:'You are redirected to PayPal to approve',
    payCash:'Cash to the driver', payCashDesc:'Approved routes only — dispatch confirms by email',
    coupon:'Coupon or voucher code', apply:'Apply',
    yourTransfer:'Your transfer', oneWay:'One way', return_:'Return',
    priceNote:'Fixed price, all taxes and tolls included. Free cancellation up to 24 h before pickup.',
    payLabel:'Pay and confirm', payLabelCash:'Confirm booking',
    terms:'By continuing you accept the terms and the cancellation policy.',
    callDispatch:'Need something unusual — a bus, a wedding, an overnight? Call dispatch on +41 79 626 70 82.',
    lineTransfer:'Transfer, ', lineTransferClass:' class', lineAirportFee:'Airport pickup fee', lineChildSeat:'Child seat × 1',
    lineStop:'Additional stop × ', lineWaiting:'60 min airport waiting', lineIncluded:'included', lineCoupon:'Coupon ',
    reqFirstName:'Enter a first name', reqLastName:'Enter a last name', reqEmail:'Enter an email address', reqMobile:'Enter a mobile number',
    pax:'passengers', bags:'bags',
  },
  de: {
    changeVehicle:'Fahrzeug ändern', steps:['Fahrt','Angaben','Zahlung'],
    whoTravelling:'Wer reist mit', firstName:'Vorname', lastName:'Nachname', email:'E-Mail', mobile:'Mobilnummer',
    emailHint:'Bestätigung und Gutschein gehen hierhin', mobileHint:'Der Fahrer ruft diese Nummer bei Ankunft an',
    guest:'Als Gast fortfahren', guestDesc:'Sie können die Buchung später einem Konto zuordnen',
    account:'Konto erstellen', accountDesc:'Speichert Buchungsverlauf und Adressen',
    flightDetails:'Flug- und Abholdetails', flightNumber:'Flugnummer', airline:'Fluggesellschaft',
    flightHint:'Wir verfolgen den Flug und halten den Fahrer bei Verspätung', notes:'Hinweise für den Fahrer', notesPh:'Treffpunkt, Torcode, Skiausrüstung…',
    extras:'Extras', childSeat:'Kindersitz', childSeatDesc:'Preis ausstehend — Kindersitzgebühr ist noch offen', additionalStops:'Zusätzliche Stopps',
    payment:'Zahlung', payCard:'Karte, Apple Pay oder TWINT', payCardDesc:'Wird jetzt belastet, gesichert durch Stripe',
    payPaypal:'PayPal', payPaypalDesc:'Sie werden zur Bestätigung zu PayPal weitergeleitet',
    payCash:'Bar beim Fahrer', payCashDesc:'Nur auf freigegebenen Strecken — Dispatch bestätigt per E-Mail',
    coupon:'Gutschein- oder Rabattcode', apply:'Anwenden',
    yourTransfer:'Ihr Transfer', oneWay:'Einfache Fahrt', return_:'Rückfahrt',
    priceNote:'Festpreis, alle Steuern und Gebühren inklusive. Kostenlose Stornierung bis 24 Std. vor Abholung.',
    payLabel:'Zahlen und bestätigen', payLabelCash:'Buchung bestätigen',
    terms:'Mit dem Fortfahren akzeptieren Sie die AGB und die Stornobedingungen.',
    callDispatch:'Etwas Ausgefallenes — ein Bus, eine Hochzeit, eine Übernachtung? Rufen Sie den Dispatch unter +41 79 626 70 82 an.',
    lineTransfer:'Transfer, ', lineTransferClass:'-Klasse', lineAirportFee:'Flughafengebühr', lineChildSeat:'Kindersitz × 1',
    lineStop:'Zusätzlicher Stopp × ', lineWaiting:'60 Min. Wartezeit am Flughafen', lineIncluded:'inklusive', lineCoupon:'Gutschein ',
    reqFirstName:'Vornamen eingeben', reqLastName:'Nachnamen eingeben', reqEmail:'E-Mail-Adresse eingeben', reqMobile:'Mobilnummer eingeben',
    pax:'Passagiere', bags:'Gepäckstücke',
  },
};
class Component extends DCLogic {
  state = {
    lang: (typeof localStorage !== 'undefined' && localStorage.getItem('vamosLang')) || 'en',
    trip: readTrip(),
    firstName:'', lastName:'', email:'', mobile:'', guest:true,
    flight:'', airline:'', notes:'',
    childSeat:false, stops:0,
    pay:'card', coupon:'', couponApplied:null,
    errors:{},
  };
  setField = (key) => (e) => this.setState({ [key]: e.target.value });
  applyCoupon = () => { if (this.state.coupon) this.setState({ couponApplied: this.state.coupon.toUpperCase(), coupon:'' }); };
  removeCoupon = () => this.setState({ couponApplied: null });
  pay = () => {
    const t = T[this.state.lang] || T.en;
    const errors = {};
    if (!this.state.firstName.trim()) errors.firstName = t.reqFirstName;
    if (!this.state.lastName.trim()) errors.lastName = t.reqLastName;
    if (!this.state.email.trim()) errors.email = t.reqEmail;
    if (!this.state.mobile.trim()) errors.mobile = t.reqMobile;
    if (Object.keys(errors).length) { this.setState({ errors }); return; }
    const ref = 'VT-' + (5000 + Math.floor(Math.random() * 900));
    saveTrip({
      firstName: this.state.firstName, lastName: this.state.lastName, email: this.state.email, mobile: this.state.mobile,
      flight: this.state.flight, airline: this.state.airline, notes: this.state.notes,
      childSeat: this.state.childSeat, stops: this.state.stops,
      pay: this.state.pay, couponApplied: this.state.couponApplied,
      bookingRef: ref, status: 'confirmed',
    });
    location.href = 'confirmation.dc.html';
  };
  renderVals() {
    const t = T[this.state.lang] || T.en;
    const trip = this.state.trip;
    const isAirport = /airport|zrh|gva/i.test(trip.pickup + ' ' + trip.dropoff);
    const vehicleName = trip.vehicleName || VEHICLE_NAME[trip.vehicle] || 'Business';
    const lines = [
      { label: t.lineTransfer + vehicleName + t.lineTransferClass, value: 'CHF 000.00' },
    ];
    if (isAirport) lines.push({ label: t.lineAirportFee, value: 'CHF 00.00' });
    if (this.state.childSeat) lines.push({ label: t.lineChildSeat, value: 'CHF 00.00' });
    if (this.state.stops > 0) lines.push({ label: t.lineStop + this.state.stops, value: 'CHF 00.00' });
    lines.push({ label: t.lineWaiting, value: t.lineIncluded, muted: true });
    if (this.state.couponApplied) lines.push({ label: t.lineCoupon + this.state.couponApplied, value: '− CHF 00.00', credit: true });
    return {
      n0:0, n1:1, n2:2, n3:3, n15:15, yes:true, no:false,
      tChangeVehicle: t.changeVehicle, steps: t.steps,
      tWhoTravelling: t.whoTravelling, tFirstName: t.firstName, tLastName: t.lastName, tEmail: t.email, tMobile: t.mobile,
      tEmailHint: t.emailHint, tMobileHint: t.mobileHint,
      firstName: this.state.firstName, setFirstName: this.setField('firstName'), errFirstName: this.state.errors.firstName,
      lastName: this.state.lastName, setLastName: this.setField('lastName'), errLastName: this.state.errors.lastName,
      email: this.state.email, setEmail: this.setField('email'), errEmail: this.state.errors.email,
      mobile: this.state.mobile, setMobile: this.setField('mobile'), errMobile: this.state.errors.mobile,
      tGuest: t.guest, tGuestDesc: t.guestDesc, tAccount: t.account, tAccountDesc: t.accountDesc,
      isGuest: this.state.guest, isAccount: !this.state.guest,
      setGuestTrue: () => this.setState({ guest: true }), setGuestFalse: () => this.setState({ guest: false }),
      isAirport,
      tFlightDetails: t.flightDetails, tFlightNumber: t.flightNumber, tAirline: t.airline, tFlightHint: t.flightHint,
      tNotes: t.notes, tNotesPh: t.notesPh,
      flight: this.state.flight, setFlight: this.setField('flight'), airline: this.state.airline, setAirline: this.setField('airline'),
      notes: this.state.notes, setNotes: this.setField('notes'),
      tExtras: t.extras, tChildSeat: t.childSeat, tChildSeatDesc: t.childSeatDesc, tAdditionalStops: t.additionalStops,
      childSeat: this.state.childSeat, toggleChildSeat: () => this.setState((s) => ({ childSeat: !s.childSeat })),
      stops: this.state.stops, setStops: (n) => this.setState({ stops: n }),
      tPayment: t.payment, tPayCard: t.payCard, tPayCardDesc: t.payCardDesc, tPayPaypal: t.payPaypal, tPayPaypalDesc: t.payPaypalDesc,
      tPayCash: t.payCash, tPayCashDesc: t.payCashDesc,
      payCard: this.state.pay === 'card', payPaypal: this.state.pay === 'paypal', payCash: this.state.pay === 'cash',
      setPayCard: () => this.setState({ pay: 'card' }), setPayPaypal: () => this.setState({ pay: 'paypal' }), setPayCash: () => this.setState({ pay: 'cash' }),
      tCoupon: t.coupon, tApply: t.apply,
      coupon: this.state.coupon, setCoupon: this.setField('coupon'), applyCoupon: this.applyCoupon,
      hasCoupon: !!this.state.couponApplied, couponApplied: this.state.couponApplied || '', removeCoupon: this.removeCoupon,
      tYourTransfer: t.yourTransfer, tModeBadge: trip.mode === 'return' ? t.return_ : t.oneWay,
      pickup: trip.pickup, dropoff: trip.dropoff,
      meta: [
        { icon:'calendar', label: trip.date }, { icon:'clock', label: trip.time }, { icon:'car', label: vehicleName },
      ],
      lines, total: 'CHF 000.00', tPriceNote: t.priceNote,
      tPayLabel: this.state.pay === 'cash' ? t.payLabelCash : t.payLabel, pay: this.pay,
      tTerms: t.terms, tCallDispatch: t.callDispatch,
    };
  }
}
</script>
