<!DOCTYPE html>

<style>:root{--vt-icon-base:"../assets/icons/";--vt-logo-base:"../assets/logo/";--vt-pattern-base:"../assets/patterns/";--vt-shadow-accent:none}body{margin:0;background:var(--vt-bg-page)}a{color:var(--vt-text-link)}a:hover{color:var(--vt-text-link-hover)}</style>

<div style="display:flex;min-height:100vh;font-family:var(--vt-font-body);color:var(--vt-text-primary)">
<dc-import name="OpsSidebar" active="bookings" hint-size="236px,900px"></dc-import>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
<header style="display:flex;align-items:center;gap:22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle);flex-wrap:wrap">
<div>
<h1 style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking)">{{ tBookings }}</h1>

</div>
<div style="margin-left:auto;display:flex;align-items:center;gap:14px">
<div style="width:280px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="sm" icon="search" placeholder="{{ tSearchPh }}" hint-size="280px,36px"></x-import>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="md" icon="plus" hint-size="150px,44px">{{ tNewBooking }}</x-import>
</div>

<div style="padding:26px 32px 40px;display:flex;flex-direction:column;gap:24px;min-width:0">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">

<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.StatTile" label="{{ tUnassigned }}" value="{{ vUnassigned }}" icon="triangle-alert" foot="{{ tUnassignedFoot }}" hint-size="100%,132px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.StatTile" label="{{ tRevenue }}" value="—" icon="banknote" tone="inverse" foot="{{ tRevenueFoot }}" hint-size="100%,132px"></x-import>
</div>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Tag" active="{{ f.active }}" onClick="{{ f.select }}" hint-size="110px,34px">{{ f.label }}</x-import>
</sc-for>
<div style="margin-left:auto;display:flex;gap:8px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.IconButton" icon="funnel" label="{{ tMoreFilters }}" variant="outline" size="sm" hint-size="36px,36px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.IconButton" icon="printer" label="{{ tExport }}" variant="outline" size="sm" hint-size="36px,36px"></x-import>
</div>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Table" columns="{{ columns }}" rows="{{ visibleRows }}" onRowClick="{{ openRow }}" hint-size="100%,320px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Card" tone="flat" padding="sm" hint-size="100%,60px">
<div style="display:flex;align-items:center;gap:16px">
<span style="font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tShowing }}</span>
<div style="margin-left:auto;display:flex;gap:6px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.IconButton" icon="chevron-left" label="{{ tPrevPage }}" size="sm" hint-size="36px,36px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.IconButton" icon="chevron-right" label="{{ tNextPage }}" size="sm" hint-size="36px,36px"></x-import>
</div>
</div>
</x-import>
</div>
</main>
</div>
</x-dc>

        { key:'total', header: t.colTotal, width:'96px', align:'right', render: () => 'CHF 000' },

  }
}
</script>
