<style>:root{--vt-icon-base:"../assets/icons/";--vt-logo-base:"../assets/logo/";--vt-pattern-base:"../assets/patterns/";--vt-shadow-accent:none}body{margin:0}</style>
</helmet>
<sc-if value="{{ showGlass }}" hint-placeholder-val="{{ false }}">
<header style="position:fixed;top:0;left:0;right:0;z-index:60;padding:14px 0">
<div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,56px)">
<div style="display:flex;align-items:center;gap:16px;height:64px;padding:0 8px 0 22px;border-radius:999px;background:rgb(255 255 255/.82);backdrop-filter:saturate(140%) blur(18px);-webkit-backdrop-filter:saturate(140%) blur(18px);border:1px solid rgb(255 255 255/.72);box-shadow:var(--vt-shadow-md)">
<a href="home.dc.html" style="border:0;display:flex;flex:0 0 auto">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Logo" variant="primary" height="{{ n24 }}" hint-size="112px,24px"></x-import>
</a>
<div style="margin-left:auto;display:flex;align-items:center;gap:10px">
<a href="tel:+41796267082" style="display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 16px;border-radius:999px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);color:var(--vt-text-primary);font-size:var(--vt-body-sm);white-space:nowrap;text-decoration:none">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="phone" size="{{ n15 }}" color="var(--vt-yellow-600)" hint-size="15px,15px"></x-import>+41 79 626 70 82
</a>
<a href="#" onClick="{{ toggleLang }}" style="color:var(--vt-text-secondary);font-size:var(--vt-body-sm);text-decoration:none;padding:0 6px;font-weight:600">{{ langLabel }}</a>
<a href="ops-login.dc.html" style="height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--vt-border-subtle);color:var(--vt-text-primary);font-size:var(--vt-body-sm);display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap">{{ tSignIn }}</a>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="md" href="home.dc.html#book" iconEnd="arrow-right" hint-size="170px,40px">{{ bookLabel }}</x-import>
</div>
</div>
</div>
</header>
</sc-if>
<sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
<header style="background:var(--vt-bg-inverse);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--vt-border-inverse)">
<div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,56px);display:flex;align-items:center;gap:24px;height:76px;flex-wrap:nowrap">
<a href="home.dc.html" style="border:0;display:flex">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Logo" variant="reversed" height="{{ n26 }}" hint-size="118px,26px"></x-import>
</a>
<nav style="display:flex;gap:20px;margin-left:8px;min-width:0;overflow:hidden">
<a href="#" style="color:var(--vt-text-inverse-muted);font-size:var(--vt-body-sm);border:0;white-space:nowrap;text-decoration:none">{{ tAirport }}</a>
<a href="#" style="color:var(--vt-text-inverse-muted);font-size:var(--vt-body-sm);border:0;white-space:nowrap;text-decoration:none">{{ tCity }}</a>
<a href="#" style="color:var(--vt-text-inverse-muted);font-size:var(--vt-body-sm);border:0;white-space:nowrap;text-decoration:none">{{ tCorporate }}</a>
</nav>
<div style="margin-left:auto;display:flex;align-items:center;gap:16px">
<a href="tel:+41796267082" style="color:var(--vt-text-inverse);font-size:var(--vt-body-sm);border:0;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="phone" size="{{ n16 }}" color="var(--vt-accent)" hint-size="16px,16px"></x-import>+41 79 626 70 82
</a>
<a href="#" onClick="{{ toggleLang }}" style="color:var(--vt-text-inverse-muted);font-size:var(--vt-body-sm);text-decoration:none;padding:0 4px;font-weight:600">{{ langLabel }}</a>
<a href="ops-login.dc.html" style="height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--vt-border-inverse);color:var(--vt-text-inverse);font-size:var(--vt-body-sm);display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap">{{ tSignIn }}</a>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" href="home.dc.html#book" hint-size="140px,36px">{{ bookLabel }}</x-import>
</div>
</div>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:90},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inverse&quot;,&quot;options&quot;:[&quot;glass&quot;,&quot;inverse&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const T = {
  en: { airport:'Airport transfers', city:'City & long distance', corporate:'Corporate', signIn:'Sign in', book:'Book a transfer' },
  de: { airport:'Flughafentransfers', city:'Stadt & Langstrecke', corporate:'Firmenkunden', signIn:'Anmelden', book:'Transfer buchen' },
};
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('vamosLang')) || 'en' };
  toggleLang = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const next = this.state.lang === 'en' ? 'de' : 'en';
    localStorage.setItem('vamosLang', next);
    location.reload();
  };
  renderVals() {
    const variant = this.props.variant || 'inverse';
    const glass = variant === 'glass';
    const t = T[this.state.lang] || T.en;
    return {
      n15:15, n16:16, n24:24, n26:26,
      showGlass: glass,
      showBar: !glass,
      toggleLang: this.toggleLang,
      langLabel: this.state.lang === 'en' ? 'DE' : 'EN',
      tAirport: t.airport, tCity: t.city, tCorporate: t.corporate, tSignIn: t.signIn, bookLabel: t.book,
    };
  }
}
</script>
</body>
</html>
