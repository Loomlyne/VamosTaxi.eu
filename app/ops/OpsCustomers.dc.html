<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle)">
<div style="min-width:0">
<h1 style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking)">{{ tTitle }}</h1>
<p style="margin:4px 0 0;font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tSubtitle }}</p>
</div>
</header>

<div style="padding:26px 32px 48px;display:flex;flex-direction:column;gap:20px;min-width:0">

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:16px">
<sc-for list="{{ counts }}" as="c" hint-placeholder-count="3">
<div style="box-sizing:border-box;display:flex;flex-direction:column;gap:10px;min-height:120px;padding:18px 20px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-lg)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
<span style="font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-muted)">{{ c.label }}</span>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ c.icon }}" size="{{ n18 }}" color="var(--vt-text-muted)" hint-size="18px,18px"></x-import>
</div>
<span style="font-family:var(--vt-font-display);font-size:var(--vt-figure-lg);font-weight:var(--vt-weight-bold);line-height:1;color:var(--vt-text-primary)">{{ c.value }}</span>
<span style="margin-top:auto;font-size:var(--vt-body-xs);line-height:1.45;color:var(--vt-text-muted)">{{ c.foot }}</span>
</div>
</sc-for>
</div>

<dc-import name="OpsTable" rows="{{ rows }}" columns="{{ columns }}" fields="{{ fields }}" noun="{{ tNoun }}" noun-plural="{{ tNounPlural }}" edit-title="{{ tEditTitle }}" label-key="name" search-placeholder="{{ tSearch }}" search-keys="{{ searchKeys }}" empty-title="{{ tEmptyTitle }}" empty-body="{{ tEmptyBody }}" onSave="{{ onSave }}" onDelete="{{ onDelete }}" onEdit="{{ onEdit }}" onCloseEdit="{{ onCloseEdit }}" edit-id="{{ editId }}" edit-tick="{{ editTick }}" historyRows="{{ historyRows }}" history-label="{{ tHistory }}" history-empty-label="{{ tHistoryEmpty }}" delete-title="{{ tDeleteTitle }}" delete-body="{{ tDeleteBody }}" hint-size="100%,460px"></dc-import>

<p style="margin:0;max-width:78ch;font-size:var(--vt-body-xs);line-height:1.6;color:var(--vt-text-muted);text-wrap:pretty">{{ tNote }}</p>

</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}">
/* Customers — list hydrates from GET /api/staff/customers via
   VamosOps.customers. Save PATCHes /api/staff/customers/:id (name,
   email, phone only). Customer since is read-only. Click opens
   /customers/{email}. History lists that email’s bookings under Notes;
   a row opens /bookings/{ref} so Cancel still lives on OpsDetail.
   Empty list is empty. Delete tombstones. */
const TYPES = {
  private: { tone:'neutral', label:'Private' },
  corporate: { tone:'inverse', label:'Corporate' },
};
const T = {
  en: { title:'Customers', subtitle:'Everyone who has booked, and how to reach them',
    colName:'Customer', colPhone:'Phone', colType:'Type', colCompany:'Company', colTrips:'Trips',
    cntAll:'Customers', cntCorporate:'Corporate accounts', cntTrips:'Trips booked',
    footAll:'On the books', footCorporate:'Invoiced, not card-paid', footTrips:'Across every customer',
    search:'Name, email, phone or company',
    noun:'customer', nounPlural:'customers', editTitle:'Customer',
    emptyTitle:'No customers yet', emptyBody:'Anyone who signs in, or starts checkout with an email, appears here.',
    deleteTitle:'Delete this customer?', deleteBody:'They leave this list. Their bookings stay on the board.',
    fName:'Name', fEmail:'Email', fPhone:'Phone', fSince:'Customer since',
    history:'History', historyEmpty:'No bookings yet.',
    note:'A customer is anyone who signed in or started checkout with an email.',
  },
  de: { title:'Kunden', subtitle:'Alle, die gebucht haben, und wie man sie erreicht',
    colName:'Kunde', colPhone:'Telefon', colType:'Typ', colCompany:'Firma', colTrips:'Fahrten',
    cntAll:'Kunden', cntCorporate:'Firmenkonten', cntTrips:'Gebuchte Fahrten',
    footAll:'Im Bestand', footCorporate:'Auf Rechnung, nicht per Karte', footTrips:'Über alle Kunden',
    search:'Name, E-Mail, Telefon oder Firma',
    noun:'Kunde', nounPlural:'Kunden', editTitle:'Kunde',
    emptyTitle:'Noch keine Kunden', emptyBody:'Jeder, der sich anmeldet oder den Checkout mit E-Mail startet, erscheint hier.',
    deleteTitle:'Diesen Kunden löschen?', deleteBody:'Sie verschwinden aus dieser Liste. Buchungen bleiben auf dem Board.',
    fName:'Name', fEmail:'E-Mail', fPhone:'Telefon', fSince:'Kunde seit',
    history:'Verlauf', historyEmpty:'Noch keine Buchungen.',
    note:'Kunde ist, wer sich angemeldet oder den Checkout mit E-Mail gestartet hat.',
  },
  fr: { title:'Clients', subtitle:'Tous ceux qui ont réservé, et comment les joindre',
    colName:'Client', colPhone:'Téléphone', colType:'Type', colCompany:'Société', colTrips:'Courses',
    cntAll:'Clients', cntCorporate:'Comptes entreprises', cntTrips:'Courses réservées',
    footAll:'Au registre', footCorporate:'Facturés, pas payés par carte', footTrips:'Tous clients confondus',
    search:'Nom, e-mail, téléphone ou société',
    noun:'client', nounPlural:'clients', editTitle:'Client',
    emptyTitle:'Aucun client', emptyBody:'Toute connexion, ou un checkout avec e-mail, apparaît ici.',
    deleteTitle:'Supprimer ce client ?', deleteBody:'Il quitte cette liste. Les réservations restent au tableau.',
    fName:'Nom', fEmail:'E-mail', fPhone:'Téléphone', fSince:'Client depuis',
    history:'Historique', historyEmpty:'Aucune réservation pour l’instant.',
    note:'Un client est quiconque s’est connecté ou a commencé le paiement avec un e-mail.',
  },
  ar: { title:'العملاء', subtitle:'كل من حجز، وكيفية الوصول إليه',
    colName:'العميل', colPhone:'الهاتف', colType:'النوع', colCompany:'الشركة', colTrips:'الرحلات',
    cntAll:'العملاء', cntCorporate:'حسابات الشركات', cntTrips:'الرحلات المحجوزة',
    footAll:'في السجل', footCorporate:'بفاتورة لا ببطاقة', footTrips:'عبر كل العملاء',
    search:'الاسم أو البريد أو الهاتف أو الشركة',
    noun:'عميل', nounPlural:'عملاء', editTitle:'العميل',
    emptyTitle:'لا يوجد عملاء بعد', emptyBody:'كل من يسجّل الدخول أو يبدأ الدفع بالبريد يظهر هنا.',
    deleteTitle:'حذف هذا العميل؟', deleteBody:'يغادر هذه القائمة. تبقى الحجوزات على اللوحة.',
    fName:'الاسم', fEmail:'البريد الإلكتروني', fPhone:'الهاتف', fSince:'عميل منذ',
    history:'السجل', historyEmpty:'لا حجوزات بعد.',
    note:'العميل من سجّل الدخول أو بدأ الدفع بالبريد.',
  },
};

function customerPathEmail() {
  const raw = String(location.pathname || '');
  const stripped = raw.replace(/^\/(en|de|fr|ar)(?=\/|$)/, '') || '/';
  const path = stripped.length > 1 && stripped.endsWith('/') ? stripped.slice(0, -1) : stripped;
  if (path.indexOf('/customers/') !== 0) return '';
  const rest = path.slice('/customers/'.length);
  if (!rest || rest.indexOf('/') !== -1) return '';
  try { return decodeURIComponent(rest).trim().toLowerCase(); } catch (e) { return ''; }
}
function goCustomers(email) {
  const dest = email ? '/customers/' + encodeURIComponent(email) : '/customers';
  const here = String(location.pathname || '');
  if (here === dest || here.endsWith(dest)) return;
  history.pushState({}, '', dest);
}

class Component extends DCLogic {
  state = { lang: 'en', editId: '', editTick: 0 };
  bind = () => {
    if (!window.VamosOps) { this._retry = setTimeout(this.bind, 120); return; }
    this._off = window.VamosOps.customers.onChange(() => this.syncPathEdit());
    this.syncPathEdit();
  };
  syncPathEdit = () => {
    const ops = window.VamosOps;
    const rows = ops ? ops.customers.all() : [];
    const email = customerPathEmail();
    const match = email ? rows.filter((r) => String(r.email || '').trim().toLowerCase() === email)[0] : null;
    const id = match ? match.id : '';
    if (id && id !== this.state.editId) this.setState({ editId: id, editTick: (this.state.editTick || 0) + 1 });
    else if (!id && this.state.editId) this.setState({ editId: '' });
    else this.forceUpdate();
  };
  componentDidMount() {
    this.bind();
    this._onLocale = (e) => this.setState({ lang: e.detail.lang });
    this._onPop = () => this.syncPathEdit();
    window.addEventListener('vamos:locale', this._onLocale);
    window.addEventListener('popstate', this._onPop);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang() });
  }
  componentWillUnmount() {
    if (this._off) this._off();
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    if (this._onPop) window.removeEventListener('popstate', this._onPop);
    clearTimeout(this._retry);
  }
  renderVals() {
    const t = T[this.state.lang] || T.en;
    const ops = window.VamosOps;
    const rows = ops ? ops.customers.all() : [];
    const corporate = rows.filter((r) => r.type === 'corporate').length;
    const trips = rows.reduce((n, r) => n + (r.trips || 0), 0);
    return {
      n18: 18,
      tTitle: t.title, tSubtitle: t.subtitle, tSearch: t.search,
      tNoun: t.noun, tNounPlural: t.nounPlural, tEditTitle: t.editTitle,
      tEmptyTitle: t.emptyTitle, tEmptyBody: t.emptyBody, tNote: t.note,
      tDeleteTitle: t.deleteTitle, tDeleteBody: t.deleteBody,
      tHistory: t.history, tHistoryEmpty: t.historyEmpty,
      editId: this.state.editId, editTick: this.state.editTick,
      onEdit: (row) => {
        const email = String(row && row.email || '').trim();
        if (email) goCustomers(email);
      },
      onCloseEdit: () => { if (customerPathEmail()) goCustomers(''); },
      onSave: (row) => {
        if (!ops || !row) return Promise.resolve({ ok: false, code: "missing-id" });
        const patch = { name: row.name, email: row.email, phone: row.phone };
        if (row.id) return ops.customers.update(row.id, patch);
        return ops.customers.upsert(patch);
      },
      onDelete: (id) => ops ? ops.customers.remove(id) : null,
      historyRows: (row) => {
        if (!ops || !row) return [];
        const email = String(row.email || '').trim().toLowerCase();
        const phone = String(row.phone || '').replace(/\s/g, '');
        return ops.bookings.all().filter((b) => {
          const be = String(b.email || '').trim().toLowerCase();
          const bp = String(b.phone || '').replace(/\s/g, '');
          return (email && be === email) || (phone && bp === phone);
        }).map((b) => {
          const extra = [b.klass, b.pax ? b.pax + ' pax' : '', b.flight].filter(Boolean).join(' · ');
          return {
            ref: b.id,
            route: [b.pickup, b.dropoff].filter(Boolean).join(' → ') || '—',
            when: [b.date, b.time].filter(Boolean).join(' · '),
            extra,
            extraShow: extra ? 'inline' : 'none',
            status: b.status,
            open: () => {
              history.pushState({}, '', '/bookings/' + encodeURIComponent(b.id));
              window.dispatchEvent(new PopStateEvent('popstate'));
            },
          };
        });
      },
      counts: [
        { label:t.cntAll, value:String(rows.length), icon:'user', foot:t.footAll },
        { label:t.cntCorporate, value:String(corporate), icon:'briefcase', foot:t.footCorporate },
        { label:t.cntTrips, value:String(trips), icon:'car-front', foot:t.footTrips },
      ],
      rows,
      columns: [
        { key:'name', header:t.colName, kind:'stack', subKey:'email' },
        { key:'phone', header:t.colPhone, width:'170px' },
        { key:'company', header:t.colCompany, width:'190px', lookup:(r) => r.company || '—' },
        { key:'trips', header:t.colTrips, width:'92px', align:'right' },
        { key:'type', header:t.colType, width:'130px', kind:'badge', tones:TYPES },
      ],
      fields: [
        { key:'name', label:t.fName, half:true, required:true },
        { key:'email', label:t.fEmail, half:true, placeholder:'name@example.com', required:true },
        { key:'phone', label:t.fPhone, half:true, placeholder:'+41 00 000 00 00' },
        { key:'since', label:t.fSince, half:true, icon:'calendar', readonly:true },
      ],
      searchKeys: ['name','email','phone','company'],
    };
  }
}
</script>
</body>
</html>
