<body>
<x-dc>
<helmet>
<style>
:root{--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}
</style>
</helmet>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle)">

<p style="margin:4px 0 0;max-width:78ch;font-size:var(--vt-body-xs);line-height:1.5;color:var(--vt-text-muted);text-wrap:pretty">{{ subtitle }}</p>

<div style="padding:26px 32px 48px;display:flex;flex-direction:column;gap:20px;min-width:0">

<dc-import name="OpsTable" rows="{{ rows }}" columns="{{ columns }}" fields="{{ fields }}" blank="{{ blank }}" onSave="{{ onSave }}" onUpdate="{{ onUpdate }}" onDelete="{{ onDelete }}" save-label="{{ saveLabel }}" add-save-label="{{ addSaveLabel }}" noun="{{ noun }}" noun-plural="{{ nounPlural }}" add-title="{{ addTitle }}" edit-title="{{ editTitle }}" delete-title="{{ deleteTitle }}" delete-body="{{ deleteBody }}" label-key="{{ labelKey }}" add-label="{{ addLabel }}" search-placeholder="{{ searchPlaceholder }}" search-keys="{{ searchKeys }}" empty-title="{{ emptyTitle }}" empty-body="{{ emptyBody }}" required-message="{{ requiredMessage }}" hint-size="100%,460px"></dc-import>

</div>
</main>

/** A store answer with its message in the owner's language (OpsTable shows `message`). */
function localize(json, t, fallback) {
  if (json && json.ok === true) return json;
  const code = String((json && (json.code || json.error)) || '');
  let message = '';
  if (code === 'fleet-car-in-use') {
    const drivers = Array.isArray(json.drivers) ? json.drivers : [];
    const refs = Array.isArray(json.references) ? json.references : [];
    const parts = [];
    if (drivers.length) parts.push(t.inUseDriver.replace('{names}', drivers.join(t.sep)));
    if (refs.length) parts.push(t.inUseTrips.replace('{refs}', refs.join(t.sep)));
    message = parts.join(' ');
  } else if (code === 'fleet-car-gone' || code === 'not-found') message = t.gone;
  else if (code === '23505') message = t.dupPlate;
  else if (code === 'fleet-failure-plate-required') message = t.needPlate;
  else if (code === 'fleet-failure-model-required') message = t.needModel;
  else if (code === 'fleet-failure-class-required' || code === '23503') message = t.needClass;
  else if (code === 'fleet-failure-seats') message = t.badSeats;
  else if (code === 'fleet-failure-bags') message = t.badBags;
  return Object.assign({}, json || {}, { ok: false, message: message || fallback });
}

/** The record the server gets: the row without the list-only keys. */
function carRecord(rec) {
  const out = {};
  for (const k in (rec || {})) if (LIST_ONLY.indexOf(k) === -1) out[k] = rec[k];
  return out;
}

class Component extends DCLogic {
  state = { lang: 'en', liveClasses: null, classNames: {}, classLoad: 'pending' };
  bind = () => {
    if (!window.VamosOps) { this._retry = setTimeout(this.bind, 120); return; }
    this._off = window.VamosOps.onAny(() => this.forceUpdate());
    this.forceUpdate();
  };
  /* The live fare book's classes: GET rate-versions → the one with status live → its rate book.
     A draft's new class is not offered until it is published (a trip is only ever of a live
     class, and Assign refuses a car of another class). All class names come from
     vehicle-classes, so a car whose class left the live book still reads its own name. */
  loadClasses = () => {
    const api = window.VamosOpsApi;
    if (!api || typeof api.request !== 'function') { this._classRetry = setTimeout(this.loadClasses, 120); return null; }
    const names = api.request('GET', '/api/staff/vehicle-classes').then((json) => {
      const map = {};
      const rows = (json && json.ok && Array.isArray(json.data)) ? json.data : [];
      rows.forEach((c) => {
        const id = String((c && c.id) || '');
        const name = String((c && (c.name || c.klass)) || '').trim();
        if (id && name) map[id] = name;
      });
      return map;
    });
    const live = api.request('GET', '/api/staff/rate-versions').then((json) => {
      const versions = (json && json.ok && json.data && Array.isArray(json.data.versions)) ? json.data.versions : null;
      if (!versions) return { failed: true };
      const on = versions.filter((v) => v && v.status === 'live')[0];
      if (!on) return { classes: [] };
      return api.request('GET', '/api/staff/rate-book?versionId=' + encodeURIComponent(String(on.id))).then((book) => {
        if (!book || !book.ok || !book.data || !Array.isArray(book.data.classes)) return { failed: true };
        return {
          classes: book.data.classes
            .map((c) => ({ id: String((c && c.id) || ''), name: String((c && (c.label || c.name)) || '').trim() }))
            .filter((c) => c.id && c.name),
        };
      });
    });
    return Promise.all([names, live]).then((both) => {
      const res = both[1] || { failed: true };
      this.setState({
        classNames: both[0] || {},
        liveClasses: res.failed ? [] : res.classes,
        classLoad: res.failed ? 'failed' : (res.classes.length ? 'ok' : 'none'),
      });
    }, () => this.setState({ liveClasses: [], classLoad: 'failed' }));
  };
  componentDidMount() {
    this.bind();
    this._onLocale = (e) => this.setState({ lang: e.detail.lang });
    window.addEventListener('vamos:locale', this._onLocale);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang() || 'en' });
    this.loadClasses();
  }
  componentWillUnmount() {
    if (this._off) this._off();
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    clearTimeout(this._retry);
    clearTimeout(this._classRetry);
  }

  renderVals() {
    const t = T[this.state.lang] || T.en;
    const ops = window.VamosOps;
    const store = ops ? ops.vehicles : null;
    const cars = store ? store.all() : [];
    const drivers = (ops && ops.chauffeurs) ? ops.chauffeurs.all() : [];
    const live = this.state.liveClasses || [];

    const names = Object.assign({}, this.state.classNames || {});
    live.forEach((c) => { names[c.id] = c.name; });
    const classNameOf = (v) => names[String((v && v.vehicleClassId) || '')] || '';

    const driversOf = {};
    drivers.forEach((c) => {
      const id = String((c && (c.defaultVehicleId || c.vehicle)) || '');
      if (!id) return;
      (driversOf[id] = driversOf[id] || []).push(String(c.name || c.fullName || '').trim());
    });

    const classOptions = live.map((c) => ({ value: c.id, label: c.name }));
    cars.forEach((v) => {
      const id = String((v && v.vehicleClassId) || '');
      if (!id || classOptions.some((o) => o.value === id)) return;
      classOptions.push({ value: id, label: names[id] || id });
    });
    const statusLabel = { service: t.sService, idle: t.sIdle, workshop: t.sWorkshop };
    const tones = {};
    STATUSES.forEach((s) => { tones[s] = { tone: STATUS_TONE[s], label: statusLabel[s] }; });

    const rows = cars.map((v) => Object.assign({}, v, {
      className: classNameOf(v),
      driverNames: (driversOf[String(v.id)] || []).filter(Boolean).join(t.sep),
    }));

    const columns = [
      { key:'model', header:t.colCar, lookup:(r) => React.createElement('span', {
          style: { display:'flex', flexDirection:'column', gap:2, lineHeight:1.3, minWidth:0 },
        },
        React.createElement('span', { style: { fontWeight:500 } }, r.model || '—'),
        React.createElement('span', {
          dir: 'ltr',
          style: { alignSelf:'flex-start', unicodeBidi:'isolate', fontSize:'var(--vt-body-xs)', color:'var(--vt-text-muted)', letterSpacing:'.02em' },
        }, r.plate || '')) },
      { key:'className', header:t.colClass, width:'170px', lookup:(r) => r.className || '—' },
      { key:'seats', header:t.colSeats, width:'96px' },
      { key:'bags', header:t.colBags, width:'96px' },
      { key:'driverNames', header:t.colDriver, width:'180px',
        lookup:(r) => r.driverNames || React.createElement('span', { style: { color:'var(--vt-text-muted)' } }, t.noDriver) },
      { key:'status', header:t.colStatus, width:'160px', kind:'badge', tones },
    ];

    const fields = [
      { key:'photo', label:t.fPhoto, editor:'photo', photoKind:'vehicle', upload:'/api/photos/upload', chooseLabel:t.choosePhoto, hint:t.hPhoto },
      { key:'plate', label:t.fPlate, half:true, required:true, placeholder:'ZH 000 000', hint:t.hPlate },
      { key:'model', label:t.fModel, half:true, required:true, hint:t.hModel },
      { key:'vehicleClassId', label:t.fClass, editor:'select', options:classOptions, icon:'car', required:true, emptyLabel:t.pickClass, hint:t.hClass },
      { key:'seats', label:t.fSeats, editor:'number', min:1, max:16, half:true, hint:t.hSeats },
      { key:'bags', label:t.fBags, editor:'number', min:0, max:16, half:true, hint:t.hBags },
      { key:'status', label:t.fStatus, editor:'select', icon:'settings', hint:t.hStatus,
        options: STATUSES.map((s) => ({ value: s, label: statusLabel[s] })) },
    ];

    const load = this.state.classLoad;
    const classMsg = load === 'none' ? t.noLiveBook : (load === 'failed' ? t.classesFailed : '');

    return {
      title: t.title,
      subtitle: t.sub,
      note: t.note,
      hasClassMsg: !!classMsg,
      classMsg,
      rows,
      columns,
      fields,
      blank: () => (store ? store.blank() : {}),
      // OpsTable gives a new row a UUID (the photo is stored under it), and the store PATCHes any
      // UUID — so a new car goes to add (POST, keeping that id) and an edit to update (PATCH).
      onSave: (rec) => {
        if (!store) return Promise.resolve(localize({ ok: false }, t, t.saveFailed));
        return store.add(carRecord(rec)).then((json) => localize(json, t, t.saveFailed));
      },
      onUpdate: (id, rec) => {
        if (!store) return Promise.resolve(localize({ ok: false }, t, t.saveFailed));
        return store.update(id, carRecord(rec)).then((json) => localize(json, t, t.saveFailed));
      },
      onDelete: (id) => {
        if (!store) return Promise.resolve(localize({ ok: false }, t, t.deleteFailed));
        return store.remove(id).then((json) => localize(json, t, t.deleteFailed));
      },
      saveLabel: t.saveCar,
      addSaveLabel: t.saveCar,
      noun: t.noun,
      nounPlural: t.nouns,
      addTitle: t.add,
      editTitle: t.editTitle,
      deleteTitle: t.delTitle,
