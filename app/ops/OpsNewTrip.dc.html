<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops · New trip</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<main style="flex:1 1 auto;min-width:0;padding:22px 28px 48px;display:flex;flex-direction:column;gap:14px;max-width:880px">
<div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="outline" icon="chevron-left" onClick="{{ goBack }}" hint-size="auto,36px">{{ tBack }}</x-import>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Card" padding="lg" hint-size="100%,900px">
<div style="padding-bottom:16px;border-bottom:1px solid var(--vt-border-subtle)">
<span style="font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:700;letter-spacing:.02em">{{ tNewTrip }}</span>
<p style="margin:4px 0 0;font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tLead }}</p>
</div>
<div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="grid-column:1 / -1;position:relative">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tPickup }}" value="{{ pickupText }}" onChange="{{ setPickup }}" hint-size="100%,76px"></x-import>
<sc-if value="{{ pickupOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-md);box-shadow:var(--vt-shadow-lg)">
<sc-for list="{{ pickupHits }}" as="hit" hint-placeholder-count="2">
<button type="button" onClick="{{ hit.pick }}" style="all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-sm)">{{ hit.label }}</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="grid-column:1 / -1;position:relative">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tDropoff }}" value="{{ dropText }}" onChange="{{ setDrop }}" hint-size="100%,76px"></x-import>
<sc-if value="{{ dropOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-md);box-shadow:var(--vt-shadow-lg)">
<sc-for list="{{ dropHits }}" as="hit" hint-placeholder-count="2">
<button type="button" onClick="{{ hit.pick }}" style="all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-sm)">{{ hit.label }}</button>
</sc-for>
</div>
</sc-if>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tDate }}" value="{{ dateIso }}" onChange="{{ setDate }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tTime }}" value="{{ time }}" onChange="{{ setTime }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tPassengers }}" value="{{ pax }}" onChange="{{ setPax }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tBags }}" value="{{ bags }}" onChange="{{ setBags }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Select" label="{{ tClass }}" options="{{ classOptions }}" value="{{ klass }}" error="{{ classError }}" onChange="{{ setKlass }}" hint-size="100%,78px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Select" label="{{ tLocale }}" options="{{ localeOptions }}" value="{{ locale }}" onChange="{{ setLocale }}" hint-size="100%,78px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tFlight }}" hint="{{ flightHint }}" error="{{ flightError }}" value="{{ flight }}" onChange="{{ setFlight }}" hint-size="100%,96px"></x-import>
<div></div>
<div style="grid-column:1 / -1">
<h3 style="margin:0 0 8px;font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:600;color:var(--vt-text-muted)">{{ tExtras }}</h3>
<sc-if value="{{ extrasNote }}" hint-placeholder-val="{{ false }}">
<p style="margin:0;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);color:var(--vt-text-muted)">{{ extrasNoteText }}</p>
</sc-if>
<div data-nt-extras="1" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:4px 16px">
<sc-for list="{{ extraRows }}" as="row" hint-placeholder-count="2">
<div data-vt-no-i18n="1" style="min-height:44px;display:flex;align-items:center;min-width:0">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Checkbox" label="{{ row.label }}" description="{{ row.price }}" checked="{{ row.checked }}" onChange="{{ row.toggle }}" hint-size="260px,44px"></x-import>
</div>
</sc-for>
</div>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tName }}" value="{{ name }}" onChange="{{ setName }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tEmail }}" value="{{ email }}" onChange="{{ setEmail }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tPhone }}" value="{{ phone }}" onChange="{{ setPhone }}" hint-size="100%,76px"></x-import>
</div>
<div style="margin-top:20px">
<h3 style="margin:0 0 8px;font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:600;color:var(--vt-text-muted)">{{ tFare }}</h3>
<p data-vt-no-i18n="1" style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-figure-lg);font-weight:700">{{ fareLabel }}</p>
<sc-if value="{{ priceBusy }}" hint-placeholder-val="{{ false }}">
<p style="margin:4px 0 0;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);color:var(--vt-text-muted)">{{ tUpdating }}</p>
</sc-if>
</div>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:16px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Alert" tone="danger" title="{{ errorTitle }}" hint-size="100%,70px">{{ errorBody }}</x-import>
</div>
</sc-if>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="secondary" onClick="{{ runQuote }}" hint-size="120px,36px">{{ tQuote }}</x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="primary" onClick="{{ saveTrip }}" hint-size="120px,36px">{{ tSave }}</x-import>
</div>
</x-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:900}}">
function geoSession() {
  try {
    var t = sessionStorage.getItem('vamosGeo');
    if (t && /^[0-9a-f-]{36}$/i.test(t)) return t;
    t = (crypto.randomUUID && crypto.randomUUID()) || '';
    if (t) sessionStorage.setItem('vamosGeo', t);
    return t;
  } catch (e) { return (crypto.randomUUID && crypto.randomUUID()) || ''; }
}
function placeInput(loc, text) {
  if (!loc) return null;
  var t = String(text || loc.n || '').slice(0, 200);
  if (t.length < 2) return null;
  if (loc.mapbox_id) {
    var token = loc.session_token || geoSession();
    if (token) return { kind: 'retrieve', mapbox_id: String(loc.mapbox_id).slice(0, 256), session_token: String(token).slice(0, 128), text: t };
  }
  var lng = loc.lon != null ? loc.lon : loc.lng;
  if (loc.lat != null && lng != null && isFinite(Number(loc.lat)) && isFinite(Number(lng))) {
    return { kind: 'pin', lng: Number(lng), lat: Number(loc.lat), text: t };
  }
  return null;
}
function scheduledLocal(dateIso, time) {
  var d = String(dateIso || '').slice(0, 10);
  var tm = /^\d{2}:\d{2}$/.test(time) ? time : '00:00';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  return d + 'T' + tm;
}
/* nt:pure:start */
var NT_FLIGHT_RE = /^([A-Z0-9]{2,3}?)\s?(\d{1,4}[A-Z]?)$/;
/** Same rule as the customer form (trip-url.ts normaliseFlight): `lx 318` -> LX318, or null. */
function normaliseFlight(raw) {
  var m = NT_FLIGHT_RE.exec(String(raw || '').trim().toUpperCase().replace(/\s+/g, ' '));
  return m ? { flight: m[1] + m[2], display: m[1] + ' ' + m[2] } : null;
}
function flightKey(raw) {
  var n = normaliseFlight(raw);
  return n ? n.flight : '';
}
/** Eligible classes of a quote answer: value = live slug, label = name customers see, else the slug. */
/* The database limit on one leg (booking_legs.pax 1..16), the same bound /api/quote accepts. Which class
   seats the party comes from the quote's class rows (classChoices), never from this number. */
var PARTY_LIMIT = 16;
/** "No class seats 14 passengers" when a current quote has no class for the party; '' otherwise. */
function noClassLine(n) {
  return n === 1 ? 'No class seats 1 passenger' : 'No class seats ' + n + ' passengers';
}
function classChoices(classes) {
  return (classes || []).filter(function (c) { return c && c.eligible !== false && c.slug; }).map(function (c) {
    var words = String(c.slug).replace(/[-_]+/g, ' ').trim();
    return { value: c.slug, label: (c.name && String(c.name).trim()) || (words.charAt(0).toUpperCase() + words.slice(1)) };
  });
}
function pickClass(choices, current) {
  for (var i = 0; i < choices.length; i++) if (choices[i].value === current) return current;
  return choices.length ? choices[0].value : '';
}
/** The POST /api/checkout/intent body, the same shape buildIntentBody sends from the customer form. */
function newTripIntentBody(i) {
  var flight = i.flight || null;
  return {
    quote_id: i.quoteId,
    lock: i.lock,
    vehicle_class: i.klass,
    extra_codes: (i.extraCodes || []).slice(),
    coupon: null,
    flight_no: flight,
    contact: { name: i.contact.name, email: i.contact.email, phone: i.contact.phone },
    trip: {
      from: i.pickupText, fid: i.pickupLoc.mapbox_id || null,
      to: i.dropText, tid: i.dropLoc.mapbox_id || null,
      gs: i.pickupLoc.session_token || null,
      when: i.when, pax: i.pax, bags: i.bags, flight: flight,
    },
    locale: i.locale,
    display_currency: i.currency,
    idempotency_key: i.idem,
  };
}
/* nt:pure:end */
function fareText(rappen) {
  var n = Number(rappen);
  if (window.VamosLocale && window.VamosLocale.fromChf && Number.isFinite(n) && n > 0) return window.VamosLocale.fromChf(n);
  return window.VamosLocale ? window.VamosLocale.money('000') : 'CHF 000';
}
function displayCurrency() {
  var c = window.VamosLocale && window.VamosLocale.cur ? window.VamosLocale.cur() : 'CHF';
  return c === 'EUR' || c === 'USD' || c === 'AED' ? c : 'CHF';
}
function postJson(url, body) {
  return fetch(url, { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return null; }); });
}
class Component extends DCLogic {
  state = {
    pickupText: '', dropText: '', pickupLoc: null, dropLoc: null, pickupAir: false,
    pickupHits: [], dropHits: [], pickupOpen: false, dropOpen: false,
    dateIso: '', time: '10:00', pax: '1', bags: '0', klass: '', classes: [], locale: 'en',
    flight: '', flightError: '', name: '', email: '', phone: '',
    extrasList: [], extrasState: 'loading', ticked: [],
    quoteId: '', lock: '', quotedFlight: '', quotedPax: 0, fareRappen: 0, priceBusy: false, error: '', saving: false,
  };
  _geoSeq = { pickup: 0, drop: 0 }; // one counter per field (26.2-bp C3a): a Drop-off keystroke must not void the Pickup answer
  _quoteSeq = 0;
  _priceSeq = 0;
  _timer = null;
  _geoT = { pickup: null, drop: null };
  componentDidMount() { this.loadExtras(); }
  componentWillUnmount() { if (this._timer) clearTimeout(this._timer); clearTimeout(this._geoT.pickup); clearTimeout(this._geoT.drop); }
  goBack = () => {
    history.pushState({}, '', '/bookings');
    window.dispatchEvent(new PopStateEvent('popstate'));
  };
  setField = (key) => (e) => {
    var value = e && e.target ? e.target.value : e;
    this.setState({ [key]: value, error: '' });
  };
  /** A field the lock prices (date, time, passengers, bags): drop the lock and quote again shortly. */
  setTripField = (key) => (e) => {
    var value = e && e.target ? e.target.value : e;
    this.setState({ [key]: value, error: '', quoteId: '', lock: '', fareRappen: 0 });
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(this.fireQuote, 700);
  };
  loadExtras = () => {
    this.setState({ extrasState: 'loading' });
    fetch('/api/checkout/extras', { credentials: 'include' })
      .then(function (r) { if (!r.ok) throw new Error('extras'); return r.json(); })
      .then((j) => {
        var list = ((j && j.extras) || []).filter(function (x) { return x && /^[a-z0-9_-]{1,64}$/.test(x.code) && Number.isFinite(Number(x.amount_rappen)); });
        this.setState({ extrasList: list, extrasState: list.length ? 'ready' : 'empty' });
      })
      .catch(() => this.setState({ extrasList: [], extrasState: 'error' }));
  };
  search = (field, q) => {
    var token = geoSession();
    clearTimeout(this._geoT[field]);
    if (!token || String(q || '').trim().length < 2) {
      this.setState(field === 'pickup' ? { pickupHits: [], pickupOpen: false } : { dropHits: [], dropOpen: false });
      return;
    }
    // 26.2-bp C3b: ask after a pause in typing (160 ms, as the customer box does), not once per keystroke
    this._geoT[field] = setTimeout(() => {
      var seq = ++this._geoSeq[field];
      var lang = this.state.locale || 'en';
      fetch('/api/geo/suggest?q=' + encodeURIComponent(q) + '&session_token=' + encodeURIComponent(token) + '&locale=' + encodeURIComponent(lang))
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then((j) => {
          if (seq !== this._geoSeq[field]) return;
          var hits = ((j && j.suggestions) || []).map((hit) => ({
            label: [hit.name, hit.address || hit.context].filter(Boolean).join(' — '),
            pick: () => this.pickPlace(field, {
              n: hit.name, mapbox_id: hit.mapbox_id, session_token: token,
            }, [hit.name, hit.address || hit.context].filter(Boolean).join(', ')),
          })).filter((x) => x.label);
          if (field === 'pickup') this.setState({ pickupHits: hits, pickupOpen: hits.length > 0 });
          else this.setState({ dropHits: hits, dropOpen: hits.length > 0 });
        })
        .catch(() => {});
    }, 160);
  };
  /** The flight is required for an airport pickup; the server names the airport, the form does not guess. */
  checkAirport = (loc) => {
    if (!loc || !loc.mapbox_id) { this.setState({ pickupAir: false }); return; }
    var id = loc.mapbox_id;
    var url = '/api/geo/retrieve?mapbox_id=' + encodeURIComponent(id) + '&session_token=' + encodeURIComponent(loc.session_token || geoSession()) + '&locale=' + encodeURIComponent(this.state.locale || 'en');
    fetch(url, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json().catch(function () { return null; }) : null; })
      .catch(function () { return null; })
      .then((j) => {
        var pl = j && j.place;
        var cur = this.state.pickupLoc;
        if (!cur || cur.mapbox_id !== id) return;
        this.setState({ pickupAir: !!(pl && pl.isAirport === true) });
      });
  };
  pickPlace = (field, loc, text) => {
    clearTimeout(this._geoT[field]);
    if (field === 'pickup') {
      this.setState({ pickupLoc: loc, pickupText: text, pickupOpen: false, pickupHits: [], pickupAir: false }, this.fireQuote);
      this.checkAirport(loc);
    } else this.setState({ dropLoc: loc, dropText: text, dropOpen: false, dropHits: [] }, this.fireQuote);
  };
  setPickup = (e) => { var v = e && e.target ? e.target.value : e; this.setState({ pickupText: v, pickupLoc: null, pickupAir: false, quoteId: '', lock: '', fareRappen: 0 }); this.search('pickup', v); };
  setDrop = (e) => { var v = e && e.target ? e.target.value : e; this.setState({ dropText: v, dropLoc: null, quoteId: '', lock: '', fareRappen: 0 }); this.search('drop', v); };
  tripNumbers = () => ({
    pax: Math.min(PARTY_LIMIT, Math.max(1, parseInt(this.state.pax, 10) || 1)),
    bags: Math.min(16, Math.max(0, parseInt(this.state.bags, 10) || 0)),
  });
  fireQuote = () => {
    var pickup = placeInput(this.state.pickupLoc, this.state.pickupText);
    var dropoff = placeInput(this.state.dropLoc, this.state.dropText);
    var when = scheduledLocal(this.state.dateIso, this.state.time);
    if (!pickup || !dropoff || !when) {
      this.setState({ quoteId: '', lock: '', fareRappen: 0 });
      return;
    }
    var seq = ++this._quoteSeq;
    var flight = normaliseFlight(this.state.flight);
    var nums = this.tripNumbers();
    var body = {
      locale: this.state.locale || 'en',
      display_currency: displayCurrency(),
      mode: 'one_way',
      pickup: pickup,
      dropoff: dropoff,
      legs: [{ leg_seq: 1, scheduled_local: when, flight_no: flight ? flight.flight : null }],
      pax: nums.pax,
      bags: nums.bags,
    };
    if (this.state.klass) body.preferred_class = this.state.klass;
    this.setState({ quoteId: '', lock: '', fareRappen: 0, priceBusy: true });
    postJson('/api/quote', body)
      .then((j) => {
        if (seq !== this._quoteSeq) return;
        if (!j || j.ok !== true) { this.setState({ error: 'quote', quoteId: '', lock: '', fareRappen: 0, priceBusy: false }); return; }
        var choices = classChoices(j.classes);
        this.setState({
          quoteId: j.quote_id || '', lock: j.lock || '', quotedFlight: flight ? flight.flight : '', quotedPax: nums.pax,
          classes: j.classes || [], klass: pickClass(choices, this.state.klass), error: '',
        }, this.priceNow);
      })
      .catch(() => { if (seq === this._quoteSeq) this.setState({ error: 'quote', quoteId: '', lock: '', fareRappen: 0, priceBusy: false }); });
  };
  /** The total staff see is the total the server charges for lock + class + ticked codes (never added here). Resolves the rappen or null. */
  priceNow = (lockArg) => {
    var lock = typeof lockArg === 'string' ? lockArg : this.state.lock;
    var klass = this.state.klass;
    if (!lock || !klass) { this.setState({ fareRappen: 0, priceBusy: false }); return Promise.resolve(null); }
    var seq = ++this._priceSeq;
    var known = this.state.extrasList.map(function (x) { return x.code; });
    var codes = this.state.ticked.filter(function (c) { return known.indexOf(c) >= 0; });
    this.setState({ priceBusy: true });
    return postJson('/api/checkout/price', { lock: lock, vehicle_class: klass, extra_codes: codes })
      .then((j) => {
        if (seq !== this._priceSeq) return null;
        var n = j && j.ok === true ? Number(j.charged_rappen) : NaN;
        if (!Number.isFinite(n) || n <= 0) { this.setState({ error: 'quote', fareRappen: 0, priceBusy: false }); return null; }
        this.setState({ fareRappen: n, priceBusy: false, error: '' });
        return n;
      })
      .catch(() => {
        if (seq === this._priceSeq) this.setState({ error: 'quote', fareRappen: 0, priceBusy: false });
        return null;
      });
  };
  toggleExtra = (code) => () => {
    this.setState((s) => ({ ticked: s.ticked.indexOf(code) >= 0 ? s.ticked.filter(function (c) { return c !== code; }) : s.ticked.concat([code]) }), this.priceNow);
  };
  /** Flight typed after the quote: re-sign the lock with it (flight-only reprice) so the intent's flight check holds. */
  repriceFlight = (flight) => postJson('/api/quote/reprice', {
    quote_id: this.state.quoteId,
    lock: this.state.lock,
    locale: this.state.locale || 'en',
    display_currency: displayCurrency(),
    legs: [{ leg_seq: 1, flight_no: flight ? flight.flight : null }],
  });
  saveTrip = () => {
    if (this.state.saving) return;
    var st = this.state;
    if (!st.quoteId || !st.lock || !st.klass || !st.pickupLoc || !st.dropLoc) { this.setState({ error: 'need-quote' }); return; }
    var name = String(st.name || '').trim();
    var email = String(st.email || '').trim();
    var phone = String(st.phone || '').trim();
    if (!name || !email || !phone) { this.setState({ error: 'contact' }); return; }
    var rawFlight = String(st.flight || '').trim();
    var flight = rawFlight ? normaliseFlight(rawFlight) : null;
    if (rawFlight && !flight) { this.setState({ flightError: 'Check the flight number' }); return; }
    if (st.pickupAir && !flight) { this.setState({ flightError: 'Enter the flight number' }); return; }
    var shown = st.fareRappen;
    if (!(shown > 0)) { this.setState({ error: 'need-quote' }); return; }
    // 26.2-bp C1: a ticked extra or a new class keeps the old fare on screen while the new one is priced; wait for it
    if (st.priceBusy) { this.setState({ error: 'price-changed' }); return; }
    this.setState({ saving: true, error: '', flightError: '' });
    var flightKeyNow = flight ? flight.flight : '';
    var ready = Promise.resolve({ quoteId: st.quoteId, lock: st.lock });
    if (flightKeyNow !== st.quotedFlight) {
      ready = this.repriceFlight(flight).then((j) => {
        if (!j || j.ok !== true || !j.lock) return null;
        var quoteId = j.quote_id || st.quoteId;
        return new Promise((resolve) => this.setState({ quoteId: quoteId, lock: j.lock, quotedFlight: flightKeyNow }, resolve))
          .then(() => this.priceNow(j.lock))
          .then((total) => {
            if (total == null) return null;
            // never book at a total staff did not see: the new total is on screen, Save again to accept it
            if (total !== shown) return { changed: true };

          });

    }
    ready.then((q) => {
      if (!q) { this.setState({ saving: false, error: 'quote' }); return null; }
      if (q.changed) { this.setState({ saving: false, error: 'price-changed' }); return null; }
      var nums = this.tripNumbers();
      var body = newTripIntentBody({
        quoteId: q.quoteId, lock: q.lock, klass: this.state.klass, extraCodes: this.state.ticked.filter((c) => this.state.extrasList.some((x) => x.code === c)),
        contact: { name: name, email: email, phone: phone },
        locale: this.state.locale || 'en', currency: displayCurrency(),
        flight: flight ? flight.flight : null,
        pickupText: this.state.pickupText, pickupLoc: this.state.pickupLoc, dropText: this.state.dropText, dropLoc: this.state.dropLoc,
        when: scheduledLocal(this.state.dateIso, this.state.time), pax: nums.pax, bags: nums.bags,
        idem: (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()),
      });
      return postJson('/api/checkout/intent', body).then((j) => {
        var ref = j && (j.reference || (j.data && j.data.reference));
        if (!ref) {
          this.setState({ saving: false, error: j && j.code === 'price_changed' ? 'price-changed' : 'save' });
          if (j && j.code === 'price_changed') this.fireQuote();
          return;
        }
        this.setState({ saving: false });
        if (window.VamosOps && window.VamosOps.bookings && window.VamosOps.bookings.reset) window.VamosOps.bookings.reset();
        history.pushState({}, '', '/bookings/' + encodeURIComponent(ref));
        window.dispatchEvent(new PopStateEvent('popstate'));
      });
    }).catch(() => this.setState({ saving: false, error: 'save' }));
  };
  renderVals() {
    var s = this.state;
    var err = s.error;
    var errorTitle = err === 'quote' ? 'Quote failed' : err === 'need-quote' ? 'Quote first' : err === 'contact' ? 'Contact needed' : err === 'price-changed' ? 'Price changed' : err === 'save' ? 'Save failed' : '';
    var errorBody = err === 'quote' ? 'Pick places from the list and check date and time.' : err === 'need-quote' ? 'Quote first. Same public fare as the site.' : err === 'contact' ? 'Name, email and mobile are required.' : err === 'price-changed' ? 'The total changed. Check the new total, then save again.' : err === 'save' ? 'The trip was not saved. Try again.' : '';
    var lang = window.VamosLocale && window.VamosLocale.lang ? window.VamosLocale.lang() : 'en';
    var rows = s.extrasList.map((x) => {
      var names = x.names || {};
      var words = String(x.code).replace(/[-_]+/g, ' ').trim();
      var label = (names[lang] && String(names[lang]).trim()) || (names.en && String(names.en).trim()) || (words.charAt(0).toUpperCase() + words.slice(1));
      return { label: label, price: '+ ' + fareText(Number(x.amount_rappen)), checked: s.ticked.indexOf(x.code) >= 0, toggle: this.toggleExtra(x.code) };
    });
    var extrasNoteText = s.extrasState === 'loading' ? 'Loading extras' : s.extrasState === 'empty' ? 'The live price book has no extras.' : s.extrasState === 'error' ? 'Extras did not load. Reload the page.' : '';
    return {
      tBack: 'Back to bookings', tNewTrip: 'New trip', tLead: 'Quote first. Same public fare as the site.',
      tPickup: 'Pickup', tDropoff: 'Drop-off', tDate: 'Date', tTime: 'Time', tPassengers: 'Passengers', tBags: 'Bags',
      tClass: 'Vehicle class', tLocale: 'Locale', tFlight: 'Flight number', tName: 'Name', tEmail: 'Email', tPhone: 'Mobile',
      tExtras: 'Extras', tUpdating: 'Updating price', tFare: 'Fare', tQuote: 'Quote', tSave: 'Save trip',
      pickupText: s.pickupText, dropText: s.dropText,
      pickupOpen: s.pickupOpen, dropOpen: s.dropOpen,
      pickupHits: s.pickupHits, dropHits: s.dropHits,
      dateIso: s.dateIso, time: s.time, pax: s.pax, bags: s.bags,
      klass: s.klass, locale: s.locale, flight: s.flight,
      flightHint: s.pickupAir ? '' : 'Optional. It does not change the price.', flightError: s.flightError,
      name: s.name, email: s.email, phone: s.phone,
      // The classes the quote priced, named as customers see them (never hard-coded slugs).
      classOptions: classChoices(s.classes),
      classError: s.quoteId && s.quotedPax && Array.isArray(s.classes) && s.classes.length && !classChoices(s.classes).length ? noClassLine(s.quotedPax) : '',
      localeOptions: [
        { value: 'en', label: 'English' }, { value: 'de', label: 'Deutsch' },
        { value: 'fr', label: 'Français' }, { value: 'ar', label: 'العربية' },
      ],
      extraRows: rows, extrasNote: !!extrasNoteText, extrasNoteText: extrasNoteText,
      setPickup: this.setPickup, setDrop: this.setDrop,
      setDate: this.setTripField('dateIso'), setTime: this.setTripField('time'),
      // Digits only, and never above the database limit: 20 typed reads 16.
      setPax: (e) => {
        var digits = String(e && e.target ? e.target.value : e == null ? '' : e).replace(/\D/g, '');
        this.setTripField('pax')(digits !== '' && +digits > PARTY_LIMIT ? String(PARTY_LIMIT) : digits);
      },
      setBags: this.setTripField('bags'),
      setKlass: (e) => this.setState({ klass: e && e.target ? e.target.value : e }, this.priceNow),
      setLocale: this.setField('locale'),
      // typing a flight never re-quotes; Save re-signs the lock with it when it differs
      setFlight: (e) => this.setState({ flight: e && e.target ? e.target.value : e, flightError: '', error: '' }),
      setName: this.setField('name'), setEmail: this.setField('email'), setPhone: this.setField('phone'),
      fareLabel: fareText(s.fareRappen), priceBusy: s.priceBusy,
      hasError: !!err, errorTitle: errorTitle, errorBody: errorBody,
      runQuote: this.fireQuote, saveTrip: this.saveTrip, goBack: this.goBack,
    };
  }
}
</script>
