<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops · New trip</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<main style="flex:1 1 auto;min-width:0;padding:22px 28px 48px;display:flex;flex-direction:column;gap:14px;max-width:880px">
<div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="outline" icon="chevron-left" onClick="{{ goBack }}" hint-size="auto,36px">{{ tBack }}</x-import>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Card" padding="lg" hint-size="100%,900px">
<div style="padding-bottom:16px;border-bottom:1px solid var(--vt-border-subtle)">
<span style="font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:700;letter-spacing:.02em">{{ tNewTrip }}</span>
<p style="margin:4px 0 0;font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tLead }}</p>
</div>
<div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="grid-column:1 / -1;position:relative">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tPickup }}" value="{{ pickupText }}" onChange="{{ setPickup }}" hint-size="100%,76px"></x-import>
<sc-if value="{{ pickupOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-md);box-shadow:var(--vt-shadow-lg)">
<sc-for list="{{ pickupHits }}" as="hit" hint-placeholder-count="2">
<button type="button" onClick="{{ hit.pick }}" style="all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-sm)">{{ hit.label }}</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="grid-column:1 / -1;position:relative">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tDropoff }}" value="{{ dropText }}" onChange="{{ setDrop }}" hint-size="100%,76px"></x-import>
<sc-if value="{{ dropOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-md);box-shadow:var(--vt-shadow-lg)">
<sc-for list="{{ dropHits }}" as="hit" hint-placeholder-count="2">
<button type="button" onClick="{{ hit.pick }}" style="all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-sm)">{{ hit.label }}</button>
</sc-for>
</div>
</sc-if>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tDate }}" value="{{ dateIso }}" onChange="{{ setDate }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tTime }}" value="{{ time }}" onChange="{{ setTime }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tPassengers }}" value="{{ pax }}" onChange="{{ setPax }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tBags }}" value="{{ bags }}" onChange="{{ setBags }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Select" label="{{ tClass }}" options="{{ classOptions }}" value="{{ klass }}" onChange="{{ setKlass }}" hint-size="100%,78px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Select" label="{{ tLocale }}" options="{{ localeOptions }}" value="{{ locale }}" onChange="{{ setLocale }}" hint-size="100%,78px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tFlight }}" value="{{ flight }}" onChange="{{ setFlight }}" hint-size="100%,76px"></x-import>
<div></div>
<div style="grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="{{ childVariant }}" onClick="{{ toggleChild }}" hint-size="auto,36px">{{ tChildSeat }}</x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="{{ stopVariant }}" onClick="{{ toggleStop }}" hint-size="auto,36px">{{ tExtraStop }}</x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="{{ overVariant }}" onClick="{{ toggleOver }}" hint-size="auto,36px">{{ tOversized }}</x-import>
</div>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tName }}" value="{{ name }}" onChange="{{ setName }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tEmail }}" value="{{ email }}" onChange="{{ setEmail }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" size="md" label="{{ tPhone }}" value="{{ phone }}" onChange="{{ setPhone }}" hint-size="100%,76px"></x-import>
</div>
<div style="margin-top:20px">
<h3 style="margin:0 0 8px;font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:600;color:var(--vt-text-muted)">{{ tFare }}</h3>
<p data-vt-no-i18n="1" style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-figure-lg);font-weight:700">{{ fareLabel }}</p>
</div>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:16px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Alert" tone="danger" title="{{ errorTitle }}" hint-size="100%,70px">{{ errorBody }}</x-import>
</div>
</sc-if>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="secondary" onClick="{{ runQuote }}" hint-size="120px,36px">{{ tQuote }}</x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" variant="primary" onClick="{{ saveTrip }}" hint-size="120px,36px">{{ tSave }}</x-import>
</div>
</x-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:900}}">
function geoSession() {
  try {
    var t = sessionStorage.getItem('vamosGeo');
    if (t && /^[0-9a-f-]{36}$/i.test(t)) return t;
    t = (crypto.randomUUID && crypto.randomUUID()) || '';
    if (t) sessionStorage.setItem('vamosGeo', t);
    return t;
  } catch (e) { return (crypto.randomUUID && crypto.randomUUID()) || ''; }
}
function placeInput(loc, text) {
  if (!loc) return null;
  var t = String(text || loc.n || '').slice(0, 200);
  if (t.length < 2) return null;
  if (loc.mapbox_id) {
    var token = loc.session_token || geoSession();
    if (token) return { kind: 'retrieve', mapbox_id: String(loc.mapbox_id).slice(0, 256), session_token: String(token).slice(0, 128), text: t };
  }
  var lng = loc.lon != null ? loc.lon : loc.lng;
  if (loc.lat != null && lng != null && isFinite(Number(loc.lat)) && isFinite(Number(lng))) {
    return { kind: 'pin', lng: Number(lng), lat: Number(loc.lat), text: t };
  }
  return null;
}
function scheduledLocal(dateIso, time) {
  var d = String(dateIso || '').slice(0, 10);
  var tm = /^\d{2}:\d{2}$/.test(time) ? time : '00:00';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  return d + 'T' + tm;
}
function fareText(rappen) {
  var n = Number(rappen);
  if (window.VamosLocale && window.VamosLocale.fromChf && Number.isFinite(n) && n > 0) return window.VamosLocale.fromChf(n);
  return window.VamosLocale ? window.VamosLocale.money('000') : 'CHF 000';
}
class Component extends DCLogic {
  state = {
    pickupText: '', dropText: '', pickupLoc: null, dropLoc: null,
    pickupHits: [], dropHits: [], pickupOpen: false, dropOpen: false,
    dateIso: '', time: '10:00', pax: '1', bags: '0', klass: 'economy', locale: 'en',
    flight: '', name: '', email: '', phone: '',
    child: false, extraStop: false, oversized: false,
    quoteId: '', lock: '', fareRappen: 0, error: '', saving: false,
  };
  _geoSeq = 0;
  goBack = () => {
    history.pushState({}, '', '/bookings');
    window.dispatchEvent(new PopStateEvent('popstate'));
  };
  setField = (key) => (e) => {
    var value = e && e.target ? e.target.value : e;
    this.setState({ [key]: value, error: '' });
  };
  search = (field, q) => {
    var token = geoSession();
    if (!token || String(q || '').trim().length < 3) {
      this.setState(field === 'pickup' ? { pickupHits: [], pickupOpen: false } : { dropHits: [], dropOpen: false });
      return;
    }
    var seq = ++this._geoSeq;
    var lang = this.state.locale || 'en';
    fetch('/api/geo/suggest?q=' + encodeURIComponent(q) + '&session_token=' + encodeURIComponent(token) + '&locale=' + encodeURIComponent(lang))
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then((j) => {
        if (seq !== this._geoSeq) return;
        var hits = ((j && j.suggestions) || []).map((hit) => ({
          label: [hit.name, hit.address || hit.context].filter(Boolean).join(' — '),
          pick: () => this.pickPlace(field, {
            n: hit.name, mapbox_id: hit.mapbox_id, session_token: token,
          }, [hit.name, hit.address || hit.context].filter(Boolean).join(', ')),
        })).filter((x) => x.label);
        if (field === 'pickup') this.setState({ pickupHits: hits, pickupOpen: hits.length > 0 });
        else this.setState({ dropHits: hits, dropOpen: hits.length > 0 });
      })
      .catch(() => {});
  };
  pickPlace = (field, loc, text) => {
    if (field === 'pickup') this.setState({ pickupLoc: loc, pickupText: text, pickupOpen: false, pickupHits: [] }, this.fireQuote);
    else this.setState({ dropLoc: loc, dropText: text, dropOpen: false, dropHits: [] }, this.fireQuote);
  };
  setPickup = (e) => { var v = e && e.target ? e.target.value : e; this.setState({ pickupText: v, pickupLoc: null }); this.search('pickup', v); };
  setDrop = (e) => { var v = e && e.target ? e.target.value : e; this.setState({ dropText: v, dropLoc: null }); this.search('drop', v); };
  extras = () => {
    var extra = {};
    if (this.state.child) extra.child_seats = 1;
    if (this.state.extraStop) extra.extra_stops = 1;
    if (this.state.oversized) extra.oversized_luggage = true;
    return extra;
  };
  fireQuote = () => {
    var pickup = placeInput(this.state.pickupLoc, this.state.pickupText);
    var dropoff = placeInput(this.state.dropLoc, this.state.dropText);
    var when = scheduledLocal(this.state.dateIso, this.state.time);
    if (!pickup || !dropoff || !when) {
      this.setState({ quoteId: '', lock: '', fareRappen: 0 });
      return;
    }
    var body = {
      locale: this.state.locale || 'en',
      display_currency: (window.VamosLocale && window.VamosLocale.cur) || 'CHF',
      mode: 'one_way',
      pickup: pickup,
      dropoff: dropoff,
      legs: [{ leg_seq: 1, scheduled_local: when, flight_no: this.state.flight ? String(this.state.flight).slice(0, 16) : null }],
      pax: Math.max(1, parseInt(this.state.pax, 10) || 1),
      bags: Math.max(0, parseInt(this.state.bags, 10) || 0),
      preferred_class: this.state.klass || 'economy',
      extras: this.extras(),
    };
    fetch('/api/quote', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then((j) => {
        if (!j || j.ok !== true) { this.setState({ error: 'quote', quoteId: '', lock: '', fareRappen: 0 }); return; }
        var slug = this.state.klass || 'economy';
        var row = ((j.classes || []).find(function (c) { return c.slug === slug; })) || (j.classes || [])[0];
        var rappen = row && row.total_rappen != null ? Number(row.total_rappen) : 0;
        this.setState({ quoteId: j.quote_id || '', lock: j.lock || '', fareRappen: rappen, error: '' });
      })
      .catch(() => this.setState({ error: 'quote', quoteId: '', lock: '', fareRappen: 0 }));
  };
  saveTrip = () => {
    if (this.state.saving) return;
    if (!this.state.quoteId || !this.state.lock) { this.setState({ error: 'need-quote' }); return; }
    var name = String(this.state.name || '').trim();
    var email = String(this.state.email || '').trim();
    var phone = String(this.state.phone || '').trim();
    if (!name || !email || !phone) { this.setState({ error: 'contact' }); return; }
    this.setState({ saving: true, error: '' });
    var idem = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
    fetch('/api/checkout/intent', {
      method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        quote_id: this.state.quoteId,
        lock: this.state.lock,
        vehicle_class: this.state.klass || 'economy',
        extras: this.extras(),
        coupon: null,
        contact: { name: name, email: email, phone: phone },
        locale: this.state.locale || 'en',
        display_currency: (window.VamosLocale && window.VamosLocale.cur) || 'CHF',
        idempotency_key: idem,
      }),
    })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then((j) => {
        this.setState({ saving: false });
        var ref = j && (j.reference || (j.data && j.data.reference));
        if (!ref) { this.setState({ error: 'save' }); return; }
        if (window.VamosOps && window.VamosOps.bookings && window.VamosOps.bookings.reset) window.VamosOps.bookings.reset();
        history.pushState({}, '', '/bookings/' + encodeURIComponent(ref));
        window.dispatchEvent(new PopStateEvent('popstate'));
      })
      .catch(() => this.setState({ saving: false, error: 'save' }));
  };
  renderVals() {
    var err = this.state.error;
    var errorTitle = err === 'quote' ? 'Quote failed' : err === 'need-quote' ? 'Quote first' : err === 'contact' ? 'Contact needed' : err === 'save' ? 'Save failed' : '';
    var errorBody = err === 'quote' ? 'Pick places from the list and check date and time.' : err === 'need-quote' ? 'Quote first. Same public fare as the site.' : err === 'contact' ? 'Name, email and mobile are required.' : err === 'save' ? 'The trip was not saved. Try again.' : '';
    return {
      tBack: 'Back to bookings', tNewTrip: 'New trip', tLead: 'Quote first. Same public fare as the site.',
      tPickup: 'Pickup', tDropoff: 'Drop-off', tDate: 'Date', tTime: 'Time', tPassengers: 'Passengers', tBags: 'Bags',
      tClass: 'Vehicle class', tLocale: 'Locale', tFlight: 'Flight', tName: 'Name', tEmail: 'Email', tPhone: 'Mobile',
      tChildSeat: 'Child seat', tExtraStop: 'Extra stop', tOversized: 'Oversized luggage', tFare: 'Fare', tQuote: 'Quote', tSave: 'Save trip',
      pickupText: this.state.pickupText, dropText: this.state.dropText,
      pickupOpen: this.state.pickupOpen, dropOpen: this.state.dropOpen,
      pickupHits: this.state.pickupHits, dropHits: this.state.dropHits,
      dateIso: this.state.dateIso, time: this.state.time, pax: this.state.pax, bags: this.state.bags,
      klass: this.state.klass, locale: this.state.locale, flight: this.state.flight,
      name: this.state.name, email: this.state.email, phone: this.state.phone,
      classOptions: [
        { value: 'economy', label: 'Economy' }, { value: 'business', label: 'Business' },
        { value: 'first', label: 'First' }, { value: 'van', label: 'Van' },
      ],
      localeOptions: [
        { value: 'en', label: 'English' }, { value: 'de', label: 'Deutsch' },
        { value: 'fr', label: 'Français' }, { value: 'ar', label: 'العربية' },
      ],
      childVariant: this.state.child ? 'primary' : 'outline',
      stopVariant: this.state.extraStop ? 'primary' : 'outline',
      overVariant: this.state.oversized ? 'primary' : 'outline',
      toggleChild: () => this.setState((s) => ({ child: !s.child }), this.fireQuote),
      toggleStop: () => this.setState((s) => ({ extraStop: !s.extraStop }), this.fireQuote),
      toggleOver: () => this.setState((s) => ({ oversized: !s.oversized }), this.fireQuote),
      setPickup: this.setPickup, setDrop: this.setDrop,
      setDate: this.setField('dateIso'), setTime: this.setField('time'),
      setPax: this.setField('pax'), setBags: this.setField('bags'),
      setKlass: (e) => this.setState({ klass: e && e.target ? e.target.value : e }, this.fireQuote),
      setLocale: this.setField('locale'), setFlight: this.setField('flight'),
      setName: this.setField('name'), setEmail: this.setField('email'), setPhone: this.setField('phone'),
      fareLabel: fareText(this.state.fareRappen),
      hasError: !!err, errorTitle: errorTitle, errorBody: errorBody,
      runQuote: this.fireQuote, saveTrip: this.saveTrip, goBack: this.goBack,
    };
  }
}
</script>
</body>
</html>
