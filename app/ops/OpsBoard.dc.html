        { key:'total', header: t.colTotal, width:'96px', align:'right', render: () => 'CHF 000' },

      visibleRows, openRow: this.openRow,
      filtRef: this._filtRef, openNew: this.openNew, addTick: this.state.addTick || 0,
      tNoun: t.noun, tNounPlural: t.nounPlural, tEditBooking: t.editBooking, tDeleteBooking: t.deleteBooking,
      tEmptyTitle: t.emptyTitle, tEmptyBody: t.emptyBody, tDeleteBody: t.deleteBody, tAddChauffeur: t.addChauffeur,
      editorRows: BOOKINGS,
      editorColumns: [{ key:'id', header: t.colRef, width:'96px' }],
      editorSearchKeys: ['id','customer','pickup','dropoff'],
      editorBlank: () => (ops ? ops.bookings.blank() : {}),
      editorSave: (rec) => { if (ops) ops.bookings.upsert(rec); },
      editorDelete: (id) => { if (ops) ops.bookings.remove(id); },
      editorFields: [
        { key:'id', label:t.fRef, half:true, required:true, placeholder:'VT-0000' },
        { key:'customer', label:t.fCustomer, half:true },
        { key:'date', label:t.fDate, editor:'date', half:true, required:true },
        { key:'time', label:t.fTime, editor:'time', half:true, placeholder:'00:00' },
        { key:'pickup', label:t.fPickup },
        { key:'dropoff', label:t.fDropoff },
        { key:'klass', label:t.fClass, editor:'select', options:formClass, icon:'car', half:true },
        { key:'status', label:t.fStatus, editor:'select', options:formStatus, icon:'settings', half:true },
        { key:'pax', label:t.fPax, editor:'number', min:1, half:true },
        { key:'bags', label:t.fBags, editor:'number', min:0, half:true },
        { key:'chauffeur', label:t.fChauffeur, editor:'select', options:chauffeurOptions, icon:'user', half:true, addLabel:t.addChauffeur, emptyLabel:t.none },
        { key:'flight', label:t.fFlight, half:true },
        { key:'note', label:t.fNote, editor:'area' },
      ],
      nestedFields: [
        { key:'name', label:t.cName, half:true, required:true },
        { key:'phone', label:t.cPhone, half:true, placeholder:'+41 00 000 00 00' },
        { key:'licence', label:t.cLicence, half:true },
        { key:'status', label:t.fStatus, editor:'select', options:((ops && ops.CHAUFFEUR_STATUS) || []).map((s) => ({ value:s, label:s })), icon:'user', half:true },
      ],
      nestedBlank: () => (ops ? ops.chauffeurs.blank() : {}),
      onNestedSave: (rec) => { if (ops) ops.chauffeurs.upsert(rec); },
    };
  }
}
</script>
</body>
