<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
[data-rate-grid]{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){[data-rate-grid]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){[data-price-rail]{position:sticky;top:24px}}
[data-set-grid]{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:960px){[data-set-grid]{grid-template-columns:280px minmax(0,1fr);align-items:start}}
</style>
</helmet>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle)">
<div style="min-width:0">
<h1 style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking)">{{ tTitle }}</h1>
<p style="margin:4px 0 0;font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tSubtitle }}</p>
</div>
<sc-if value="{{ showPublish }}" hint-placeholder-val="{{ true }}">
<div data-price-head-publish="1" style="margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px">
<p data-publish-error="1" style="display:{{ publishErrorDisplay }};margin:0;font-size:var(--vt-body-xs);color:var(--vt-danger);text-align:end">{{ tPublishError }}</p>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="sm" onClick="{{ publish }}" disabled="{{ publishDisabled }}" hint-size="120px,36px">{{ tPublish }}</x-import>
</div>
</sc-if>
</header>

<div data-set-grid="1" style="padding:26px 32px 44px">

<div data-price-rail="1" style="display:flex;flex-direction:column;gap:14px;min-width:0">
<nav data-set-rail="1" aria-label="{{ tTitle }}">
<sc-for list="{{ panes }}" as="p" hint-placeholder-count="3">
<button type="button" data-set-item="1" data-on="{{ p.on }}" onClick="{{ p.pick }}" title="{{ p.label }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ p.icon }}" size="{{ n18 }}" color="currentColor" hint-size="18px,18px"></x-import>
<span style="flex:1 1 auto;min-width:0">
<span style="display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.label }}</span>
<span data-set-hint="1">{{ p.hint }}</span>
</span>
</button>
</sc-for>
</nav>

<aside role="note" style="box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:var(--vt-bg-inverse);border-radius:var(--vt-radius-lg);min-width:0">
<span style="font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-accent)">{{ tAlertTitle }}</span>
<p style="margin:0;font-size:var(--vt-body-xs);line-height:1.55;color:var(--vt-text-inverse-muted);text-wrap:pretty">{{ tAlertBody }}</p>
</aside>

<sc-if value="{{ showPublish }}" hint-placeholder-val="{{ true }}">
<aside data-pricing-publish="1" role="region" aria-label="{{ tCompletenessTitle }}" style="box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:var(--vt-bg-surface);border:1px solid var(--vt-charcoal-900);border-radius:var(--vt-radius-lg);min-width:0">
<span style="font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-charcoal-900)">{{ tCompletenessTitle }}</span>
<p style="margin:0;font-size:var(--vt-body-xs);line-height:1.55;color:var(--vt-text-muted);text-wrap:pretty">{{ tCompletenessBody }}</p>
<ul data-gap-list="1" style="display:{{ gapListDisplay }};margin:0;padding:0;padding-inline-start:1.1em;font-size:var(--vt-body-xs);color:var(--vt-danger)">
<sc-for list="{{ gaps }}" as="g" hint-placeholder-count="3">
<li data-vt-no-i18n="1">{{ g.label }}</li>
</sc-for>
</ul>
</aside>
</sc-if>
</div>

<div style="display:flex;flex-direction:column;gap:16px;min-width:0">

<sc-if value="{{ isRoutes }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Badge" tone="outline" hint-size="150px,26px">{{ tRoutesConfigured }}</x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Badge" tone="inverse" hint-size="110px,26px">{{ tNotLive }}</x-import>
</div>
<dc-import name="OpsTable" rows="{{ routes }}" columns="{{ routeColumns }}" fields="{{ routeFields }}" blank="{{ routeBlank }}" onSave="{{ saveRoute }}" onDelete="{{ deleteRoute }}" noun="{{ tNounRoute }}" noun-plural="{{ tNounRoutes }}" add-title="{{ tAddRoute }}" edit-title="{{ tEditRoute }}" delete-title="{{ tDeleteRouteTitle }}" label-key="routeLabel" add-label="{{ tAddRoute }}" search-placeholder="{{ tSearchRoutes }}" search-keys="{{ routeSearchKeys }}" empty-title="{{ tEmptyRoutesTitle }}" empty-body="{{ tEmptyRoutesBody }}" delete-body="{{ tDeleteRouteBody }}" hint-size="100%,420px"></dc-import>
</sc-if>

<sc-if value="{{ isDistance }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsTable" rows="{{ distanceRows }}" columns="{{ distanceColumns }}" fields="{{ distanceFields }}" blank="{{ distanceBlank }}" onSave="{{ saveDistance }}" onDelete="{{ deleteDistance }}" noun="{{ tNounDistance }}" noun-plural="{{ tNounDistances }}" add-title="{{ tAddDistance }}" edit-title="{{ tEditDistance }}" delete-title="{{ tDeleteDistanceTitle }}" label-key="klass" add-label="{{ tAddDistance }}" search-placeholder="{{ tSearchDistance }}" search-keys="{{ distanceSearchKeys }}" empty-title="{{ tEmptyDistanceTitle }}" empty-body="{{ tEmptyDistanceBody }}" delete-body="{{ tDeleteDistanceBody }}" hint-size="100%,420px"></dc-import>
<dc-import name="OpsTable" rows="{{ bandRows }}" columns="{{ bandColumns }}" fields="{{ bandFields }}" blank="{{ bandBlank }}" onSave="{{ saveBand }}" onDelete="{{ deleteBand }}" noun="{{ tNounBand }}" noun-plural="{{ tNounBands }}" add-title="{{ tAddBand }}" edit-title="{{ tEditBand }}" delete-title="{{ tDeleteBandTitle }}" label-key="fromKm" add-label="{{ tAddBand }}" search-placeholder="{{ tSearchBands }}" search-keys="{{ bandSearchKeys }}" empty-title="{{ tEmptyBandsTitle }}" empty-body="{{ tEmptyBandsBody }}" delete-body="{{ tDeleteBandBody }}" hint-size="100%,280px"></dc-import>
<dc-import name="OpsTable" rows="{{ regionRows }}" columns="{{ regionColumns }}" fields="{{ regionFields }}" blank="{{ regionBlank }}" onSave="{{ saveRegion }}" onDelete="{{ deleteRegion }}" noun="{{ tNounRegion }}" noun-plural="{{ tNounRegions }}" add-title="{{ tAddRegion }}" edit-title="{{ tEditRegion }}" delete-title="{{ tDeleteRegionTitle }}" label-key="zone" add-label="{{ tAddRegion }}" search-placeholder="{{ tSearchRegions }}" search-keys="{{ regionSearchKeys }}" empty-title="{{ tEmptyRegionsTitle }}" empty-body="{{ tEmptyRegionsBody }}" delete-body="{{ tDeleteRegionBody }}" hint-size="100%,280px"></dc-import>
</sc-if>

<sc-if value="{{ isSurcharges }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsTable" rows="{{ surcharges }}" columns="{{ surchargeColumns }}" fields="{{ surchargeFields }}" blank="{{ surchargeBlank }}" onSave="{{ saveSurcharge }}" onDelete="{{ deleteSurcharge }}" noun="{{ tNounSurcharge }}" noun-plural="{{ tNounSurcharges }}" add-title="{{ tAddSurcharge }}" edit-title="{{ tEditSurcharge }}" delete-title="{{ tDeleteSurchargeTitle }}" label-key="label" add-label="{{ tAddSurcharge }}" search-placeholder="{{ tSearchSurcharges }}" search-keys="{{ surchargeSearchKeys }}" empty-title="{{ tEmptySurchargesTitle }}" empty-body="{{ tEmptySurchargesBody }}" delete-body="{{ tDeleteSurchargeBody }}" hint-size="100%,420px"></dc-import>
</sc-if>

</div>
</div>
</main>

</x-dc>

class Component extends DCLogic {
  state = {
    lang: (typeof localStorage !== 'undefined' && localStorage.getItem('vamosLang')) || 'en',
    cur: (typeof window !== 'undefined' && window.VamosLocale) ? window.VamosLocale.cur() : 'CHF',
    pane: 'routes',
    draftId: null,
    gaps: [],
    publishCode: '',
  };
  bind = () => {
    if (!window.VamosOps) { this._retry = setTimeout(this.bind, 120); return; }
    this._off = window.VamosOps.onAny(() => this.forceUpdate());
    this.loadDraft();
    this.forceUpdate();
  };
  componentDidMount() {
    this.bind();
    this._onLocale = (e) => this.setState({ lang: e.detail.lang, cur: e.detail.cur });
    window.addEventListener('vamos:locale', this._onLocale);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang(), cur: window.VamosLocale.cur() });
  }
  componentWillUnmount() {
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    if (this._off) this._off();
    clearTimeout(this._retry);
  }
  updateRate(id, patch) { if (window.VamosOps) window.VamosOps.rates.update(id, patch); }
  /* Row saves: VamosOps.routes, VamosOps.rates, VamosOps.surcharges, VamosOps.bands, VamosOps.regionPremiums → PUT /api/staff/rate-book (06-02). */
  loadDraft() {
    const api = window.VamosOpsApi;
    if (!api || typeof api.request !== 'function') return;
    api.request('GET', '/api/staff/rate-versions').then((json) => {
      const versions = json && json.ok && json.data && Array.isArray(json.data.versions) ? json.data.versions : [];
      const draft = versions.find((v) => v.status === 'draft') || null;
      const draftId = draft ? draft.id : null;
      this.setState({ draftId });
      if (!draftId) { this.setState({ gaps: [] }); return; }
      api.request('GET', '/api/staff/rate-versions/' + draftId).then((j2) => {
        const gaps = j2 && j2.ok && j2.data && Array.isArray(j2.data.gaps) ? j2.data.gaps : [];
        this.setState({ gaps });
      });
    });
  }
  publish = () => {
    const api = window.VamosOpsApi;
    const id = this.state.draftId;
    if (!api || !id || (this.state.gaps && this.state.gaps.length)) return;
    api.request('POST', '/api/staff/rate-versions/' + id + '/publish').then((json) => {
      if (json && json.ok) {
        this.setState({ publishCode: '', gaps: [] });
        this.loadDraft();
        return;
      }
      const gaps = (json && Array.isArray(json.gaps)) ? json.gaps : this.state.gaps;
      this.setState({ publishCode: (json && json.code) || 'unknown', gaps });
      this.loadDraft();
    }, () => {
      this.setState({ publishCode: 'network' });
    });
  };

  publishReason(code, t) {
    if (!code) return '';
    const mapped = t.publishByCode && t.publishByCode[code];
    if (mapped) return mapped;
    return t.publishError + ' (' + code + ')';
  }

  renderVals() {
    const t = T[this.state.lang] || T.en;
    const ops = window.VamosOps;
    const pane = this.state.pane;
    const cur = this.state.cur;
    const RAIL = {
      routes: [t.tabRoutes, t.hintRoutes], distance: [t.tabDistance, t.hintDistance],
      surcharges: [t.tabSurcharges, t.hintSurcharges],
    };
    const routesRaw = ops ? ops.routes.all() : [];
    const surchargesRaw = ops ? ops.surcharges.all() : [];
    const rates = ops ? ops.rates.all() : [];
    const liveCount = routesRaw.filter((r) => r.live).length;
    const money = (v) => {
      if (v === 0 || v === '0') return window.VamosLocale ? window.VamosLocale.money(v) : cur + ' ' + v;
      if (v === null || v === undefined || v === '') return cur + ' 000';
      return window.VamosLocale ? window.VamosLocale.money(v) : cur + ' ' + v;
    };
    const profile = ops && ops.profile ? ops.profile.get() : {};
    const role = profile.role || '';
    const rawGaps = this.state.gaps || [];
    const gapKind = (kind) => {
      if (kind === 'distance_rate') return t.gapDistance;
      if (kind === 'surcharge') return t.gapSurcharge;
      return t.gapRoute;
    };
    const gaps = rawGaps.map((g) => ({
      label: gapKind(g.kind) + ': ' + (g.name || g.id || ''),
    }));
    const hasDraft = this.state.draftId != null;
    const hasGaps = rawGaps.length > 0;
    const completenessBody = !hasDraft ? t.completenessEmpty : hasGaps ? t.completenessGaps(rawGaps.length) : t.completenessReady;
    const locationOptions = ((ops && ops.LOCATIONS) || []).map((l) => ({ value: l, label: l }));
    const currencyOptions = ((ops && ops.CURRENCIES) || ['CHF', 'EUR', 'USD']).map((c) => ({ value: c, label: c }));
    const setCur = (v) => { if (window.VamosLocale) window.VamosLocale.setCur(v); };

    return {
      n1: 1, n18: 18,
      tTitle: t.title, tSubtitle: t.subtitle, tAlertTitle: t.alertTitle, tAlertBody: t.alertBody,
      panes: PANES.map((p) => ({

      isRoutes: pane === 'routes', isDistance: pane === 'distance', isSurcharges: pane === 'surcharges',
      showPublish: role === 'admin',
      tCompletenessTitle: t.completenessTitle,
      tCompletenessBody: completenessBody,
      tPublish: t.publish,
      tPublishError: this.publishReason(this.state.publishCode, t),
      gaps,
      gapListDisplay: hasGaps ? 'block' : 'none',
      publishErrorDisplay: this.state.publishCode ? 'block' : 'none',
      publishDisabled: !hasDraft || hasGaps,
      publish: this.publish,

      tRoutesConfigured: t.routesConfigured(routesRaw.length), tNotLive: t.notLive(routesRaw.length - liveCount),
      routes: routesRaw.map((r) => Object.assign({}, r, {
        routeLabel: r.from + ' \u2192 ' + r.to,
        economy: (r.economy && r.economy[cur]) || '',

        van: (r.van && r.van[cur]) || '',

      routeColumns: [
        { key:'id', header: t.colId, width:'88px', kind:'mono' },

        { key:'van', header: t.colVan, align:'right', width:'88px', lookup:(r) => money(r.van) },
        { key:'live', header: t.colLive, width:'92px', kind:'bool', onLabel:t.live, offLabel:t.draft },
      ],

        { key:'from', label:t.colFrom, editor:'select', options:locationOptions, half:true, required:true, icon:'map-pin' },

        { key:'economy', label:t.colEconomy, half:true, placeholder:'000', hint:t.hRoutePrice, icon:'banknote', suffix:cur },

        const blank = ops ? ops.routes.blank() : { economy:{}, business:{}, first:{}, van:{} };

      },

        toggleAvailable: (e) => this.updateRate(r.id, { available: e.target.checked }),
      })),
      tBaseFare: t.baseFare, tPerKm: t.perKm, tMinFare: t.minFare, tMaxPax: t.maxPax, tAvailable: t.available,
      tCapacityLabel: t.capacitySection,

        id: r.id,
        fromKm: r.fromKm,
        toKm: r.toKm === '' || r.toKm == null ? '' : r.toKm,
        perKm: (r.perKm && r.perKm[cur]) || '',
      })),
      bandColumns: [
        { key:'fromKm', header: t.fromKm, width:'110px' },
        { key:'toKm', header: t.toKm, width:'110px', lookup:(r) => (r.toKm === '' || r.toKm == null ? t.openBand : r.toKm) },
        { key:'perKm', header: t.perKm, align:'right', width:'110px', lookup:(r) => money(r.perKm) },
      ],
      bandFields: [
        { key:'fromKm', label:t.fromKm, editor:'number', min:0, half:true, icon:'navigation' },
        { key:'toKm', label:t.toKm, editor:'number', min:0, half:true, icon:'navigation', hint:t.openBand },
        { key:'currency', label:t.currencyLabel, editor:'select', options:currencyOptions, value:cur, onSelect:setCur, half:true, icon:'banknote', hint:t.hCurrencyField },
        { key:'perKm', label:t.perKm, half:true, placeholder:'0.00', icon:'navigation', suffix:cur },
      ],
      bandBlank: () => {
        const blank = ops ? ops.bands.blank() : { fromKm:0, toKm:'', perKm:{} };
        return Object.assign({}, blank, { perKm:'' });
      },
      saveBand: (rec) => {
        if (!ops) return;
        const existing = rec.id ? ops.bands.get(rec.id) : null;
        ops.bands.upsert({
          id: rec.id,
          fromKm: rec.fromKm,
          toKm: rec.toKm,
          perKm: Object.assign({}, (existing && existing.perKm) || {}, { [cur]: rec.perKm }),
        });
      },
      deleteBand: (id) => { if (ops) ops.bands.remove(id); },
      tNounBand: t.nounBand, tNounBands: t.nounBands,
      tAddBand: t.addBand, tEditBand: t.editBand,
      tDeleteBandTitle: t.deleteBandTitle, tDeleteBandBody: t.deleteBandBody,
      tSearchBands: t.searchBands, bandSearchKeys: ['fromKm', 'toKm'],
      tEmptyBandsTitle: t.emptyBandsTitle, tEmptyBandsBody: t.emptyBandsBody,

      regionRows: (ops ? ops.regionPremiums.all() : []).map((r) => Object.assign({}, r, {
        percent: r.percent || '',
      })),
      regionColumns: [
        { key:'zone', header: t.colZone },
        { key:'percent', header: t.colPercent, align:'right', width:'110px', lookup:(r) => (r.percent ? r.percent + '%' : '00%') },
      ],
      regionFields: [
        { key:'zone', label:t.colZone, editor:'select', required:true, icon:'map-pin',
          options: ((ops && ops.ZONES && ops.ZONES.length) ? ops.ZONES.map((z) => ({ value: z.label || z.slug, label: z.label || z.slug })) : locationOptions) },
        { key:'percent', label:t.colPercent, placeholder:'00', icon:'banknote', suffix:'%' },
      ],
      regionBlank: () => (ops ? ops.regionPremiums.blank() : { zone:'', zoneId:'', percent:'' }),
      saveRegion: (rec) => {
        if (!ops) return;
        const zones = (ops.ZONES || []).slice();
        const hit = zones.filter((z) => (z.label || z.slug) === rec.zone || z.id === rec.zoneId)[0];
        ops.regionPremiums.upsert({
          id: rec.id,
          zone: rec.zone,
          zoneId: hit ? hit.id : rec.zoneId,
          percent: rec.percent,
        });
      },
      deleteRegion: (id) => { if (ops) ops.regionPremiums.remove(id); },
      tNounRegion: t.nounRegion, tNounRegions: t.nounRegions,
      tAddRegion: t.addRegion, tEditRegion: t.editRegion,
      tDeleteRegionTitle: t.deleteRegionTitle, tDeleteRegionBody: t.deleteRegionBody,
      tSearchRegions: t.searchRegions, regionSearchKeys: ['zone'],
      tEmptyRegionsTitle: t.emptyRegionsTitle, tEmptyRegionsBody: t.emptyRegionsBody,

      surcharges: surchargesRaw.map((r) => Object.assign({}, r, {
        value: r.kind === 'percent' ? r.pct : r.kind === 'amount' ? ((r.amounts && r.amounts[cur]) || '') : '',
      })),
      surchargeColumns: [
        { key:'label', header: t.colRule, lookup:(r) => {
          const hit = SURCHARGE_CODES.filter((c) => c.value === r.label)[0];
          return hit ? t[hit.k] : r.label;
        } },
        { key:'rule', header: t.colAppliesWhen, lookup:(r) => (r.rule === 'booking' ? t.applyBooking : t.applyLeg) },
        { key:'value', header: t.colAmount, align:'right', width:'150px',
          lookup:(r) => (r.kind === 'included' ? t.included : r.kind === 'percent' ? '+ ' + (r.value || '00') + '%' : money(r.value)) },
      ],
      surchargeFields: [
        { key:'label', label:t.colRule, editor:'select', required:true, icon:'banknote',
          options: SURCHARGE_CODES.map((c) => ({ value: c.value, label: t[c.k] })),
          hint: t.hRule },
        { key:'rule', label:t.colAppliesWhen, editor:'select', required:true, icon:'clock',
          options: [{ value:'leg', label:t.applyLeg }, { value:'booking', label:t.applyBooking }],
          hint: t.hApplies },
        { key:'kind', label:t.fUnit, editor:'select', icon:'banknote', half:true,
          options:[{ value:'amount', label:t.unitAmount }, { value:'percent', label:t.unitPct }, { value:'included', label:t.unitIncluded }] },
        { key:'currency', label:t.currencyLabel, editor:'select', options:currencyOptions, value:cur, onSelect:setCur, half:true, icon:'banknote', hint:t.hCurrencyField },
        { key:'value', label:t.colAmount, placeholder:'00', hint:t.hSurchargeValue(cur), icon:'banknote' },
      ],
      surchargeBlank: () => {
        const blank = ops ? ops.surcharges.blank() : { kind:'amount', amounts:{}, pct:'' };
        return Object.assign({}, blank, { value:'', label: blank.label || 'night', rule: blank.rule || 'leg' });
      },
      saveSurcharge: (rec) => {
        if (!ops) return;
        const existing = rec.id ? ops.surcharges.get(rec.id) : null;
        const patch = { id: rec.id, label: rec.label, rule: rec.rule, kind: rec.kind };
        if (rec.kind === 'percent') {
          patch.pct = rec.value; patch.amounts = existing ? existing.amounts : undefined;
        } else if (rec.kind === 'amount') {
          const base = (existing && existing.amounts) || {};
          patch.amounts = Object.assign({}, base, { [cur]: rec.value });
          patch.pct = existing ? existing.pct : undefined;
        } else {
          patch.pct = existing ? existing.pct : undefined;
          patch.amounts = existing ? existing.amounts : undefined;
        }
        ops.surcharges.upsert(patch);
      },
      deleteSurcharge: (id) => { if (ops) ops.surcharges.remove(id); },
      tNounSurcharge: t.nounSurcharge, tNounSurcharges: t.nounSurcharges,
      tAddSurcharge: t.addSurcharge, tEditSurcharge: t.editSurcharge,
      tDeleteSurchargeTitle: t.deleteSurchargeTitle, tDeleteSurchargeBody: t.deleteSurchargeBody,
      tSearchSurcharges: t.searchSurcharges, surchargeSearchKeys: ['label', 'rule'],
      tEmptySurchargesTitle: t.emptySurchargesTitle, tEmptySurchargesBody: t.emptySurchargesBody,
    };
  }
}

</script>
</body>
</html>
