<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle)">
<div style="min-width:0">
<sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
<a href="/fleet/chauffeurs" style="display:inline-block;margin:0 0 6px;font-size:var(--vt-body-xs);color:var(--vt-text-muted);text-decoration:none">{{ tBack }}</a>
</sc-if>
<h1 style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking)">{{ title }}</h1>
<p style="margin:4px 0 0;font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ subtitle }}</p>
</div>
<div style="margin-inline-start:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Tag" active="{{ t.active }}" onClick="{{ t.go }}" hint-size="120px,34px">{{ t.label }}</x-import>
</sc-for>
</div>
</header>

<div style="padding:26px 32px 48px;display:flex;flex-direction:column;gap:20px;min-width:0">

<sc-if value="{{ hasSaveMsg }}" hint-placeholder-val="{{ false }}">
<p style="margin:0;max-width:78ch;font-size:var(--vt-body-xs);line-height:1.6;color:var(--vt-danger);text-wrap:pretty">{{ saveMsg }}</p>
</sc-if>
<sc-if value="{{ hasNotice }}" hint-placeholder-val="{{ false }}">
<p style="margin:0;max-width:78ch;font-size:var(--vt-body-xs);line-height:1.6;color:var(--vt-text-muted);text-wrap:pretty">{{ notice }}</p>
</sc-if>

<sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:20px">
<sc-if value="{{ hasNoEmail }}" hint-placeholder-val="{{ false }}">
<p style="margin:0;max-width:78ch;font-size:var(--vt-body-sm);line-height:1.55;color:var(--vt-text-primary);text-wrap:pretty">{{ tNoEmail }}</p>
</sc-if>
<div style="box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:18px 20px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-lg)">
<span style="font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-muted)">{{ tProfile }}</span>
<sc-for list="{{ profileRows }}" as="p" hint-placeholder-count="6">
<div style="display:grid;grid-template-columns:minmax(8rem,12rem) minmax(0,1fr);gap:8px 16px;align-items:baseline">
<span style="font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-muted)">{{ p.label }}</span>
<span style="font-size:var(--vt-body-sm);color:var(--vt-text-primary)">{{ p.value }}</span>
</div>
</sc-for>
</div>
<div style="box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:18px 20px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-lg)">
<span style="font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-muted)">{{ tLiveTrips }}</span>
<sc-if value="{{ noLiveTrips }}" hint-placeholder-val="{{ true }}">
<p style="margin:0;font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tNoLiveTrips }}</p>
</sc-if>
<sc-for list="{{ liveTrips }}" as="trip" hint-placeholder-count="2">
<a href="{{ trip.href }}" style="box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-md);background:var(--vt-grey-50);text-decoration:none;color:inherit">
<span style="font-family:var(--vt-font-display);font-weight:600;letter-spacing:.04em">{{ trip.ref }}</span>
<span style="min-width:0;font-size:var(--vt-body-sm);color:var(--vt-text-secondary)">{{ trip.route }}</span>
<span style="margin-inline-start:auto;font-size:var(--vt-body-xs);color:var(--vt-text-muted);white-space:nowrap">{{ trip.when }}</span>
</a>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:16px">
<sc-for list="{{ counts }}" as="c" hint-placeholder-count="3">
<div style="box-sizing:border-box;display:flex;flex-direction:column;gap:10px;min-height:120px;padding:18px 20px;background:var(--vt-bg-surface);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-lg)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
<span style="font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-muted)">{{ c.label }}</span>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ c.icon }}" size="{{ n18 }}" color="var(--vt-text-muted)" hint-size="18px,18px"></x-import>
</div>
<span style="display:flex;align-items:baseline;gap:8px;font-family:var(--vt-font-display);font-size:var(--vt-figure-lg);font-weight:var(--vt-weight-bold);line-height:1;color:var(--vt-text-primary)">{{ c.value }}<span style="font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:400;color:var(--vt-text-muted)">{{ c.of }}</span></span>
<span style="margin-top:auto;font-size:var(--vt-body-xs);line-height:1.45;color:var(--vt-text-muted)">{{ c.foot }}</span>
</div>
</sc-for>
</div>

<dc-import name="OpsTable" rows="{{ rows }}" columns="{{ columns }}" fields="{{ fields }}" blank="{{ blank }}" onSave="{{ onSave }}" onDelete="{{ onDelete }}" noun="{{ noun }}" noun-plural="{{ nounPlural }}" add-title="{{ addTitle }}" edit-title="{{ editTitle }}" delete-title="{{ deleteTitle }}" label-key="{{ labelKey }}" add-label="{{ addLabel }}" search-placeholder="{{ searchPlaceholder }}" search-keys="{{ searchKeys }}" empty-title="{{ emptyTitle }}" empty-body="{{ emptyBody }}" delete-body="{{ deleteBody }}" nested-title="{{ nestedTitle }}" nested-fields="{{ nestedFields }}" nested-blank="{{ nestedBlank }}" nested-save-label="{{ nestedSaveLabel }}" nested-target-key="{{ nestedTargetKey }}" on-nested-save="{{ onNestedSave }}" hint-size="100%,460px"></dc-import>

<p style="margin:0;max-width:78ch;font-size:var(--vt-body-xs);line-height:1.6;color:var(--vt-text-muted);text-wrap:pretty">{{ note }}</p>
</sc-if>

</div>
</main>
</x-dc>

    saveFailed:'فشل الحفظ. حاول مرة أخرى.',
    offRoadStay:'هذه المركبة خارج الخدمة. الرحلات المسندة القادمة تبقى على اللوحة — لا تُلغى. عالجها في Needs attention.',
    backChauffeurs:'كل السائقين',
  },
};

class Component extends DCLogic {
  state = { lang: 'en', saveMsg: '', notice: '' };
  bind = () => {
    if (!window.VamosOps) { this._retry = setTimeout(this.bind, 120); return; }
    this._off = window.VamosOps.onAny(() => this.forceUpdate());
    this.forceUpdate();
  };
  componentDidMount() {
    this.bind();
    this._onLocale = (e) => this.setState({ lang: e.detail.lang, cur: e.detail.cur });
    window.addEventListener('vamos:locale', this._onLocale);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang() });
  }
  componentWillUnmount() {
    if (this._off) this._off();
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    clearTimeout(this._retry);
  }

  renderVals() {
    const t = T[this.state.lang] || T.en;
    const ops = window.VamosOps;
    const isChauffeurs = (this.props.section || 'vehicles') === 'chauffeurs';
    const chauffeurId = String(this.props.chauffeurId || this.props['chauffeur-id'] || '');
    const isDetail = isChauffeurs && !!chauffeurId;
    const isList = !isDetail;
    const vehicles = ops ? ops.vehicles.all() : [];
    const chauffeurs = ops ? ops.chauffeurs.all() : [];

    const vehicleById = {};
    vehicles.forEach((v) => { vehicleById[v.id] = v; });
    const chauffeurByVehicle = {};
    chauffeurs.forEach((c) => { if (c.vehicle) chauffeurByVehicle[c.vehicle] = c; });

    const inService = vehicles.filter((v) => v.status === 'service').length;
    const onShift = chauffeurs.filter((c) => c.status === 'shift').length;
    const paired = chauffeurs.filter((c) => c.vehicle).length;
    const largest = vehicles.reduce((n, v) => Math.max(n, v.seats), 0);

    const vehicleLabel = (v) => v.klass + ' · ' + (v.plate || v.id);
    const classOptions = ((ops && ops.VEHICLE_CLASSES) || ['Economy', 'Business', 'First', 'Van']).map((c) => ({ value: c, label: c }));
    const vStatusOptions = (ops ? ops.VEHICLE_STATUS : []).map((s) => ({ value: s, label: VSTATUS[s].label }));
    const cStatusOptions = (ops ? ops.CHAUFFEUR_STATUS : []).map((s) => ({ value: s, label: CSTATUS[s].label }));
    const vehicleOptions = [{ value:'', label: t.none }].concat(vehicles.map((v) => ({ value: v.id, label: vehicleLabel(v) })));
    const chauffeurOptions = chauffeurs.map((c) => ({ value: c.id, label: c.name || c.id }));

    const vehicleColumns = [
      { key:'klass', header:t.colVehicle, kind:'stack', subKey:'model' },
      { key:'plate', header:t.colPlate, width:'132px', kind:'mono' },
      { key:'cap', header:t.colCapacity, width:'128px', lookup:(r) => r.seats + ' / ' + r.bags },
      { key:'base', header:t.colBase, width:'108px', align:'right', kind:'money' },
      { key:'chauffeur', header:t.colChauffeur, width:'150px', kind:'need', emptyLabel:t.unassigned,
        lookup:(r) => {
          const list = chauffeurs.filter((c) => c.vehicle === r.id || c.defaultVehicleId === r.id);
          if (!list.length) return '';
          return React.createElement('span', null, list.map((c, i) => [
            i ? ', ' : null,
            React.createElement('a', {
              key: c.id,
              href: '/fleet/chauffeurs/' + encodeURIComponent(c.id),
              style: { color: 'inherit', textDecoration: 'none' },
            }, c.name || c.id),
          ]));
        } },
      { key:'status', header:t.colStatus, width:'150px', kind:'badge', tones:VSTATUS },
    ];
    const chauffeurColumns = [
      { key:'name', header:t.colChauffeur, lookup:(r) => React.createElement('span', {
          style: { display:'flex', flexDirection:'column', gap:2, lineHeight:1.3, minWidth:0 },
        },
        React.createElement('a', {
          href: '/fleet/chauffeurs/' + encodeURIComponent(r.id),
          style: { color: 'inherit', textDecoration: 'none', fontWeight: 500 },
        }, r.name || r.id),
        r.phone ? React.createElement('span', { style:{ fontSize:'var(--vt-body-xs)', color:'var(--vt-text-muted)' } }, r.phone) : null,
      ) },
      { key:'vehicle', header:t.colVehicle, width:'190px', kind:'need', emptyLabel:t.noVehicle,
        lookup:(r) => (vehicleById[r.vehicle || r.defaultVehicleId] ? vehicleLabel(vehicleById[r.vehicle || r.defaultVehicleId]) : '') },
      { key:'licence', header:t.colLicence, width:'140px', kind:'mono' },
      { key:'status', header:t.colStatus, width:'150px', kind:'badge', tones:CSTATUS },
    ];

    const vehicleFields = [
      { key:'photo', label:t.fPhoto, editor:'photo', photoKind:'vehicle', upload:'/api/photos/upload', clearLabel:t.clearPhoto, chooseLabel:t.choosePhoto, hint:t.hPhoto },
      { key:'klass', label:t.fClass, editor:'select', options:classOptions, icon:'car', half:true, hint:t.hClass, required:true },
      { key:'model', label:t.fModel, half:true, placeholder:'Sedan or similar' },
      { key:'plate', label:t.fPlate, half:true, placeholder:'ZH 000 000', required:true },
      { key:'year', label:t.fYear, editor:'year', half:true, placeholder:'0000' },
      { key:'seats', label:t.fSeats, editor:'number', min:1, half:true },
      { key:'bags', label:t.fBags, editor:'number', min:0, half:true },
      { key:'chauffeurIds', label:t.fChauffeurs, editor:'select', multi:true, options:chauffeurOptions, icon:'users', addLabel:t.addChauffeur, emptyLabel:t.unassigned, half:true },
      { key:'status', label:t.fStatus, editor:'select', options:vStatusOptions, icon:'settings', half:true },
      { key:'note', label:t.fNote, editor:'area', placeholder:'' },
    ];
    const chauffeurFields = [
      { key:'photo', label:t.fPhoto, editor:'photo', photoKind:'chauffeur', upload:'/api/photos/upload', clearLabel:t.clearPhoto, chooseLabel:t.choosePhoto, hint:t.hPhoto },
      { key:'name', label:t.fName, half:true, required:true },
      { key:'phone', label:t.fPhone, editor:'phone', half:true, placeholder:'+41 00 000 00 00' },
      { key:'email', label:t.fEmail, half:true, placeholder:'name@example.com' },
      { key:'licence', label:t.fLicence, editor:'licence', half:true, placeholder:'CH 000 000', required:true },
      { key:'vehicle', label:t.fVehicle, editor:'select', options:vehicleOptions, icon:'car', hint:t.hVehicle, addLabel:t.addVehicle, emptyLabel:t.noVehicle },
      { key:'languages', label:t.fLanguages, editor:'select', multi:true, options:LANGUAGE_OPTIONS, icon:'globe', half:true },
      { key:'status', label:t.fStatus, editor:'select', options:cStatusOptions, icon:'user', half:true },
      { key:'note', label:t.fNote, editor:'area', placeholder:'' },
    ];

    const store = ops ? (isChauffeurs ? ops.chauffeurs : ops.vehicles) : null;
    const detail = isDetail
      ? (chauffeurs.filter((c) => c.id === chauffeurId)[0] || null)
      : null;
    const ended = { cancelled: 1, completed: 1, refunded: 1, 'no-show': 1 };
    const bookings = (isDetail && ops && ops.bookings) ? ops.bookings.all() : [];
    const liveTrips = !detail ? [] : bookings.filter((b) => {
      if (ended[b.status]) return false;
      if (detail.id && b.assignedChauffeurId === detail.id) return true;
      const email = String(detail.email || '').trim().toLowerCase();
      if (email && String(b.chauffeurEmail || '').trim().toLowerCase() === email) return true;
      if (detail.name && (b.chauffeur === detail.name || b.driver === detail.name)) return true;
      return false;
    }).map((b) => ({
      href: '/bookings/' + encodeURIComponent(b.id),
      ref: b.id,
      route: [b.pickup, b.dropoff].filter(Boolean).join(' → ') || '—',
      when: [b.date, b.time].filter(Boolean).join(' · '),
    }));
    const vehicleFor = vehicleById[detail && (detail.vehicle || detail.defaultVehicleId)] || null;
    const profileRows = !detail ? [] : [
      { label: t.fName, value: detail.name || '—' },
      { label: t.fPhone, value: detail.phone || '—' },
      { label: t.fEmail, value: detail.email || '—' },
      { label: t.fVehicle, value: vehicleFor ? vehicleLabel(vehicleFor) : t.noVehicle },
      { label: t.fLicence, value: detail.licence || '—' },
      { label: t.fLanguages, value: detail.languages || '—' },
      { label: t.fStatus, value: (CSTATUS[detail.status] || {}).label || detail.status || '—' },
    ];

    return {
      n18: 18,
      isDetail, isList,
      hasSaveMsg: !!this.state.saveMsg,
      saveMsg: this.state.saveMsg || '',
      hasNotice: !!this.state.notice,
      notice: this.state.notice || '',
      tBack: t.backChauffeurs,
      tNoEmail: t.cannotAssignNoEmail,
      hasNoEmail: !!(detail && !String(detail.email || '').trim()),
      tProfile: t.profile,
      tLiveTrips: t.liveTrips,
      tNoLiveTrips: t.noLiveTrips,
      noLiveTrips: liveTrips.length === 0,
      profileRows,
      liveTrips,
      title: isDetail ? (detail && detail.name ? detail.name : t.chauffeurs) : (isChauffeurs ? t.chauffeurs : t.vehicles),
      subtitle: isChauffeurs ? t.cSub : t.vSub,
      note: isChauffeurs ? t.cNote : t.vNote,
      tabs: [
        { label: t.vehicles, active: !isChauffeurs, go: () => {
          history.pushState({}, '', '/fleet');
          window.dispatchEvent(new PopStateEvent('popstate'));
        } },
        { label: t.chauffeurs, active: isChauffeurs, go: () => {
          history.pushState({}, '', '/fleet/chauffeurs');
          window.dispatchEvent(new PopStateEvent('popstate'));
        } },
      ],
      counts: isChauffeurs ? [
        { label:t.cntChauffeurs, value:String(chauffeurs.length), of:'', icon:'users', foot:t.footChauffeurs },
        { label:t.cntOnShift, value:String(onShift), of:'/ ' + chauffeurs.length, icon:'clock', foot:t.footShift },
        { label:t.cntWithVehicle, value:String(paired), of:'/ ' + chauffeurs.length, icon:'car', foot:t.footPaired },
      ] : [
        { label:t.cntVehicles, value:String(vehicles.length), of:'', icon:'car', foot:t.footFleet },
        { label:t.cntInService, value:String(inService), of:'/ ' + vehicles.length, icon:'circle-check', foot:t.footVehicles },
        { label:t.cntSeats, value:String(largest), of:t.seats, icon:'users', foot:t.footSeats },
      ],
      rows: isChauffeurs ? chauffeurs : vehicles.map((v) => Object.assign({}, v, {
        chauffeurIds: chauffeurs.filter((c) => c.vehicle === v.id || c.defaultVehicleId === v.id).map((c) => c.id).join(', '),
      })),
      columns: isChauffeurs ? chauffeurColumns : vehicleColumns,
      fields: isChauffeurs ? chauffeurFields : vehicleFields,
      blank: () => (store ? store.blank() : {}),
      onSave: (rec) => {
        if (!store) return Promise.resolve({ ok: false, code: 'save-failed' });
        const payload = isChauffeurs
          ? Object.assign({}, rec, {
              vehicle: rec.vehicle || rec.defaultVehicleId || '',
              defaultVehicleId: rec.defaultVehicleId || rec.vehicle || '',
            })
          : rec;
        return store.upsert(payload).then((json) => {
          if (!json || json.ok !== true) {
            this.setState({ saveMsg: t.saveFailed, notice: '' });
            return json;
          }
          const next = { saveMsg: '', notice: (!isChauffeurs && payload.status === 'workshop') ? t.offRoadStay : '' };
          this.setState(next);
          if (isChauffeurs || !ops) return json;
          const ids = String(rec.chauffeurIds || '').split(',').map((s) => s.trim()).filter(Boolean);
          const jobs = [];
          chauffeurs.forEach((c) => {
            if ((c.vehicle === rec.id || c.defaultVehicleId === rec.id) && ids.indexOf(c.id) === -1) {
              jobs.push(ops.chauffeurs.upsert(Object.assign({}, c, { vehicle: '', defaultVehicleId: '' })));
            }
          });
          ids.forEach((id) => {
            const c = ops.chauffeurs.get(id);
            if (c && c.vehicle !== rec.id) {
              jobs.push(ops.chauffeurs.upsert(Object.assign({}, c, { vehicle: rec.id, defaultVehicleId: rec.id })));
            }
          });
          if (!jobs.length) return json;
          return Promise.all(jobs).then(function () { return json; });
        });
      },
      onDelete: (id) => { if (store) store.remove(id); },
      noun: isChauffeurs ? t.nounC : t.nounV,
      nounPlural: isChauffeurs ? t.nounCs : t.nounVs,
      addTitle: isChauffeurs ? t.addChauffeur : t.addVehicle,
      editTitle: isChauffeurs ? t.editC : t.editV,
      deleteTitle: isChauffeurs ? t.delC : t.delV,
      labelKey: isChauffeurs ? 'name' : 'plate',
      addLabel: isChauffeurs ? t.addChauffeur : t.addVehicle,
      searchPlaceholder: isChauffeurs ? t.searchChauffeurs : t.searchVehicles,
      searchKeys: isChauffeurs ? ['name','phone','email','licence','languages'] : ['klass','model','plate','year'],
      emptyTitle: isChauffeurs ? t.emptyCTitle : t.emptyVTitle,
      emptyBody: isChauffeurs ? t.emptyCBody : t.emptyVBody,
      deleteBody: isChauffeurs ? t.delCBody : t.delVBody,
      nestedTitle: isChauffeurs ? t.addVehicle : t.addChauffeur,
      nestedSaveLabel: isChauffeurs ? t.addVehicle : t.addChauffeur,
      nestedTargetKey: isChauffeurs ? 'vehicle' : 'chauffeurIds',
      nestedFields: isChauffeurs
        ? vehicleFields.filter((f) => f.key !== 'chauffeurIds' && f.key !== 'photo')
        : chauffeurFields.filter((f) => f.key !== 'vehicle' && f.key !== 'photo'),
      nestedBlank: () => (ops ? (isChauffeurs ? ops.vehicles.blank() : ops.chauffeurs.blank()) : {}),
      onNestedSave: (rec, parent) => {
        if (!ops) return Promise.resolve({ ok: false });
        if (isChauffeurs) return ops.vehicles.upsert(rec);
        if (parent && parent.id) rec.vehicle = parent.id;
        rec.defaultVehicleId = rec.defaultVehicleId || rec.vehicle || '';
        return ops.chauffeurs.upsert(rec);
      },
    };
  }
}
</script>
</body>
</html>
