<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle)">
<div style="min-width:0">
<h1 style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking)">{{ tTitle }}</h1>
</div>
</header>

<div style="flex:1 1 auto;min-width:0;padding:26px 32px 48px;display:flex;flex-direction:column">
<div data-empty="1" data-vt-soon="1" style="flex:1 1 auto;align-items:center;justify-content:center;text-align:center">
<p style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-4);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking);color:var(--vt-text-primary)">{{ tSoon }}</p>
</div>
</div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;section&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;pages&quot;,&quot;options&quot;:[&quot;pages&quot;,&quot;legal&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const T = {
  en: { pages:'Pages', legal:'Legal', soon:'Coming soon' },
  de: { pages:'Seiten', legal:'Rechtliches', soon:'Bald verfügbar' },
  fr: { pages:'Pages', legal:'Mentions légales', soon:'Bientôt disponible' },
  ar: { pages:'الصفحات', legal:'المستندات القانونية', soon:'قريباً' },
};

class Component extends DCLogic {
  state = { lang: 'en' };
  componentDidMount() {
    this._onLocale = (e) => this.setState({ lang: e.detail.lang });
    window.addEventListener('vamos:locale', this._onLocale);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang() });
  }
  componentWillUnmount() {
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
  }
  renderVals() {
    const lang = this.state.lang;
    const t = T[lang] || T.en;
    const legal = this.props.section === 'legal';
    return {
      tTitle: legal ? t.legal : t.pages,
      tSoon: t.soon,
    };
  }
}

</script>
</body>
</html>
