<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:18px 32px;background:var(--vt-bg-surface);border-bottom:1px solid var(--vt-border-subtle)">
<div style="min-width:0">
<h1 style="margin:0;font-family:var(--vt-font-display);font-size:var(--vt-heading-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-heading-tracking)">{{ tTitle }}</h1>
<p style="margin:4px 0 0;font-size:var(--vt-body-xs);color:var(--vt-text-muted)">{{ tSubtitle }}</p>
</div>
</header>

<div style="flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:48px 32px">
<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:42ch">
<strong style="font-family:var(--vt-font-display);font-size:var(--vt-heading-4);font-weight:var(--vt-weight-semibold)">{{ tSoon }}</strong>
<p style="margin:0;font-size:var(--vt-body-sm);line-height:1.6;color:var(--vt-text-secondary)">{{ tSoonBody }}</p>
</div>
</div>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;section&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;pages&quot;,&quot;options&quot;:[&quot;pages&quot;,&quot;legal&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
/* Pages and Legal stay in the rail. The CMS editor is gone — Coming soon. */
const T = {
  en: {
    pages: 'Pages', legal: 'Legal',
    pagesSub: 'Public site copy', legalSub: 'Terms, privacy and imprint',
    soon: 'Coming soon',
    soonBody: 'This section is not ready yet. The public pages stay as they are.',
  },
  de: {
    pages: 'Seiten', legal: 'Rechtliches',
    pagesSub: 'Texte der öffentlichen Website', legalSub: 'AGB, Datenschutz und Impressum',
    soon: 'Bald verfügbar',
    soonBody: 'Dieser Bereich ist noch nicht fertig. Die öffentlichen Seiten bleiben unverändert.',
  },
  fr: {
    pages: 'Pages', legal: 'Mentions légales',
    pagesSub: 'Textes du site public', legalSub: 'Conditions, confidentialité et mentions',
    soon: 'Bientôt disponible',
    soonBody: 'Cette section n’est pas encore prête. Les pages publiques restent telles quelles.',
  },
  ar: {
    pages: 'الصفحات', legal: 'قانوني',
    pagesSub: 'نصوص الموقع العام', legalSub: 'الشروط والخصوصية والبيان القانوني',
    soon: 'قريبًا',
    soonBody: 'هذا القسم غير جاهز بعد. تبقى الصفحات العامة كما هي.',
  },
};
class Component extends DCLogic {
  state = { lang: 'en' };
  componentDidMount() {
    this._onLocale = (e) => this.setState({ lang: e.detail.lang });
    window.addEventListener('vamos:locale', this._onLocale);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang() });
  }
  componentWillUnmount() {
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
  }
  renderVals() {
    const t = T[this.state.lang] || T.en;
    const legal = this.props.section === 'legal';
    return {
      tTitle: legal ? t.legal : t.pages,
      tSubtitle: legal ? t.legalSub : t.pagesSub,
      tSoon: t.soon,
      tSoonBody: t.soonBody,
    };
  }
}
</script>
</body>
</html>
