<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- vt-support-badge-25515591 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<style>
[data-nav-badge]{margin-inline-start:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:600;line-height:18px;align-items:center;justify-content:center}
[data-rail-profile]{display:block}
@media (max-width:899px){
  [data-rail-toggle]{display:none!important}
  [data-rail-profile]{display:none!important}
}
@media (min-width:900px){
  [data-rail-profile]{display:block!important}
}
</style>
<aside data-lenis-prevent="1" style="background:var(--vt-bg-inverse);height:100vh;max-height:100vh;box-sizing:border-box;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:22px;width:{{ railWidth }};transition:width 200ms cubic-bezier(.2,0,.2,1)">

<div style="display:flex;align-items:center;gap:8px;padding:0 2px;min-height:34px">
<a href="/dashboard" onClick="{{ goPath }}" style="border:0;display:{{ logoWideShow }};align-items:center;flex:1 1 auto;min-width:0">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Logo" variant="reversed" form="wordmark" height="{{ n22 }}" hint-size="100px,22px"></x-import>
</a>
<a href="/dashboard" onClick="{{ goPath }}" style="border:0;display:{{ logoMarkShow }};align-items:center;justify-content:center;flex:1 1 auto">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Logo" variant="reversed" form="mark" height="{{ n26 }}" hint-size="26px,26px"></x-import>
</a>
</div>

<nav style="display:flex;flex-direction:column;gap:3px">

<sc-for list="{{ navTop }}" as="n" hint-placeholder-count="4">
<a href="{{ n.href }}" title="{{ n.label }}" onClick="{{ goPath }}" style="text-decoration:none;box-sizing:border-box;display:flex;align-items:center;justify-content:{{ rowJustify }};gap:11px;height:44px;padding:{{ rowPad }};border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:{{ n.weight }};color:{{ n.color }};background:{{ n.bg }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ n.icon }}" size="{{ n18 }}" color="{{ n.color }}" hint-size="18px,18px"></x-import><span style="display:{{ labelShow }};min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ n.label }}</span>
</a>
</sc-for>

<sc-for list="{{ navBottom }}" as="n" hint-placeholder-count="3">
<a href="{{ n.href }}" title="{{ n.label }}" onClick="{{ goPath }}" style="text-decoration:none;box-sizing:border-box;display:flex;align-items:center;justify-content:{{ rowJustify }};gap:11px;height:44px;padding:{{ rowPad }};border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:{{ n.weight }};color:{{ n.color }};background:{{ n.bg }};position:relative">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ n.icon }}" size="{{ n18 }}" color="{{ n.color }}" hint-size="18px,18px"></x-import><span style="display:{{ labelShow }};min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ n.label }}</span>
<span data-nav-badge="1" style="display:{{ n.badgeShow }};background:{{ n.badgeBg }};color:{{ n.badgeColor }}">{{ n.badge }}</span>
</a>
</sc-for>

<div style="display:{{ ruleShow }};height:1px;margin:14px 8px 6px;background:var(--vt-border-inverse)"></div>

<button type="button" onClick="{{ toggleContent }}" title="{{ tContent }}" aria-expanded="{{ contentExpanded }}" style="all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:{{ rowJustify }};gap:11px;height:44px;margin-top:{{ groupGap }};padding:{{ rowPad }};border-radius:999px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:{{ contentWeight }};color:{{ contentColor }};background:{{ contentBg }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="file-text" size="{{ n18 }}" color="{{ contentColor }}" hint-size="18px,18px"></x-import><span style="display:{{ labelShow }};flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ tContent }}</span>
<span style="display:{{ labelShow }};align-items:center;flex:0 0 auto">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ contentChevron }}" size="{{ n16 }}" color="{{ contentColor }}" hint-size="16px,16px"></x-import>
</span>
</button>

<sc-if value="{{ contentOpen }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:2px;padding:2px 0 6px;margin-inline-start:21px;border-inline-start:1px solid var(--vt-border-inverse)">
<sc-for list="{{ contentItems }}" as="c" hint-placeholder-count="3">
<a href="{{ c.href }}" title="{{ c.label }}" onClick="{{ goPath }}" style="text-decoration:none;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:40px;margin-inline-start:8px;padding:0 12px;border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:{{ c.weight }};color:{{ c.color }};background:{{ c.bg }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ c.icon }}" size="{{ n16 }}" color="{{ c.color }}" hint-size="16px,16px"></x-import><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.label }}</span>
</a>
</sc-for>
</div>
</sc-if>
</nav>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">

<button type="button" data-rail-toggle="1" onClick="{{ toggleRail }}" title="{{ tToggle }}" aria-label="{{ tToggle }}" aria-expanded="{{ railExpanded }}" style="all:unset;box-sizing:border-box;display:{{ toggleShow }};align-items:center;justify-content:{{ rowJustify }};gap:8px;height:40px;padding:{{ rowPad }};border-radius:999px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-inverse-muted)" style-hover="background:var(--vt-charcoal-800);color:var(--vt-text-inverse)">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ toggleIcon }}" size="{{ n16 }}" color="currentColor" hint-size="16px,16px"></x-import><span style="display:{{ labelShow }};min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ tToggle }}</span>
</button>

<div data-rail-profile="1" data-vt-rail-prof="desk" style="display:{{ profileShow }}">
<div style="position:relative;padding-top:10px;border-top:1px solid var(--vt-border-inverse)">

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:4;background:transparent"></div>
<div role="menu" style="position:absolute;inset-inline-start:0;inset-inline-end:0;bottom:calc(100% + 4px);z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--vt-charcoal-800);border:1px solid var(--vt-border-inverse);border-radius:var(--vt-radius-md);box-shadow:var(--vt-shadow-xl)">
<a href="/profile" role="menuitem" onClick="{{ goPath }}" style="text-decoration:none;border:0;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);color:var(--vt-text-inverse)" style-hover="background:var(--vt-charcoal-700);color:var(--vt-text-inverse)">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="user" size="{{ n16 }}" color="currentColor" hint-size="16px,16px"></x-import>{{ tProfile }}
</a>
<a href="/settings" role="menuitem" onClick="{{ goPath }}" style="text-decoration:none;border:0;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);color:var(--vt-text-inverse)" style-hover="background:var(--vt-charcoal-700);color:var(--vt-text-inverse)">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="settings" size="{{ n16 }}" color="currentColor" hint-size="16px,16px"></x-import>{{ tSettings }}
</a>
<a href="https://vamostaxi.site/" target="_blank" rel="noopener noreferrer" role="menuitem" style="text-decoration:none;border:0;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:999px;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);color:var(--vt-text-inverse-muted)" style-hover="background:var(--vt-charcoal-700);color:var(--vt-text-inverse)">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="external-link" size="{{ n16 }}" color="currentColor" hint-size="16px,16px"></x-import>{{ tSiteLink }}
</a>
<div style="height:1px;margin:5px 6px;background:var(--vt-border-inverse)"></div>
<button type="button" role="menuitem" onClick="{{ signOut }}" style="all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:999px;cursor:pointer;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:500;color:oklch(0.68 0.17 27)" style-hover="background:var(--vt-charcoal-700)">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="log-out" size="{{ n16 }}" color="currentColor" hint-size="16px,16px"></x-import>{{ tSignOut }}
</button>
</div>
</sc-if>

<button type="button" onClick="{{ toggleMenu }}" title="{{ profileTitle }}" aria-haspopup="menu" aria-expanded="{{ menuExpanded }}" style="all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:{{ rowJustify }};gap:10px;width:100%;padding:5px;border-radius:999px;cursor:pointer">
<span style="position:relative;width:32px;height:32px;border-radius:999px;overflow:hidden;background:{{ profileAvatarBg }};display:flex;align-items:center;justify-content:center;flex:0 0 auto">
<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}">
<img src="{{ profilePhoto }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
</sc-if>
<sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="user" size="{{ n16 }}" color="var(--vt-accent)" hint-size="16px,16px"></x-import>
</sc-if>
</span>
<span style="display:{{ kickerShow }};font-family:var(--vt-font-body);font-size:var(--vt-body-xs);color:var(--vt-text-inverse);line-height:1.3;text-align:start;flex:1 1 auto;min-width:0;overflow:hidden">
{{ profileName }}<br><span style="color:var(--vt-text-inverse-muted)">{{ profileRole }}</span>
</span>
<span style="display:{{ labelShow }};align-items:center;flex:0 0 auto;padding-inline-end:4px">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="{{ menuChevron }}" size="{{ n16 }}" color="var(--vt-text-inverse-muted)" hint-size="16px,16px"></x-import>
</span>
</button>
</div>
</div>
</div>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:860},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;bookings&quot;,&quot;calendar&quot;,&quot;chauffeurs&quot;,&quot;pricing&quot;,&quot;customers&quot;,&quot;support&quot;,&quot;pages&quot;,&quot;legal&quot;,&quot;reviews&quot;,&quot;settings&quot;,&quot;profile&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
/* One rail for the whole console. The bottom row collapses it to icons and remembers
   that choice; Content is a group; the profile row is a menu, not a link. */
const NAV_TOP = [
  { key:'dashboard', href:'/dashboard', icon:'layout-dashboard', en:'Dashboard', de:'Übersicht', fr:'Tableau de bord', ar:'لوحة المعلومات' },
  { key:'bookings', href:'/bookings', icon:'receipt', en:'Bookings', de:'Buchungen', fr:'Réservations', ar:'الحجوزات' },
  { key:'calendar', href:'/calendar', icon:'calendar-days', en:'Calendar', de:'Kalender', fr:'Calendrier', ar:'التقويم' },
  { key:'chauffeurs', href:'/fleet/chauffeurs', icon:'users', en:'Chauffeurs', de:'Chauffeure', fr:'Chauffeurs', ar:'السائقون' },
];
const NAV_BOTTOM = [
  { key:'customers', href:'/customers', icon:'user', en:'Customers', de:'Kunden', fr:'Clients', ar:'العملاء' },
  { key:'support', href:'/support', icon:'mail', en:'Support', de:'Support', fr:'Assistance', ar:'الدعم' },
];
/* D-12: these paths are omitted from the DOM for role=dispatcher — never painted disabled. */
const NAV_ADMIN = [
  { key:'pricing', href:'/pricing', icon:'banknote', en:'Pricing & routes', de:'Preise & Routen', fr:'Tarifs & trajets', ar:'الأسعار والمسارات' },
];
/* Content — what the public site shows, edited here. */
const CONTENT = [
  { key:'pages', href:'/pages', icon:'globe', en:'Pages', de:'Seiten', fr:'Pages', ar:'الصفحات' },
  { key:'legal', href:'/legal', icon:'shield-check', en:'Legal', de:'Rechtliches', fr:'Mentions légales', ar:'المستندات القانونية' },
  { key:'reviews', href:'/reviews', icon:'star', en:'Reviews', de:'Bewertungen', fr:'Avis', ar:'التقييمات' },
];
function avatarUrl(avatar) {
  const value = String(avatar || '');
  if (!value) return '';
  return value.charAt(0) === '/' ? value : '/photos/' + value;
}
const COPY = {
  en: { dispatch:'Dispatch', adminRole:'Admin role', signOut:'Sign out', site:'Vamos Taxi site', content:'Content', collapse:'Collapse sidebar', expand:'Expand sidebar', profile:'Profile', settings:'Settings' },
  de: { dispatch:'Dispatch', adminRole:'Admin-Rolle', signOut:'Abmelden', site:'Vamos Taxi Website', content:'Inhalte', collapse:'Seitenleiste einklappen', expand:'Seitenleiste ausklappen', profile:'Profil', settings:'Einstellungen' },
  fr: { dispatch:'Dispatch', adminRole:'Rôle admin', signOut:'Se déconnecter', site:'Site Vamos Taxi', content:'Contenu', collapse:'Réduire la barre latérale', expand:'Déployer la barre latérale', profile:'Profil', settings:'Réglages' },
  ar: { dispatch:'التوزيع', adminRole:'دور المشرف', signOut:'تسجيل الخروج', site:'موقع فاموس تاكسي', content:'المحتوى', collapse:'طيّ الشريط الجانبي', expand:'توسيع الشريط الجانبي', profile:'الملف الشخصي', settings:'الإعدادات' },
};
const KEY = 'vamosOpsNavCollapsed';

class Component extends DCLogic {
  state = {
    lang: (typeof localStorage !== 'undefined' && localStorage.getItem('vamosLang')) || 'en',
    collapsed: (typeof localStorage !== 'undefined' && localStorage.getItem(KEY) === '1'),
    open: {},
    menuOpen: false,
    me: null,
    supportNew: (typeof window !== 'undefined' && typeof window.__vamosSupportNew === 'number') ? window.__vamosSupportNew : 0,
  };
  loadMe = () => {
    const api = window.VamosOpsApi;
    if (!api || typeof api.request !== 'function') return;
    api.request('GET', '/api/staff/me').then((json) => {
      if (json && json.ok && json.data && typeof json.data === 'object') {
        this.setState({ me: json.data });
      }
    });
  };
  bindOps = () => {
    if (!window.VamosOps) { this._retry = setTimeout(this.bindOps, 120); return; }
    this._offOps = window.VamosOps.profile.onChange(() => this.forceUpdate());
    this.loadMe();
    this.forceUpdate();
  };
  componentDidMount() {
    this.bindOps();
    this._onLocale = (e) => this.setState({ lang: e.detail.lang });
    window.addEventListener('vamos:locale', this._onLocale);
    this._onKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };
    window.addEventListener('keydown', this._onKey);
    this._onBadge = (e) => {
      const n = e && e.detail ? Number(e.detail.newCount) : 0;
      this.setState({ supportNew: Number.isFinite(n) ? n : 0 });
    };
    window.addEventListener('vamos:support-badge', this._onBadge);
  }
  componentWillUnmount() {
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    if (this._onKey) window.removeEventListener('keydown', this._onKey);
    if (this._onBadge) window.removeEventListener('vamos:support-badge', this._onBadge);
    if (this._offOps) this._offOps();
    clearTimeout(this._retry);
  }

  /* A group with no explicit choice follows the route it contains. */
  groupOpen(key, items) {
    const v = this.state.open[key];
    return v === undefined ? items.some((c) => c.key === this.props.active) : v;
  }
  expand() { try { localStorage.setItem(KEY, '0'); } catch (e) {} }

  toggleRail = () => {
    const next = !this.state.collapsed;
    try { localStorage.setItem(KEY, next ? '1' : '0'); } catch (e) {}
    this.setState({ collapsed: next, menuOpen: false });
  };
  /* Collapsed, a group has nowhere to unfold into — so it opens the rail first. */
  group = (key, items) => () => {
    if (this.state.collapsed) {
      this.expand();
      this.setState((s) => ({ collapsed: false, open: Object.assign({}, s.open, { [key]: true }) }));
      return;
    }
    const next = !this.groupOpen(key, items);
    this.setState((s) => ({ open: Object.assign({}, s.open, { [key]: next }) }));
  };
  toggleContent = this.group('content', CONTENT);

  toggleMenu = () => {
    if (this.state.collapsed && !this.state.menuOpen) {
      this.expand();
      this.setState({ collapsed: false, menuOpen: true });
      return;
    }
    this.setState((s) => ({ menuOpen: !s.menuOpen }));
  };
  closeMenu = () => this.setState({ menuOpen: false });
  goPath = (e) => {
    const a = e.currentTarget;
    const href = (a && a.getAttribute && a.getAttribute('href')) || '';
    if (href.charAt(0) !== '/') return;
    e.preventDefault();
    this.setState({ menuOpen: false });
    if (location.pathname !== href) {
      history.pushState({}, '', href);
      window.dispatchEvent(new PopStateEvent('popstate'));
    }
  };
  signOut = () => {
    try { localStorage.removeItem('vamosOpsAuth'); } catch (e) {}
    const done = () => { location.replace('/login'); };
    const api = window.VamosOpsApi;
    if (api && typeof api.request === 'function') {
      api.request('POST', '/api/auth', { action: 'signout' }).then(done, done);
      return;
    }
    fetch('/api/auth', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'signout' }),
    }).then(done, done);
  };

  renderVals() {
    const active = this.props.active || 'dashboard';
    const lang = this.state.lang;
    const drawer = (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia('(max-width: 899px)').matches : false;
    const col = drawer ? false : this.state.collapsed;
    const t = COPY[lang] || COPY.en;
    const profile = window.VamosOps ? window.VamosOps.profile.get() : {};
    const me = this.state.me || {};
    const role = me.role || profile.role || '';
    const isAdmin = role === 'admin';
    /* Until GET /api/staff/me resolves, omit /pricing so a
       dispatcher never sees it as a disabled item (D-12). */
    const navBottomSrc = isAdmin
      ? NAV_ADMIN.concat(NAV_BOTTOM)
      : NAV_BOTTOM.slice();
    const paint = (n) => {
      const on = n.key === active;
      const badgeOn = n.key === 'support' && this.state.supportNew > 0;
      return {
        href: n.href, icon: n.icon, label: n[lang] || n.en,
        bg: on ? 'var(--vt-accent)' : 'transparent',
        color: on ? 'var(--vt-charcoal-900)' : 'var(--vt-text-inverse-muted)',
        weight: on ? '600' : '400',
        badge: badgeOn ? String(this.state.supportNew) : '',
        badgeShow: badgeOn ? 'inline-flex' : 'none',
        badgeBg: on ? 'var(--vt-charcoal-900)' : 'var(--vt-accent)',
        badgeColor: on ? 'var(--vt-accent)' : 'var(--vt-charcoal-900)',
      };
    };
    const group = (key, items) => {
      const open = this.groupOpen(key, items) && !col;
      const on = items.some((c) => c.key === active);
      return {
        open, expanded: open ? 'true' : 'false',
        chevron: open ? 'chevron-up' : 'chevron-down',
        bg: on && !open ? 'var(--vt-charcoal-800)' : 'transparent',
        color: on ? 'var(--vt-text-inverse)' : 'var(--vt-text-inverse-muted)',
        weight: on ? '600' : '400',
        items: items.map(paint),
      };
    };
    const content = group('content', CONTENT);
    return {
      n14: 14, n16: 16, n18: 18, n22: 22, n26: 26,
      toggleShow: drawer ? 'none' : 'flex',
      profileShow: drawer ? 'none' : 'block',
      railWidth: col ? '76px' : '236px',
      labelShow: col ? 'none' : 'inline-flex',
      kickerShow: col ? 'none' : 'block',
      ruleShow: col ? 'block' : 'none',
      logoWideShow: col ? 'none' : 'inline-flex',
      logoMarkShow: col ? 'inline-flex' : 'none',
      groupGap: col ? '0' : '14px',
      toggleIcon: col ? 'chevron-right' : 'chevron-left',
      tToggle: col ? t.expand : t.collapse,
      railExpanded: col ? 'false' : 'true',
      rowJustify: col ? 'center' : 'flex-start',
      rowPad: col ? '0' : '0 12px',
      toggleRail: this.toggleRail, toggleContent: this.toggleContent,
      toggleMenu: this.toggleMenu, closeMenu: this.closeMenu, goPath: this.goPath, signOut: this.signOut,
      tDispatch: t.dispatch, tSignOut: t.signOut, tSiteLink: t.site,
      tContent: t.content, tProfile: t.profile, tSettings: t.settings,
      contentOpen: content.open, contentExpanded: content.expanded, contentChevron: content.chevron,
      contentBg: content.bg, contentColor: content.color, contentWeight: content.weight, contentItems: content.items,
      menuOpen: this.state.menuOpen,
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      menuChevron: this.state.menuOpen ? 'chevron-down' : 'chevron-up',
      profileName: profile.name || me.fullName || '',
      profileRole: role || '',
      profileTitle: t.profile,
      profilePhoto:avatarUrl(profile.avatar),
      hasPhoto: !!profile.avatar,
      noPhoto: !profile.avatar,
      profileAvatarBg: active === 'profile' ? 'var(--vt-accent)' : 'var(--vt-charcoal-800)',
      navTop: NAV_TOP.map(paint),
      navBottom: navBottomSrc.map(paint),
    };
  }
}

</script>
</body>
</html>
