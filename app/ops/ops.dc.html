<dc-import name="OpsContent" section="{{ contentSection }}" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ isCalendar }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsCalendarBoard" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ isCustomers }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsCustomers" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ isSupport }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsSupportTicket" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ isCoupons }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsCoupons" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsSettings" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ isProfile }}" hint-placeholder-val="{{ false }}">
<dc-import name="OpsProfile" hint-size="100%,900px"></dc-import>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;bookings&quot;,&quot;calendar&quot;,&quot;vehicles&quot;,&quot;chauffeurs&quot;,&quot;pricing&quot;,&quot;customers&quot;,&quot;support&quot;,&quot;coupons&quot;,&quot;reviews&quot;,&quot;settings&quot;,&quot;profile&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Console&quot;},&quot;requireSignIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Console&quot;}}">
const FLEET = ['vehicles', 'chauffeurs'];
const CONTENT = ['pages', 'legal'];
const ROUTES = ['dashboard', 'bookings', 'calendar', 'pricing', 'customers', 'support', 'coupons', 'settings', 'staff', 'profile', 'reviews', 'detail'].concat(FLEET).concat(CONTENT);
const MENU = { en:'Open navigation', de:'Navigation öffnen', fr:'Ouvrir la navigation', ar:'فتح التنقل' };
const PROF = {
  en: { profile:'Profile', settings:'Settings', signOut:'Sign out' },
  de: { profile:'Profil', settings:'Einstellungen', signOut:'Abmelden' },
  fr: { profile:'Profil', settings:'Réglages', signOut:'Se déconnecter' },
  ar: { profile:'الملف الشخصي', settings:'الإعدادات', signOut:'تسجيل الخروج' },
};
function avatarUrl(avatar) {
  const value = String(avatar || '');
  if (!value) return '';
  return value.charAt(0) === '/' ? value : '/photos/' + value;
}
/* One console, one URL. Every section is a hash route on this page: #bookings,
   #pricing, #reviews, #calendar…, plus #detail/<id> for a single booking. */
function readHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const [key, id] = raw.split('/');
  if (!key || ROUTES.indexOf(key) === -1) return { route: 'dashboard', detailId: null };
  return { route: key, detailId: key === 'detail' ? decodeURIComponent(id || '') : null };
}
class Component extends DCLogic {
  state = Object.assign({ navOpen: false, lang: 'en', menuOpen: false, me: null }, readHash());
  componentDidMount() {
    if (location.pathname.indexOf('/app/') === 0) { location.replace('/'); return; }
    const gate = this.props.requireSignIn !== false;
    if (gate && typeof localStorage !== 'undefined' && localStorage.getItem('vamosOpsAuth') !== '1') { location.replace('/login'); return; }
    if (!location.hash) location.replace('#' + (this.props.start || 'dashboard'));
    this._onHash = () => this.setState(Object.assign({ navOpen: false, menuOpen: false }, readHash()));
    window.addEventListener('hashchange', this._onHash);
    this._onLocale = (e) => this.setState({ lang: e.detail.lang });
    window.addEventListener('vamos:locale', this._onLocale);
    if (window.VamosLocale) this.setState({ lang: window.VamosLocale.lang || 'en' });
    this._onKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };
    window.addEventListener('keydown', this._onKey);
    this.bindOps();
  }
  componentWillUnmount() {
    if (this._onHash) window.removeEventListener('hashchange', this._onHash);
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    if (this._onKey) window.removeEventListener('keydown', this._onKey);
    if (this._offOps) this._offOps();
    clearTimeout(this._retry);
  }
  bindOps = () => {
    if (!window.VamosOps) { this._retry = setTimeout(this.bindOps, 120); return; }
    this._offOps = window.VamosOps.profile.onChange(() => this.forceUpdate());
    const api = window.VamosOpsApi;
    if (api && typeof api.request === 'function') {
      api.request('GET', '/api/staff/me').then((json) => {
        if (json && json.ok && json.data && typeof json.data === 'object') this.setState({ me: json.data });
      });
    }
    this.forceUpdate();
  };
  toggleNav = () => this.setState((s) => ({ navOpen: !s.navOpen }));
  closeNav = () => this.setState({ navOpen: false });
  toggleMenu = () => this.setState((s) => ({ menuOpen: !s.menuOpen }));
  closeMenu = () => this.setState({ menuOpen: false });
  goHash = (e) => {
    const a = e.currentTarget;
    const href = (a && a.getAttribute && a.getAttribute('href')) || '';
    if (href.charAt(0) !== '#') return;
    e.preventDefault();
    this.setState({ menuOpen: false, navOpen: false });
    if (location.hash !== href) location.hash = href;
  };
  signOut = () => {
    try { localStorage.removeItem('vamosOpsAuth'); } catch (e) {}
    const done = () => { location.replace('/login'); };
    const api = window.VamosOpsApi;
    if (api && typeof api.request === 'function') {
      api.request('POST', '/api/auth', { action: 'signout' }).then(done, done);
      return;
    }
    fetch('/api/auth', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'signout' }),
    }).then(done, done);
  };
  renderVals() {
    const r = this.state.route;
    const t = PROF[this.state.lang] || PROF.en;
    const profile = window.VamosOps ? window.VamosOps.profile.get() : {};
    const me = this.state.me || {};
    return {
      n16: 16, n20: 20, n22: 22,
      route: r === 'detail' ? 'bookings' : r,
      detailId: this.state.detailId || '',
      fleetSection: r === 'chauffeurs' ? 'chauffeurs' : 'vehicles',
      contentSection: r === 'legal' ? 'legal' : 'pages',
      isContent: CONTENT.indexOf(r) !== -1,
      isDash: r === 'dashboard', isFleet: FLEET.indexOf(r) !== -1,
      isBookings: r === 'bookings', isDetail: r === 'detail', isPricing: r === 'pricing',
      isReviews: r === 'reviews', isCalendar: r === 'calendar', isCustomers: r === 'customers',
      isCoupons: r === 'coupons', isSupport: r === 'support', isSettings: r === 'settings' || r === 'staff', isProfile: r === 'profile',
      navOpenAttr: this.state.navOpen ? '1' : '0',
      toggleNav: this.toggleNav, closeNav: this.closeNav,
      toggleMenu: this.toggleMenu, closeMenu: this.closeMenu, goHash: this.goHash, signOut: this.signOut,
      menuOpen: this.state.menuOpen,
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      tMenu: MENU[this.state.lang] || MENU.en,
      tProfile: t.profile, tSettings: t.settings, tSignOut: t.signOut,
      profilePhoto: avatarUrl(profile.avatar || me.avatar),
      hasPhoto: !!(profile.avatar || me.avatar),
      noPhoto: !(profile.avatar || me.avatar),
    };
  }
}
</script>
</body>
</html>
