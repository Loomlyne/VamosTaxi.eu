<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

.vt-btn:hover,.vt-btn:active{box-shadow:none!important}
.vt-btn--primary:hover:not([disabled]){background:var(--vt-accent-hover)}
.vt-btn--primary:active:not([disabled]){background:var(--vt-accent-press);transform:translateY(1px)}
.vt-btn--secondary:hover:not([disabled]){background:var(--vt-charcoal-800)}

[data-tok]::after{content:"TBC";font-family:var(--vt-font-body);font-size:.66em;font-weight:700;letter-spacing:.1em;color:var(--vt-text-muted)}

:focus-visible:not(input):not(select):not(textarea):not(.vt-btn){outline:3px solid rgb(253 194 11/.45)!important;outline-offset:3px;border-radius:var(--vt-radius-xs)}
@media (min-width:560px){[data-pv-row]{grid-template-columns:minmax(0,1fr) auto}}</style>

<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Card" padding="lg" hint-size="100%,260px">
<div style="display:flex;flex-direction:column;gap:22px;font-family:var(--vt-font-body);color:var(--vt-text-primary)">

<div style="display:flex;gap:16px;align-items:flex-start">
<div data-pv-tile="1">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="phone" size="{{ n20 }}" color="var(--vt-yellow)" hint-size="20px,20px"></x-import>
</div>
<div style="display:flex;flex-direction:column;gap:7px;min-width:0">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px">
<sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}"><h2 data-pv-h2="1">Add your mobile number</h2></sc-if>
<sc-if value="{{ isVerified }}"><h2 data-pv-h2="1">Mobile number</h2></sc-if>
<sc-if value="{{ notDone }}"><span data-pv-pill="1">Action needed</span></sc-if>
<sc-if value="{{ isVerified }}"><span data-pv-done="1"><x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="circle-check" size="{{ n15 }}" color="var(--vt-success)" hint-size="15px,15px"></x-import>Saved</span></sc-if>
</div>
<p data-pv-b="1">Your driver calls this number on arrival, so it has to be one you will answer.</p>
</div>
</div>

<sc-if value="{{ isAdd }}" hint-placeholder-val="{{ true }}">
<div data-pv-view="add" style="display:flex;flex-direction:column;gap:16px">
<div data-pv-row="1">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Input" label="Mobile number" type="tel" icon="phone" size="md" autoComplete="tel" placeholder="+41 79 000 00 00" value="{{ phone }}" onChange="{{ setPhone }}" error="{{ errPhone }}" hint-size="100%,76px"></x-import>
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Button" size="md" onClick="{{ sendCode }}" hint-size="150px,44px">Save number</x-import>

</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:300},&quot;stage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;add&quot;,&quot;code&quot;,&quot;verified&quot;],&quot;default&quot;:&quot;add&quot;,&quot;tsType&quot;:&quot;'add'|'code'|'verified'&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/* Number lives on the signed-in user. No SMS in V1. */
const PHONE_KEY = 'vamosPhone';
const readSaved = () => {
  try {
    const p = JSON.parse(localStorage.getItem(PHONE_KEY) || 'null');
    return p && p.phone ? p.phone : '';
  } catch (e) { return ''; }
};
const postProfile = (body) => fetch('/api/auth', {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  credentials: 'same-origin',
  body: JSON.stringify(Object.assign({ action: 'update-profile' }, body)),
}).then((r) => r.json());
class Component extends DCLogic {
  state = (() => {
    const saved = readSaved();
    return {
      stage: saved ? 'verified' : (this.props.stage || 'add'),
      phone: saved || this.props.phone || '',
      code: '', errors: {}, resent: false,
    };
  })();
  componentDidUpdate(prev) {
    if (prev.stage !== this.props.stage || prev.phone !== this.props.phone || prev.nonce !== this.props.nonce) {
      const saved = readSaved();
      this.setState({
        stage: saved ? 'verified' : (this.props.stage || 'add'),
        phone: saved || this.props.phone || '',
        code: '', errors: {}, resent: false,
      });
    }
  }
  sendCode = () => {
    const digits = this.state.phone.replace(/[^\d]/g, '');
    if (digits.length < 9) { this.setState({ errors: { phone: 'Check the mobile number, including the country code' } }); return; }
    const phone = this.state.phone.trim();
    postProfile({ phone })
      .then((res) => {
        if (!res || !res.ok) {
          this.setState({ errors: { phone: 'Could not save. Try again.' } });
          return;
        }
        try { localStorage.setItem(PHONE_KEY, JSON.stringify({ phone, at: Date.now() })); } catch (e) {}
        this.setState({ stage: 'verified', errors: {}, resent: false });
      })
      .catch(() => this.setState({ errors: { phone: 'Could not save. Try again.' } }));
  };
  verify = () => this.sendCode();
  resend = () => this.setState({ resent: true, code: '', errors: {} });
  changeNumber = () => {
    try { localStorage.removeItem(PHONE_KEY); } catch (e) {}
    this.setState({ stage: 'add', code: '', errors: {}, resent: false });
  };
  renderVals() {
    const { stage, phone, code, errors, resent } = this.state;
    return {
      n6: 6, n15: 15, n20: 20,
      isAdd: stage === 'add', isCode: stage === 'code', isVerified: stage === 'verified',
      notDone: stage !== 'verified',
      phone, code, resent,
      phoneEcho: phone.trim() || 'your mobile number',
      errPhone: errors.phone, errCode: errors.code,
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setCode: (e) => this.setState({ code: e.target.value }),
      sendCode: this.sendCode, verify: this.verify, resend: this.resend, changeNumber: this.changeNumber,
    };
  }
}

</script>
