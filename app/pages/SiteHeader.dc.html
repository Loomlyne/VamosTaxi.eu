<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

/* The account control is the one thing in this bar that is about you. Signed out it is
   a plain outlined control; signed in it is not a link at all but a monogram disc that
   opens your account menu, so the bar answers "who am I and where do I go" in one place
   instead of throwing you at a page. Hover changes the fill, never adds a glow. */
/* The account control belongs to the same family as the language
   and currency pills — white on the charcoal bar, never a dark control on a
   dark ground. */
[data-hd-acct]{position:relative;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;border-radius:999px;border:1px solid rgb(30 31 31/.10);background:var(--vt-white);box-shadow:none;font:inherit;color:var(--vt-charcoal-900);text-decoration:none;white-space:nowrap;cursor:pointer;transition:var(--vt-transition-control)}

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:96},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inverse&quot;,&quot;options&quot;:[&quot;inverse&quot;,&quot;overlay&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;signInLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sign in&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hideAccount&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;cur&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;},&quot;onCur&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;}}">
const T = {
  en: { signIn:'Sign in', account:'Your account', bookings:'Your bookings', manage:'Manage a booking', verify:'Verify your email', signOut:'Sign out', book:'Book a transfer', faq:'FAQs', contact:'Contact', menu:'Menu', close:'Close', call:'Call +41 79 626 70 82', langLabel:'Language', curLabel:'Currency', svc:'Services', help:'Help', airport:'Airport transfers', city:'City to city', whatsapp:'WhatsApp' },
  de: { signIn:'Anmelden', account:'Ihr Konto', bookings:'Ihre Buchungen', manage:'Buchung verwalten', verify:'E-Mail bestätigen', signOut:'Abmelden', book:'Transfer buchen', faq:'Häufige Fragen', contact:'Kontakt', menu:'Menü', close:'Schliessen', call:'+41 79 626 70 82 anrufen', langLabel:'Sprache', curLabel:'Währung', svc:'Leistungen', help:'Hilfe', airport:'Flughafentransfers', city:'Stadt zu Stadt', whatsapp:'WhatsApp' },
  fr: { signIn:'Connexion', account:'Votre compte', bookings:'Vos réservations', manage:'Gérer une réservation', verify:'Vérifier votre e-mail', signOut:'Déconnexion', book:'Réserver', faq:'Questions fréquentes', contact:'Contact', menu:'Menu', close:'Fermer', call:'Appeler le +41 79 626 70 82', langLabel:'Langue', curLabel:'Devise', svc:'Services', help:'Aide', airport:'Transferts aéroport', city:'De ville en ville', whatsapp:'WhatsApp' },
  ar: { signIn:'تسجيل الدخول', account:'حسابك', bookings:'حجوزاتك', manage:'إدارة الحجز', verify:'تأكيد بريدك الإلكتروني', signOut:'تسجيل الخروج', book:'احجز رحلتك', faq:'الأسئلة الشائعة', contact:'اتصل بنا', menu:'القائمة', close:'إغلاق', call:'اتصل بنا', langLabel:'اللغة', curLabel:'العملة', svc:'خدماتنا', help:'المساعدة', airport:'نقل المطار', city:'بين المدن', whatsapp:'WhatsApp' },
};
const LANGS = ['en', 'de', 'fr', 'ar'];
const LANG_NOTE = { en:'English', de:'Deutsch', fr:'Français', ar:'العربية' };
const CUR_NOTE = { CHF:'Swiss francs', EUR:'Euro', USD:'US dollars', AED:'UAE dirham' };
/* One session, read by every surface: the auth screens write it, the header reflects it. */
const readAuth = () => {
  try {
    const raw = localStorage.getItem('vamosAuth');
    if (!raw) return null;
    const a = JSON.parse(raw);
    return a && a.email ? a : null;
  } catch (e) { return null; }
};

class Component extends DCLogic {
  state = (() => {
    let lang = 'en', cur = 'CHF';
    try {
      lang = localStorage.getItem('vamosLang') || 'en';
      cur = localStorage.getItem('vamosCurrency') || 'CHF';
    } catch (e) {}
    return { lang: LANGS.indexOf(lang) > -1 ? lang : 'en', cur, menuOpen: false, menuClosing: false, acctOpen: false, floating: false, auth: readAuth() };
  })();
  _menuRoot = (el) => { this._root = el; };
  _acctRoot = (el) => { this._acct = el; };
  toggleAcct = () => this.setState((s) => ({ acctOpen: !s.acctOpen }));

  componentDidMount() {
    /* One store for the whole platform — the choice made here reaches every
       surface through VamosLocale, and any change made elsewhere lands back. */
    this._onLocale = (e) => this.setState({ lang: e.detail.lang, cur: e.detail.cur });
    window.addEventListener('vamos:locale', this._onLocale);
    this._esc = (e) => { if (e.key !== 'Escape') return; if (this.state.menuOpen) this.closeMenu(); if (this.state.acctOpen) this.setState({ acctOpen: false }); };
    this._away = (e) => {
      if (this.state.menuOpen && this._root && !this._root.contains(e.target)) this.closeMenu();
      if (this.state.acctOpen && this._acct && !this._acct.contains(e.target)) this.setState({ acctOpen: false });
    };
    this._resize = () => { if ((this.state.menuOpen || this.state.menuClosing) && window.innerWidth >= 1080) this._finishClose(); };
    /* Only the overlay bar floats — the charcoal one is already sticky and solid. */
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => {
        this._raf = 0;
        if (this.props.variant !== 'overlay') return;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        const on = y > 120;
        if (on !== this.state.floating) this.setState({ floating: on });
      });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();
    document.addEventListener('keydown', this._esc);
    document.addEventListener('mousedown', this._away);
    window.addEventListener('resize', this._resize);
    this._onAuth = () => this.setState({ auth: readAuth() });
    window.addEventListener('vamos:auth', this._onAuth);
    fetch('/api/auth/session', { credentials: 'same-origin' })
      .then((r) => r.json())
      .then((s) => {
        if (!s || !s.signedIn) return;
        const prev = readAuth();
        const full = (s.displayName || '').trim();
        const parts = full.split(' ').filter(Boolean);
        const auth = {
          email: (prev && prev.email) || '',
          firstName: parts[0] || (prev && prev.firstName) || '',
          lastName: parts.slice(1).join(' ') || (prev && prev.lastName) || '',
          emailVerified: !!s.emailConfirmed,
          at: Date.now(),
        };
        try { localStorage.setItem('vamosAuth', JSON.stringify(auth)); } catch (e) {}
        this.setState({ auth });
      })
      .catch(() => {});
  }
  componentWillUnmount() {
    if (this._onLocale) window.removeEventListener('vamos:locale', this._onLocale);
    if (this._onAuth) window.removeEventListener('vamos:auth', this._onAuth);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._closeT) { clearTimeout(this._closeT); this._closeT = 0; }
    window.removeEventListener('scroll', this._onScroll);
    document.removeEventListener('keydown', this._esc);
    document.removeEventListener('mousedown', this._away);
    window.removeEventListener('resize', this._resize);
    this._lock(false);
  }
  _lock(on) { try { document.body.style.overflow = on ? 'hidden' : ''; } catch (e) {} }
  _reduceMotion() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
  }
  _finishClose = () => {
    if (this._closeT) { clearTimeout(this._closeT); this._closeT = 0; }
    this._lock(false);
    if (this.state.menuOpen || this.state.menuClosing) this.setState({ menuOpen: false, menuClosing: false });
  };
  closeMenu = () => {
    if (!this.state.menuOpen || this.state.menuClosing) return;
    if (this._reduceMotion()) { this._finishClose(); return; }
    this.setState({ menuClosing: true });
    if (this._closeT) clearTimeout(this._closeT);
    this._closeT = setTimeout(this._finishClose, 360);
  };
  onSheetAnimEnd = (e) => {
    if (!this.state.menuClosing) return;
    if (e && e.target && e.currentTarget && e.target !== e.currentTarget) return;
    this._finishClose();
  };
  toggleMenu = () => {
    if (this.state.menuClosing) {
      if (this._closeT) { clearTimeout(this._closeT); this._closeT = 0; }
      this._lock(true);
      this.setState({ menuClosing: false, menuOpen: true });
      return;
    }
    if (this.state.menuOpen) this.closeMenu();
    else { this._lock(true); this.setState({ menuOpen: true }); }
  };

  /** Nothing reloads: VamosLocale relabels the whole page in place — this bar,
   *  the sections under it, the footer, and any dialog that is open. */
  lang() { return this.props.lang || this.state.lang; }
  cur() { return this.props.cur || this.state.cur; }
  setLang = (v) => {
    this.setState({ lang: v });
    if (window.VamosLocale) window.VamosLocale.setLang(v);
    else { try { localStorage.setItem('vamosLang', v); } catch (e) {} }
    if (this.props.onLang) this.props.onLang(v);
  };
  setCur = (v) => {
    this.setState({ cur: v });
    if (window.VamosLocale) window.VamosLocale.setCur(v);
    else { try { localStorage.setItem('vamosCurrency', v); } catch (e) {} }
    if (this.props.onCur) this.props.onCur(v);
  };

  renderVals() {
    const lang = this.lang(), cur = this.cur();
    const t = T[lang] || T.en;
    const variant = this.props.variant === 'overlay' ? 'overlay' : 'inverse';
    const floating = variant === 'overlay' && this.state.floating;
    /* Home drops the CTA while its booking card is on screen. Once you have scrolled
       past it the floating bar carries it, so the way to book is never off the page. */
    const showCta = ((this.props.cta ?? (variant !== 'overlay')) !== false) || floating;
    return {
      n15: 15, n16: 16, n18: 18, n20: 20, n22: 22, n24: 24,
      variant, showCta, floating, floatAttr: floating ? '1' : null,
      lang, cur,
      langOptions: LANGS.map((v) => ({ value: v, label: v.toUpperCase(), note: LANG_NOTE[v] })),
      curOptions: Object.keys(CUR_NOTE).map((v) => ({ value: v, label: v, note: CUR_NOTE[v] })),
      pickLang: this.setLang, pickCur: this.setCur,
      tSignIn: this.props.signInLabel || t.signIn,
      tBookings: t.bookings, tManage: t.manage, tVerify: t.verify,
      acctOpen: this.state.acctOpen,
      acctExpanded: this.state.acctOpen ? 'true' : 'false',
      toggleAcct: this.toggleAcct, acctRootRef: this._acctRoot,
      acctHref: this.state.auth ? '/account' : '/sign-in',
      tAcct: this.state.auth ? (this.state.auth.firstName || t.account) : (this.props.signInLabel || t.signIn),
      signedIn: !!this.state.auth, signedOut: !this.state.auth, tSignOut: t.signOut,
      showAccountLink: !this.props.hideAccount,
      showUnverified: !!this.state.auth && this.state.auth.emailVerified === false,
      acctName: this.state.auth ? (this.state.auth.firstName || this.state.auth.email || '') : '',
      /* The photo set on the account page is the same person up here. */
      acctPhoto: (function () { try { return localStorage.getItem('vamosPhoto') || ''; } catch (e) { return ''; } })(),
      acctFull: this.state.auth
        ? ([this.state.auth.firstName, this.state.auth.lastName].filter(Boolean).join(' ') || this.state.auth.email || t.account)
        : '',
      tAcctPage: t.account,
      /* An address, not copy — it stays as typed in every language. */
      acctTitle: (this.state.auth && this.state.auth.email) || '',
      signOut: () => {
        fetch('/api/auth', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ action: 'signout' }),
        }).finally(() => {
          try { localStorage.removeItem('vamosAuth'); } catch (e) {}
          try { localStorage.removeItem('vamosPhone'); } catch (e) {}
          location.href = '/sign-in';
        });
      },
      tBook: t.book, tLangLabel: t.langLabel, tCurLabel: t.curLabel,
      tMenu: t.menu, tSvc: t.svc, tHelp: t.help, tWhatsApp: t.whatsapp,
      tFaq: t.faq, tContact: t.contact,
      menuOpen: this.state.menuOpen,
      menuOpenAttr: this.state.menuOpen ? '1' : null,
      menuClosingAttr: this.state.menuClosing ? '1' : null,
      menuExpanded: (this.state.menuOpen && !this.state.menuClosing) ? 'true' : 'false',
      menuIcon: (this.state.menuOpen && !this.state.menuClosing) ? 'x' : 'menu',
      menuLabel: (this.state.menuOpen && !this.state.menuClosing) ? t.close : t.menu,
      toggleMenu: this.toggleMenu, closeMenu: this.closeMenu, onSheetAnimEnd: this.onSheetAnimEnd, menuRootRef: this._menuRoot,
      serviceLinks: [
        { href: '/?service=airport#book', label: t.airport },
        { href: '/?service=city#book', label: t.city },
      ],
    };
  }
}
</script>
