<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

<style>:root{--vt-icon-base:"../../assets/icons/";--vt-logo-base:"../../assets/logo/";--vt-pattern-base:"../../assets/patterns/";--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}
/* Button hover/press — colour step only, no shadow, no glow */
.vt-btn{transition:background 140ms cubic-bezier(.2,0,.2,1),border-color 140ms cubic-bezier(.2,0,.2,1),color 140ms cubic-bezier(.2,0,.2,1),transform 80ms cubic-bezier(.2,0,.2,1)}
.vt-btn:hover,.vt-btn:active{box-shadow:none!important}
.vt-btn--primary:hover:not([disabled]){background:var(--vt-accent-hover)}
.vt-btn--primary:active:not([disabled]){background:var(--vt-accent-press);transform:translateY(1px)}
.vt-btn--secondary:hover:not([disabled]){background:var(--vt-charcoal-800)}
.vt-btn--secondary:active:not([disabled]){transform:translateY(1px)}
.vt-btn--ghost:hover:not([disabled]),.vt-btn--outline:hover:not([disabled]),.vt-btn--tertiary:hover:not([disabled]){background:var(--vt-grey-50);border-color:var(--vt-charcoal-900)}
.vt-btn--ghost:active:not([disabled]),.vt-btn--outline:active:not([disabled]),.vt-btn--tertiary:active:not([disabled]){transform:translateY(1px)}
.vt-btn:focus-visible{box-shadow:var(--vt-ring)!important}
.vt-btn[disabled],.vt-btn[aria-disabled="true"]{transform:none}.vt-select .vt-input--focus{box-shadow:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,[data-vtcombo] input:focus{outline:none;box-shadow:none}
body{margin:0}
a{color:var(--vt-text-link);border-bottom:0}a:hover{color:var(--vt-text-link-hover)}
[data-rv-wrap]{box-sizing:border-box;max-width:var(--vt-container-lg);margin-inline:auto;padding-block:clamp(56px,7vw,90px);padding-inline:clamp(16px,3.2vw,56px)}
[data-rv-head]{display:flex;flex-direction:column;align-items:flex-start;gap:var(--vt-space-3);margin-bottom:clamp(var(--vt-space-7),3.6vw,var(--vt-space-8))}
[data-rv-kicker]{margin:0;display:inline-flex;align-self:start;align-items:center;gap:9px;min-block-size:32px;padding-block:0;padding-inline:12px 15px;border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-pill);background:var(--vt-bg-surface);font-family:var(--vt-font-body);font-size:12px;font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;line-height:1;white-space:nowrap;color:var(--vt-charcoal-900)}
[data-rv-kicker] img{inline-size:13px;block-size:13px;display:block}
[data-rv-title]{margin:0;font-family:var(--vt-font-display);font-size:var(--vt-display-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-display-tracking);line-height:var(--vt-display-leading);max-width:22ch;text-wrap:balance;text-align:start}
[data-rv-grid]{display:grid;grid-template-columns:minmax(148px,220px) minmax(0,1fr);column-gap:var(--vt-space-7);row-gap:var(--vt-space-6);align-items:start}
[data-rv-score]{display:flex;flex-direction:column;align-items:flex-start;gap:var(--vt-space-2);min-width:0;padding-block-start:var(--vt-space-2)}
[data-rv-score-mark]{display:block;flex:0 0 auto;block-size:var(--vt-space-9);inline-size:calc(var(--vt-space-9) * 2500 / 1163.3);max-inline-size:100%;object-fit:contain;object-position:start;background:transparent;padding:0;border:0;border-radius:0;box-shadow:none}
[data-rv-score-cap]{margin:0;max-width:28ch;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:var(--vt-weight-regular);line-height:1.45;color:var(--vt-text-secondary);text-wrap:pretty;text-align:start}
[data-rv-cards]{display:flex;flex-flow:row nowrap;align-items:stretch;gap:var(--vt-space-4);margin:0;padding-block:var(--vt-space-2);padding-inline:0;min-width:0;max-width:100%;list-style:none;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;overscroll-behavior-y:auto;touch-action:pan-x pan-y;scroll-behavior:auto;scroll-padding-inline:var(--vt-space-3);scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}

[data-rv-item]{display:flex;flex-grow:0;flex-shrink:0;flex-basis:min(calc(var(--vt-space-12) + var(--vt-space-12) + var(--vt-space-8)),calc(100% - var(--vt-space-7)));min-width:0;max-width:100%}

[data-rv-logo]{display:block;block-size:18px;inline-size:auto;max-inline-size:100%;object-fit:contain;flex:0 0 auto}[data-rv-logo][src*="trustpilot-stacked"]{block-size:var(--vt-space-8);inline-size:calc(var(--vt-space-8) * 2500 / 1163.3);max-inline-size:100%}
[data-rv-src]{font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:var(--vt-weight-medium);line-height:1.3;color:var(--vt-text-secondary);overflow-wrap:anywhere}
[data-rv-q]{margin:0;padding:0;flex:0 0 auto;min-width:0}
[data-rv-text]{margin:0;font-family:var(--vt-font-body);font-size:var(--vt-body-md);font-weight:var(--vt-weight-regular);line-height:1.5;letter-spacing:0;text-align:start;text-wrap:pretty;overflow-wrap:break-word;color:var(--vt-text-primary);quotes:"\201C" "\201D"}

[data-rv-text]::before{content:open-quote}
[data-rv-text]::after{content:close-quote}
[data-rv-foot]{display:flex;flex-direction:column;align-items:start;gap:var(--vt-space-2);margin:0;min-width:0;flex:0 0 auto}
[data-rv-rate]{display:flex;align-items:center;gap:var(--vt-space-1);min-width:0;width:100%}
[data-rv-stars]{display:flex;align-items:center;gap:2px;min-block-size:var(--vt-space-6)}

[data-rv-link]{position:relative;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;inline-size:var(--vt-control-h-md);block-size:var(--vt-control-h-md);flex:0 0 auto;margin:0;padding:0;border:0;border-radius:var(--vt-radius-pill);background:transparent;color:var(--vt-charcoal-900);text-decoration:none;box-shadow:none}
@media (hover:hover){[data-rv-link]:hover{background:var(--vt-grey-50);color:var(--vt-charcoal-900)}}
[data-rv-link]:active{background:var(--vt-grey-100);color:var(--vt-charcoal-900)}
[data-rv-link]:focus-visible{outline:none;box-shadow:var(--vt-ring)}
[data-rv-who]{display:flex;flex-direction:column;align-items:start;gap:var(--vt-space-1);min-width:0;max-width:100%}
[data-rv-name]{font-family:var(--vt-font-body);font-size:var(--vt-body-md);font-weight:var(--vt-weight-semibold);letter-spacing:0;line-height:1.3;color:var(--vt-text-primary);overflow-wrap:anywhere}
[data-rv-sub]{display:block;font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:var(--vt-weight-regular);line-height:1.45;color:var(--vt-text-secondary);overflow-wrap:anywhere;text-wrap:pretty}
[data-rv-origin]{display:flex;flex-wrap:wrap;align-items:center;gap:var(--vt-space-2);min-width:0;max-width:100%}
[data-rv-badge]{display:inline-flex;align-items:center;gap:var(--vt-space-1);min-block-size:var(--vt-space-6);padding-block:var(--vt-space-1);padding-inline:var(--vt-space-3);border-radius:var(--vt-radius-pill);border:1px solid var(--vt-border-subtle);background:var(--vt-bg-surface);box-shadow:none;font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);line-height:1.3;color:var(--vt-text-secondary);width:fit-content;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:start}
[data-rv-badge] > *{flex:0 0 auto}
[data-rv-empty]{box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:var(--vt-space-2);max-width:62ch;padding:var(--vt-space-6);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-xl);background:var(--vt-bg-surface);text-align:start}
[data-rv-empty] strong{font-family:var(--vt-font-body);font-size:var(--vt-body-md);font-weight:var(--vt-weight-semibold);line-height:1.3;color:var(--vt-text-primary)}
[data-rv-empty] span{font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:var(--vt-weight-regular);line-height:1.6;color:var(--vt-text-secondary);text-wrap:pretty;max-width:60ch}
@media (max-width:759px){
[data-rv-grid]{grid-template-columns:minmax(0,1fr)}
[data-rv-score]{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:var(--vt-space-4);row-gap:var(--vt-space-2);padding-block-start:0}
[data-rv-score-cap]{flex-basis:100%;max-width:36ch}
}
@media (prefers-reduced-motion:no-preference){
[data-rv-link]{transition:background-color var(--vt-dur-fast) var(--vt-ease-standard),color var(--vt-dur-fast) var(--vt-ease-standard)}
}
@media (prefers-reduced-motion:reduce){
[data-rv-link]{transition:none}
[data-rv-item][data-rv-clone]{display:none}
}

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:720}}">
/**

  bindRow(el) {

    el.addEventListener('focusout', this.onFocusOut);

    el.addEventListener('scroll', this.onScroll, { passive: true });

    window.addEventListener('pointercancel', this.onUp);

    this.onMq = () => { this.syncClones(); this.kick(); };

  onRowWheel(e) {

  onRowScroll() {

    }

  }
  nudge(px) {

    if (this.loop > 1) this.writeX(el, next);

    this._writing = false;
    this._pos = null;
  }
  paused() {

  }
  kick() {
    if (this.raf || !this.row || this.reduceMotion() || !this.inView) return;
    this.last = 0;
    this.raf = requestAnimationFrame((t) => this.tick(t));
  }
  stopDrift() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
    this.last = 0;
  }
  tick(ts) {
    this.raf = 0;
    if (!this.row || this.reduceMotion() || !this.inView) return;
    if (this.paused()) {
      this.last = 0;
      this._pos = null;
      return;
    }
    if (!this.last) this.last = ts;
    const dt = Math.min(0.05, (ts - this.last) / 1000);
    this.last = ts;
    this.advance(this.PX_PER_SEC * dt);
    this.raf = requestAnimationFrame((t) => this.tick(t));
  }
  originals(el) {
    return [...el.querySelectorAll(':scope > [data-rv-item]:not([data-rv-clone])')];
  }
  clearClones(el) {
    if (!el) return;
    el.querySelectorAll(':scope > [data-rv-clone]').forEach((n) => n.remove());
  }
  syncClones() {
    const el = this.row;
    if (!el || this._syncing) return;
    this._syncing = true;
    try {
      const items = this.originals(el);
      if (this.ro) items.forEach((item) => this.ro.observe(item));
      const overflows = el.scrollWidth > el.clientWidth + 2;
      const want = !this.reduceMotion() && items.length > 0 && overflows;
      const sig = items.map((item) => item.textContent).join('\u0001');
      const have = el.querySelectorAll(':scope > [data-rv-clone]').length;
      if (!want) {
        if (have) this.clearClones(el);
        this.loop = 0;
        this._sig = sig;
        return;
      }
      if (have !== items.length || sig !== this._sig) {
        this.clearClones(el);
        items.forEach((item) => {
          const clone = item.cloneNode(true);
          clone.setAttribute('data-rv-clone', '1');
          clone.setAttribute('aria-hidden', 'true');
          clone.querySelectorAll('a, button, [tabindex]').forEach((node) => node.setAttribute('tabindex', '-1'));
          clone.querySelectorAll('[id]').forEach((node) => node.removeAttribute('id'));
          el.appendChild(clone);
        });
        this._sig = sig;
      }
      const first = items[0];
      const clone = el.querySelector(':scope > [data-rv-clone]');
      const loop = first && clone ? Math.abs(clone.getBoundingClientRect().left - first.getBoundingClientRect().left) : 0;
      this.loop = loop > 1 ? loop : 0;
      this.kick();
    } finally {
      this._syncing = false;
    }
  }
  rtlKind() {
    if (this._rtlKind) return this._rtlKind;
    const probe = document.createElement('div');
    probe.dir = 'rtl';
    probe.style.cssText = 'width:4px;height:1px;overflow:scroll;position:absolute;top:-9999px;visibility:hidden';
    const inner = document.createElement('div');
    inner.style.cssText = 'width:8px;height:1px';
    probe.appendChild(inner);
    document.body.appendChild(probe);
    let kind = 'positive';
    if (probe.scrollLeft > 0) kind = 'reverse';
    else {
      probe.scrollLeft = 1;
      kind = probe.scrollLeft === 0 ? 'negative' : 'positive';
    }
    probe.remove();
    this._rtlKind = kind;
    return kind;
  }
  readX(el) {
    if (getComputedStyle(el).direction !== 'rtl') return el.scrollLeft;

    const kind = this.rtlKind();
    if (kind === 'negative') return -el.scrollLeft;
    if (kind === 'reverse') return max - el.scrollLeft;
    return el.scrollLeft;
  }
  writeX(el, x) {
    const loop = this.loop;
    if (!(loop > 1)) return;
    const n = ((x % loop) + loop) % loop;
    this._writing = true;
    if (getComputedStyle(el).direction !== 'rtl') el.scrollLeft = n;
    else {
      const max = Math.max(0, el.scrollWidth - el.clientWidth);
      const kind = this.rtlKind();
      if (kind === 'negative') el.scrollLeft = -n;
      else if (kind === 'reverse') el.scrollLeft = Math.max(0, max - n);
      else el.scrollLeft = n;
    }

    this._writing = false;
  }
  advance(px) {
    const el = this.row;
    if (!el || !(this.loop > 1) || !(px > 0)) return;
    if (this._pos == null || !isFinite(this._pos)) this._pos = this.readX(el);
    this._pos += px;
    const loop = this.loop;
    this._pos = ((this._pos % loop) + loop) % loop;
    this.writeX(el, this._pos);
  }
  lang() {
    return (this.state && this.state.lang) || (window.VamosLocale ? window.VamosLocale.lang() : 'en');
  }

      if (k === 1) return 'المتوسط من تقييم منشور واحد';
      if (k === 2) return 'المتوسط من تقييمين منشورين';
      if (k >= 3 && k <= 10) return 'المتوسط من ' + k + ' تقييمات منشورة';
      return 'المتوسط من ' + k + ' تقييمًا منشورًا';
    };
    const arCount = (k) => {
      if (k === 1) return 'تقييم منشور واحد';
      if (k === 2) return 'تقييمان منشوران';
      if (k >= 3 && k <= 10) return k + ' تقييمات منشورة';
      return k + ' تقييمًا منشورًا';
    };

      if (lang === 'fr') return n === 1 ? 'Moyenne de 1 avis publié' : ('Moyenne de ' + n + ' avis publiés');
      if (lang === 'ar') return arAvg(n);
      return n === 1 ? 'Average of 1 published review' : ('Average of ' + n + ' published reviews');
    }
    if (lang === 'de') return n === 1 ? '1 veröffentlichte Bewertung' : (n + ' veröffentlichte Bewertungen');
    if (lang === 'fr') return n === 1 ? '1 avis publié' : (n + ' avis publiés');
    if (lang === 'ar') return arCount(n);
    return n === 1 ? '1 published review' : (n + ' published reviews');
  }
  scoreLabel(shown, lang) {
    if (lang === 'de') return 'Bewertet mit ' + shown + ' von 5';
    if (lang === 'fr') return 'Noté ' + shown + ' sur 5';
    if (lang === 'ar') return 'التقييم ' + shown + ' من 5';
    return 'Rated ' + shown + ' out of 5';

    const rated = rows.filter((r) => r.rating > 0);

        platformStars: !!(platform && starSrc),

        ratingLabel: 'Rated ' + r.rating + ' out of 5',

      showEmpty: settled && rows.length === 0,
      scoreShow: rated.length ? 'flex' : 'none',
      scoreStar: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgdmlld0JveD0iMCAwIDI0IDI0IiBhcmlhLWhpZGRlbj0idHJ1ZSI+PHBhdGggZmlsbD0iI0ZEQzIwQiIgZD0iTTEyIDIuNmwyLjQgNi41aDYuOGwtNS41IDQuMiAyLjEgNi42TDEyIDE2LjIgNi4yIDE5LjlsMi4xLTYuNkwyLjggOS4xaDYuOHoiLz48L3N2Zz4=',
      scoreText: scoreText,
      scoreLabel: scoreLabel,
      scoreCaption: rows.length ? this.caption(rated.length || rows.length, rated.length > 0, lang) : '',
