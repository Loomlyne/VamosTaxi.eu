<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

<style>:root{--vt-icon-base:"../../assets/icons/";--vt-logo-base:"../../assets/logo/";--vt-pattern-base:"../../assets/patterns/";--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}
/* Button hover/press — colour step only, no shadow, no glow */

.vt-btn:hover,.vt-btn:active{box-shadow:none!important}
.vt-btn--primary:hover:not([disabled]){background:var(--vt-accent-hover)}
.vt-btn--primary:active:not([disabled]){background:var(--vt-accent-press);transform:translateY(1px)}
.vt-btn--secondary:hover:not([disabled]){background:var(--vt-charcoal-800)}
.vt-btn--secondary:active:not([disabled]){transform:translateY(1px)}
.vt-btn--ghost:hover:not([disabled]),.vt-btn--outline:hover:not([disabled]),.vt-btn--tertiary:hover:not([disabled]){background:var(--vt-grey-50);border-color:var(--vt-charcoal-900)}
.vt-btn--ghost:active:not([disabled]),.vt-btn--outline:active:not([disabled]),.vt-btn--tertiary:active:not([disabled]){transform:translateY(1px)}
.vt-btn:focus-visible{box-shadow:var(--vt-ring)!important}
.vt-btn[disabled],.vt-btn[aria-disabled="true"]{transform:none}.vt-select .vt-input--focus{box-shadow:none}

[data-rv-head]{display:flex;flex-direction:column;align-items:flex-start;gap:var(--vt-space-3);margin-bottom:clamp(var(--vt-space-7),3.6vw,var(--vt-space-8))}

[data-rv-link]{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;inline-size:44px;block-size:44px;flex:0 0 auto;margin:0;padding:0;border:0;border-radius:var(--vt-radius-pill);background:transparent;color:var(--vt-charcoal-900);text-decoration:none}

[data-rv-sub]{font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:var(--vt-weight-regular);line-height:1.45;color:var(--vt-text-secondary);overflow-wrap:anywhere;text-wrap:pretty}
[data-rv-badge]{display:inline-flex;align-items:center;gap:6px;min-block-size:24px;padding-block:2px;padding-inline:11px;border-radius:var(--vt-radius-pill);border:1px solid var(--vt-border-subtle);background:var(--vt-bg-surface);font-family:var(--vt-font-body);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);line-height:1.3;color:var(--vt-text-secondary);width:fit-content;white-space:normal;overflow-wrap:anywhere;text-align:start}
[data-rv-empty]{box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:var(--vt-space-2);max-width:62ch;padding:var(--vt-space-6);border:1px solid var(--vt-border-subtle);border-radius:var(--vt-radius-xl);background:var(--vt-bg-surface);text-align:start}
[data-rv-empty] strong{font-family:var(--vt-font-body);font-size:var(--vt-body-md);font-weight:var(--vt-weight-semibold);line-height:1.3;color:var(--vt-text-primary)}
[data-rv-empty] span{font-family:var(--vt-font-body);font-size:var(--vt-body-sm);font-weight:var(--vt-weight-regular);line-height:1.6;color:var(--vt-text-secondary);text-wrap:pretty;max-width:60ch}
@media (max-width:759px){
[data-rv-grid]{grid-template-columns:minmax(0,1fr)}
[data-rv-score]{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:var(--vt-space-4);row-gap:var(--vt-space-2);padding-block-start:0}
[data-rv-score-cap]{flex-basis:100%;max-width:36ch}
[data-rv-cards]{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
[data-rv-link]{transition:background-color var(--vt-dur-fast) var(--vt-ease-standard),color var(--vt-dur-fast) var(--vt-ease-standard)}
}
@media (prefers-reduced-motion:reduce){
[data-rv-link]{transition:none}
}
:focus-visible:not(input):not(select):not(textarea):not(.vt-btn){outline:3px solid var(--vt-focus)!important;outline-offset:3px;border-radius:var(--vt-radius-xs)}

</sc-if>
</span>
<a data-rv-link="1" href="{{ r.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ r.linkLabel }}" title="{{ r.linkLabel }}" hidden="{{ r.linkHidden }}" style="display:{{ r.linkShow }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
</a>
</div>
<span data-rv-who="1" data-vt-no-i18n="1"><strong data-rv-name="1">{{ r.name }}</strong></span>
<span data-rv-sub="1" data-vt-no-i18n="1" dir="auto" style="display:{{ r.routeShow }}">{{ r.route }}</span>
<sc-if value="{{ r.verified }}" hint-placeholder-val="{{ false }}">
<span data-rv-badge="1">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>{{ r.verifiedLabel }}
</span>
</sc-if>
</div>
</article>
</li>
</sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ true }}">
<div data-rv-empty="1">
<strong>No published reviews yet</strong>
<span>Reviews from completed transfers appear here once they are published.</span>
</div>
</sc-if>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:720}}">
/**
 * Home · Reviews — score column plus a row of cards. Not a carousel.
 * Published rows come from VamosReviews (GET /api/reviews). An empty store
 * stays empty: no sample names, no sample quotes, no platform mark unless
 * that row's source is that platform. The score is the mean of published
 * ratings that are above zero. It is never a hardcoded figure.
 * There is no autoplay and no dwell timer. prefers-reduced-motion has
 * nothing to pause because nothing advances.
 */
class Component extends DCLogic {
  state = { lang: 'en', settled: false };
  componentDidMount() {
    this._onReviews = () => {
      clearTimeout(this._settle);
      this.setState({ settled: true });
    };
    window.addEventListener('vamos:reviews', this._onReviews);
    this.bindReviews();
    this._reviewsWait = setInterval(() => {
      this.bindReviews();
      if (this._offReviews) clearInterval(this._reviewsWait);
    }, 50);
    this._reviewsStop = setTimeout(() => clearInterval(this._reviewsWait), 10000);
    if (window.VamosLocale) {
      this._offLocale = window.VamosLocale.onChange((v) => this.setState({ lang: v.lang }));
    }
  }
  bindReviews() {
    const store = window.VamosReviews;
    if (!store || this._offReviews) return;
    this._offReviews = store.onChange(() => {
      clearTimeout(this._settle);
      this.setState({ settled: true });
    });
    const rows = store.published();
    if (rows.length) {
      this.setState({ settled: true });
    } else if (!this._settle) {
      /* Already-loaded empty store does not emit. One shot, not a dwell. */
      this._settle = setTimeout(() => this.setState({ settled: true }), 1200);
    }
  }
  componentWillUnmount() {
    clearInterval(this._reviewsWait);
    clearTimeout(this._reviewsStop);
    clearTimeout(this._settle);
    if (this._onReviews) window.removeEventListener('vamos:reviews', this._onReviews);
    if (this._offReviews) this._offReviews();
    if (this._offLocale) this._offLocale();
  }
  lang() {
    return (this.state && this.state.lang) || (window.VamosLocale ? window.VamosLocale.lang() : 'en');
  }
  caption(n, rated, lang) {
    const arAvg = (k) => {
      if (k === 1) return 'المتوسط من تقييم منشور واحد';
      if (k === 2) return 'المتوسط من تقييمين منشورين';
      if (k >= 3 && k <= 10) return 'المتوسط من ' + k + ' تقييمات منشورة';
      return 'المتوسط من ' + k + ' تقييمًا منشورًا';
    };
    const arCount = (k) => {
      if (k === 1) return 'تقييم منشور واحد';
      if (k === 2) return 'تقييمان منشوران';
      if (k >= 3 && k <= 10) return k + ' تقييمات منشورة';
      return k + ' تقييمًا منشورًا';
    };
    if (rated) {
      if (lang === 'de') return n === 1 ? 'Durchschnitt aus 1 veröffentlichten Bewertung' : ('Durchschnitt aus ' + n + ' veröffentlichten Bewertungen');
      if (lang === 'fr') return n === 1 ? 'Moyenne de 1 avis publié' : ('Moyenne de ' + n + ' avis publiés');
      if (lang === 'ar') return arAvg(n);
      return n === 1 ? 'Average of 1 published review' : ('Average of ' + n + ' published reviews');
    }
    if (lang === 'de') return n === 1 ? '1 veröffentlichte Bewertung' : (n + ' veröffentlichte Bewertungen');
    if (lang === 'fr') return n === 1 ? '1 avis publié' : (n + ' avis publiés');
    if (lang === 'ar') return arCount(n);
    return n === 1 ? '1 published review' : (n + ' published reviews');
  }
  scoreLabel(shown, lang) {
    if (lang === 'de') return 'Bewertet mit ' + shown + ' von 5';
    if (lang === 'fr') return 'Noté ' + shown + ' sur 5';
    if (lang === 'ar') return 'التقييم ' + shown + ' من 5';
    return 'Rated ' + shown + ' out of 5';
  }
  renderVals() {
    const store = window.VamosReviews;
    const rows = store ? store.published() : [];
    const lang = this.lang();
    const settled = !!(this.state && this.state.settled) || rows.length > 0;
    const rated = rows.filter((r) => r.rating > 0);
    let scoreText = '';
    let scoreLabel = '';
    const starOp = { so1: '0.22', so2: '0.22', so3: '0.22', so4: '0.22', so5: '0.22' };
    if (rated.length) {
      const sum = rated.reduce((a, r) => a + r.rating, 0);
      const value = sum / rated.length;
      const tenths = Math.round(value * 10);
      const shown = Math.floor(tenths / 10) + ((lang === 'de' || lang === 'fr') ? ',' : '.') + (tenths % 10);
      scoreText = shown;
      scoreLabel = this.scoreLabel(shown, lang);
      for (let s = 1; s <= 5; s++) {
        const fill = value - (s - 1);
        starOp['so' + s] = fill >= 1 ? '1' : (fill <= 0 ? '0.22' : String(Math.round(fill * 100) / 100));
      }
    }
    const hrefOf = (raw) => {
      const v = String(raw || '').trim();
      if (!v) return '';
      try {
        const parsed = new URL(v);
        if ((parsed.protocol === 'http:' || parsed.protocol === 'https:') && parsed.hostname) return v;
      } catch (e) {}
      return '';
    };
    const cards = rows.map((r, n) => {
      const label = store ? store.sourceLabel(r.source) : (r.source || '');
      const logo = store && store.sourceLogo ? store.sourceLogo(r.source) : '';
      const starSrc = store && store.starSrc ? store.starSrc(r.source) : '';
      const platform = r.source === 'google' || r.source === 'tripadvisor' || r.source === 'trustpilot';
      const stars = {};
      for (let s = 1; s <= 5; s++) {
        stars['s' + s] = s <= r.rating ? 'var(--vt-yellow)' : 'var(--vt-grey-300)';
        stars['o' + s] = s <= r.rating ? '1' : '0.22';
      }
      const href = hrefOf(r.url);
      const linkLabel = !href ? ''
        : (r.source === 'google' ? 'Read on Google'
          : r.source === 'tripadvisor' ? 'Read on Tripadvisor'
          : r.source === 'trustpilot' ? 'Read on Trustpilot'
          : 'Read the review');
      const verifiedLabel = !r.verified ? ''
        : (r.source === 'google' ? 'Verified Google review'
          : r.source === 'tripadvisor' ? 'Verified Tripadvisor review'
          : r.source === 'trustpilot' ? 'Verified Trustpilot review'
          : 'Verified');
      const route = r.route || (!r.route && r.vehicleClass ? r.vehicleClass : '');
      return Object.assign({
        i1: n + 1,
        name: r.name || '',
        text: r.text || '',
        route: route,
        routeShow: route ? 'block' : 'none',
        sourceLabel: platform ? label : 'Collected by us',
        hasLogo: !!(platform && logo),
        noLogo: !(platform && logo),
        logo: platform ? logo : '',
        starSrc: platform ? starSrc : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgdmlld0JveD0iMCAwIDI0IDI0IiBhcmlhLWhpZGRlbj0idHJ1ZSI+PHBhdGggZmlsbD0iI0ZEQzIwQiIgZD0iTTEyIDIuNmwyLjQgNi41aDYuOGwtNS41IDQuMiAyLjEgNi42TDEyIDE2LjIgNi4yIDE5LjlsMi4xLTYuNkwyLjggOS4xaDYuOHoiLz48L3N2Zz4=',
        platformStars: !!(platform && starSrc),
        vamosStars: !(platform && starSrc),
        starsShow: r.rating > 0 ? 'flex' : 'none',
        ratingLabel: 'Rated ' + r.rating + ' out of 5',
        verified: !!r.verified,
        verifiedLabel: verifiedLabel,
        url: href || '#',
        linkShow: href ? 'inline-flex' : 'none',
        linkHidden: href ? null : true,
        linkLabel: linkLabel,
      }, stars);
    });
    return Object.assign({
      n14: 14, n16: 16, n18: 18, n20: 20,
      viewState: rows.length ? 'ready' : (settled ? 'empty' : 'loading'),
      busy: rows.length || settled ? 'false' : 'true',
      showGrid: rows.length > 0,
      showEmpty: settled && rows.length === 0,
      scoreShow: rated.length ? 'flex' : 'none',
      scoreStar: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgdmlld0JveD0iMCAwIDI0IDI0IiBhcmlhLWhpZGRlbj0idHJ1ZSI+PHBhdGggZmlsbD0iI0ZEQzIwQiIgZD0iTTEyIDIuNmwyLjQgNi41aDYuOGwtNS41IDQuMiAyLjEgNi42TDEyIDE2LjIgNi4yIDE5LjlsMi4xLTYuNkwyLjggOS4xaDYuOHoiLz48L3N2Zz4=',
      scoreText: scoreText,
      scoreLabel: scoreLabel,
      scoreCaption: rows.length ? this.caption(rated.length || rows.length, rated.length > 0, lang) : '',
      cards: cards,
    }, starOp);
  }
}
</script>
