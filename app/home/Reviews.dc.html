<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

<style>:root{--vt-icon-base:"../../assets/icons/";--vt-logo-base:"../../assets/logo/";--vt-pattern-base:"../../assets/patterns/";--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}
/* Button hover/press — colour step only, no shadow, no glow */
.vt-btn{transition:background 140ms cubic-bezier(.2,0,.2,1),border-color 140ms cubic-bezier(.2,0,.2,1),color 140ms cubic-bezier(.2,0,.2,1),transform 80ms cubic-bezier(.2,0,.2,1)}
.vt-btn:hover,.vt-btn:active{box-shadow:none!important}
.vt-btn--primary:hover:not([disabled]){background:var(--vt-accent-hover)}
.vt-btn--primary:active:not([disabled]){background:var(--vt-accent-press);transform:translateY(1px)}
.vt-btn--secondary:hover:not([disabled]){background:var(--vt-charcoal-800)}
.vt-btn--secondary:active:not([disabled]){transform:translateY(1px)}
.vt-btn--ghost:hover:not([disabled]),.vt-btn--outline:hover:not([disabled]),.vt-btn--tertiary:hover:not([disabled]){background:var(--vt-grey-50);border-color:var(--vt-charcoal-900)}
.vt-btn--ghost:active:not([disabled]),.vt-btn--outline:active:not([disabled]),.vt-btn--tertiary:active:not([disabled]){transform:translateY(1px)}
.vt-btn:focus-visible{box-shadow:var(--vt-ring)!important}
.vt-btn[disabled],.vt-btn[aria-disabled="true"]{transform:none}.vt-select .vt-input--focus{box-shadow:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,[data-vtcombo] input:focus{outline:none;box-shadow:none}
body{margin:0}
a{color:var(--vt-text-link);border-bottom:0}a:hover{color:var(--vt-text-link-hover)}
[data-rv-wrap]{box-sizing:border-box;max-width:1200px;margin:0 auto;padding:clamp(56px,7vw,90px) clamp(16px,3.2vw,56px);min-height:480px}
[data-rv-grid]{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(20px,3vw,28px);align-items:stretch;min-height:260px}
[data-rv-card]{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;background:var(--vt-white);border-radius:20px;padding:clamp(26px,3vw,40px) clamp(20px,2.6vw,36px) clamp(28px,3vw,36px);min-height:260px}
[data-rv-stack]{display:grid;width:100%;margin:auto 0;overflow:hidden;min-height:8.5em}
[data-rv-slide]{grid-area:1/1;z-index:0;visibility:hidden;transform:translateX(100%);pointer-events:none;transition:transform var(--rv-ms,480ms) var(--vt-ease-out)}
[data-rv-slide][data-on="1"]{z-index:1;visibility:visible;transform:translateX(0);pointer-events:auto}
[data-rv-slide][data-was="1"]{z-index:0;visibility:visible;transform:translateX(-100%)}
[data-rv][data-dir="-1"] [data-rv-slide]{transform:translateX(-100%)}
[data-rv][data-dir="-1"] [data-rv-slide][data-on="1"]{transform:translateX(0)}
[data-rv][data-dir="-1"] [data-rv-slide][data-was="1"]{transform:translateX(100%)}
[data-rv-face]{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:100%;min-width:0}
[data-rv-mark]{display:flex;align-items:center;justify-content:center;height:36px;margin-bottom:clamp(12px,1.6vw,16px);font-family:var(--vt-font-display);font-size:20px;font-weight:var(--vt-weight-semibold);letter-spacing:-0.01em;line-height:1;color:var(--vt-text-primary);max-width:100%}
[data-rv-logo]{display:block;height:28px;width:auto;max-width:min(200px,100%);object-fit:contain}
[data-rv-name]{margin-top:0;font-family:var(--vt-font-body);font-size:17px;font-weight:600;letter-spacing:-0.005em;line-height:1.3;color:var(--vt-text-primary)}
[data-rv-who]{display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%}
[data-rv-sub]{margin-top:6px;font-size:var(--vt-body-sm);line-height:1.45;color:var(--vt-text-secondary);max-width:100%;overflow-wrap:break-word}
[data-rv-quote]{box-sizing:border-box;background:var(--vt-white);display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--vt-grey-200);border-bottom:1px solid var(--vt-grey-200);padding:clamp(30px,5vw,64px) clamp(0px,2.4vw,40px);min-height:260px}
[data-rv-q]{display:flex;align-items:center;justify-content:center;margin:0;padding:0}
[data-rv-text]{margin:0;max-width:min(34ch,100%);margin-inline:auto;font-family:var(--vt-font-body);font-size:clamp(21px,2.35vw,28px);font-weight:var(--vt-weight-semibold);letter-spacing:0;line-height:1.45;text-align:center;text-wrap:pretty;overflow-wrap:break-word;color:var(--vt-text-primary)}
[data-rv-nav]{display:flex;align-items:center;justify-content:center;gap:clamp(18px,2.4vw,30px);margin-top:clamp(4px,1vw,10px)}
[data-rv-arrow]{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;flex:0 0 auto;padding:0;border:1px solid var(--vt-charcoal-900);border-radius:999px;background:transparent;color:var(--vt-charcoal-900);cursor:pointer;transition:var(--vt-transition-control)}
[data-rv-arrow]:hover{background:var(--vt-yellow);border-color:var(--vt-charcoal-900);color:var(--vt-charcoal-950)}
[data-rv-arrow]:active{transform:translateY(1px)}
[data-rv-arrow]:focus-visible{outline:none;box-shadow:var(--vt-ring)}
[data-rv-stars]{display:flex;align-items:center;gap:var(--vt-space-1);margin-top:var(--vt-space-3)}
[data-rv-stars] img{width:30px;height:30px;flex:0 0 auto;object-fit:contain}
[data-rv-meta]{margin-top:10px;font-size:var(--vt-body-xs);line-height:1.45;color:var(--vt-text-muted);text-align:center;text-wrap:pretty}
[data-rv-badge]{align-items:center;gap:6px;margin-top:12px;height:24px;padding:0 11px;border-radius:999px;border:1px solid var(--vt-border-subtle);background:var(--vt-white);font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-secondary)}
[data-rv-link]{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 auto;margin-top:var(--vt-space-2);padding:0;border:0;border-radius:999px;background:transparent;color:var(--vt-charcoal-900);text-decoration:none}
[data-rv-link]:hover{background:var(--vt-yellow);color:var(--vt-charcoal-950)}
[data-rv-link]:focus-visible{outline:none;box-shadow:var(--vt-ring)}
[data-rv-empty]{box-sizing:border-box;grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:clamp(28px,4vw,48px);border:1px solid var(--vt-grey-300);border-radius:20px;background:var(--vt-white)}
[data-rv-empty] strong{font-family:var(--vt-font-display);font-size:var(--vt-heading-3);font-weight:var(--vt-weight-semibold);color:var(--vt-text-primary)}
[data-rv-empty] span{font-size:var(--vt-body-sm);line-height:1.6;color:var(--vt-text-secondary);max-width:60ch}
[data-rv-note]{box-sizing:border-box;margin-top:clamp(26px,3.4vw,40px);padding:16px 18px;border:1px solid var(--vt-grey-300);border-radius:var(--vt-radius-md);display:flex;flex-direction:column;gap:9px}
[data-rv-note-k]{font-size:var(--vt-label-sm);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;font-weight:var(--vt-label-weight);color:var(--vt-text-muted)}

[data-rv-note] li{font-size:var(--vt-body-sm);line-height:1.6;color:var(--vt-text-secondary);max-width:82ch;text-wrap:pretty}

[data-rv-nav]{position:absolute;bottom:37px;inset-inline-start:0;box-sizing:border-box;width:calc((100% - var(--rv-gap)) * 0.32143);min-width:148px;max-width:calc(50% - var(--rv-gap)/2);margin-top:0;gap:6px}

}

[data-rv-arrow]{width:var(--vt-control-h-md);height:var(--vt-control-h-md)}

[data-rv-arrow]{width:var(--vt-control-h-md);height:var(--vt-control-h-md)}
}
@media (min-width:900px){

[data-rv-nav]{gap:clamp(18px,2.4vw,30px)}
[data-rv-arrow]{width:50px;height:50px}
}

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:780},&quot;autoplaySeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.5,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;slideMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:480,&quot;min&quot;:200,&quot;max&quot;:900,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
/**
 * Home · Reviews — structure from Figma /Main/263 (node 315:25968): H2 over a two-up block,
 * a 360-wide rounded info card on the left and a 760-wide quote panel ruled top and bottom on
 * the right, geometry verbatim (20px radius, 40px gap, 50px pagination circles, gap 30).
 * No dot pager — more reviews would overflow it. Arrows only. Recoloured to Vamos: card --vt-grey-50, type Qurova/Poppins, hairlines the brand
 * grey #DEDEDE, both arrows outlined charcoal — the reference's purple is gone entirely.
 *
 * Both stacks (card identity, quote) hold all slides as literal markup in one grid cell,
 * so the wrap never unmounts and the panel stays as tall as its longest quote — no
 * measuring, no reflow on advance. A step writes data-on/aria-hidden imperatively; CSS
 * slides on --vt-ease-out. Visibility is not transitioned — the old delayed hidden
 * blanked the active card between ticks. Off-slides can be hidden; on/was stay visible.
 *
 * Autoplay: 2.5s dwell (prop default). The import does not pass autoplaySeconds, so a
 * missing prop must use that default — not a longer fallback that reads as stuck.
 * Paused while the block is hovered or holds focus, off under prefers-reduced-motion
 * or a hidden tab, and stopped for good the moment either arrow is clicked — a manual
 * reader is never overruled by the timer. A pending dwell is not cleared on re-render;
 * only pause, a manual step, or unmount cancels it.
 */
class Component extends DCLogic {
  state = { lang: 'en' };
  N = 0;
  i = 0;
  reduced() { return typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  dwell() {
    const raw = this.props.autoplaySeconds;
    const s = raw == null || raw === '' ? 2.5 : +raw;
    return s > 0 ? s * 1000 : 0;
  }
  clearDwell() { clearTimeout(this.t); this.t = 0; }
  paused() {
    return this.stopped || this.hoverP || this.focusP || this.reduced() || !this.dwell()
      || (typeof document !== 'undefined' && document.hidden);
  }
  rootRef = (el) => { this.root = el; this.boot(); };
  liveRef = (el) => { this.live = el; };
  boot() {
    if (!this.root) return;
    this.root.style.setProperty('--rv-ms', (this.props.slideMs ?? 400) + 'ms');
    this.paint();
    this.arm();
  }
  paint() {
    if (!this.root) return;
    this.root.querySelectorAll('[data-rv-slide]').forEach((el) => {
      const n = +el.getAttribute('data-i');
      const on = n === this.i + 1;
      el.setAttribute('data-on', on ? '1' : '0');
      /* The slide that just left is parked one full width the other way, so the pair travels
         across the panel together instead of the incoming one arriving over a static ghost. */
      el.setAttribute('data-was', !on && this.fromI != null && n === this.fromI + 1 ? '1' : '0');
      if (on) el.removeAttribute('aria-hidden'); else el.setAttribute('aria-hidden', 'true');
    });
  }
  step(d, manual) {
    if (this.N < 2) return;
    if (manual) { this.stopped = true; this.clearDwell(); }
    this.fromI = this.i;
    this.i = (this.i + d + this.N) % this.N;
    if (this.root) this.root.setAttribute('data-dir', d < 0 ? '-1' : '1');
    this.paint();
    if (manual) { if (this.live) this.live.textContent = 'Review ' + (this.i + 1) + ' of ' + this.N; }
    else this.arm();
  }
  arm() {
    if (this.paused()) { this.clearDwell(); return; }
    if (this.t) return;
    this.t = setTimeout(() => { this.t = 0; this.step(1, false); }, this.dwell());
  }
  hold(k, v) { this[k] = v; if (v) this.clearDwell(); else this.arm(); }
  prev = () => this.step(-1, true);
  next = () => this.step(1, true);
  hoverIn = () => this.hold('hoverP', true);
  hoverOut = () => this.hold('hoverP', false);
  focusIn = () => this.hold('focusP', true);
  focusOut = () => this.hold('focusP', false);
  key = (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); this.step(1, true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); this.step(-1, true); }
  };
  vis = () => { if (document.hidden) this.clearDwell(); else this.arm(); };
  /* Helmet injects vamos-reviews.js after the first paint. If we only subscribe
     when the store is already there, the card stays the empty shells. */
  bindReviews() {
    const store = window.VamosReviews;
    if (!store || this._offReviews) return;
    this._offReviews = store.onChange(() => { this.i = 0; this.forceUpdate(); });
    this.forceUpdate();
  }
  componentDidMount() {
    document.addEventListener('visibilitychange', this.vis);
    this._onReviewsEvent = () => { this.i = 0; this.forceUpdate(); };
    window.addEventListener('vamos:reviews', this._onReviewsEvent);
    this.bindReviews();
    this._reviewsWait = setInterval(() => {
      this.bindReviews();
      if (this._offReviews) clearInterval(this._reviewsWait);
    }, 50);
    this._reviewsStop = setTimeout(() => clearInterval(this._reviewsWait), 10000);
    if (window.VamosLocale) {
      this._offLocale = window.VamosLocale.onChange((v) => this.setState({ lang: v.lang }));
    }
  }
  componentDidUpdate() { this.boot(); }
  componentWillUnmount() {
    this.clearDwell();
    clearInterval(this._reviewsWait);
    clearTimeout(this._reviewsStop);
    document.removeEventListener('visibilitychange', this.vis);
    if (this._onReviewsEvent) window.removeEventListener('vamos:reviews', this._onReviewsEvent);
    if (this._offReviews) this._offReviews();
    if (this._offLocale) this._offLocale();
  }
  renderVals() {
    const t = (s) => (window.VamosLocale ? window.VamosLocale.t(s) : s);
    const store = window.VamosReviews;
    const rows = store ? store.published() : [];
    this.N = rows.length;
    if (this.i >= this.N) this.i = 0;
    const slides = rows.map((r, n) => {
      const label = store ? store.sourceLabel(r.source) : r.source;
      const logo = store && store.sourceLogo ? store.sourceLogo(r.source) : '';
      const starSrc = store && store.starSrc ? store.starSrc(r.source) : '';
      const platformStars = !!starSrc;
      const stars = {};
      for (let s = 1; s <= 5; s++) {
        stars['s' + s] = s <= r.rating ? 'var(--vt-yellow)' : 'var(--vt-grey-300)';
        stars['o' + s] = s <= r.rating ? '1' : '0.22';
      }
      const meta = r.vehicleClass || '';
      const href = (function () {
        const raw = String(r.url || '').trim();
        if (!raw) return '';
        try {
          const parsed = new URL(raw);
          if ((parsed.protocol === 'http:' || parsed.protocol === 'https:') && parsed.hostname) return raw;
        } catch (e) {}
        return '';
      })();
      return Object.assign({
        i1: n + 1,
        on: n === this.i ? '1' : '0',
        name: r.name,
        route: r.route || '',
        sourceLabel: label,
        hasLogo: !!logo,
        noLogo: !logo,
        logo: logo,
        starSrc: starSrc,
        platformStars: platformStars,
        vamosStars: !platformStars,
        quote: '“' + r.text + '”',
        starsShow: r.rating > 0 ? 'flex' : 'none',
        ratingLabel: t('Rated 5 out of 5').replace('5 out', r.rating + ' out'),
        meta: meta,
        metaShow: meta ? 'block' : 'none',
        verifiedShow: r.verified ? 'inline-flex' : 'none',
        url: href,
        linkShow: href ? 'inline-flex' : 'none',
        linkLabel: t('Read on Google').replace('Google', label),
        slideLabel: t('Review 1 of 5').replace('1 of 5', (n + 1) + ' of ' + rows.length),
      }, stars);
    });
    return {
      n14: 14, n16: 16, n20: 20, n30: 30,
      rootRef: this.rootRef, liveRef: this.liveRef,
      prev: this.prev, next: this.next, key: this.key,
      hoverIn: this.hoverIn, hoverOut: this.hoverOut, focusIn: this.focusIn, focusOut: this.focusOut,
      slides: slides,
      hasReviews: slides.length > 0,
    };
  }
}

</script>
