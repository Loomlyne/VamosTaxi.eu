<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:720}}">
/**
 * Home · Reviews — platform score chips on top, a masonry wall of full reviews below.
 * Rows come from VamosReviews (GET /api/reviews, published only) and are never
 * edited or truncated. A chip shows only for a source that has at least one
 * published row; its score is the mean of that source's rated rows. The whole
 * section renders nothing while fewer than 3 published rows exist (once the
 * store has answered); until then it shows a skeleton. A card's logo links out
 * only when sourceUrl is an http(s) URL on that platform's own domain.
 */
class Component extends DCLogic {
  state = { lang: 'en', settled: false };
  componentDidMount() {
    this._onReviews = () => {
      clearTimeout(this._settle);
      this.setState({ settled: true });
    };
    window.addEventListener('vamos:reviews', this._onReviews);
    this.bindReviews();
    this._reviewsWait = setInterval(() => {
      this.bindReviews();
      if (this._offReviews) clearInterval(this._reviewsWait);
    }, 50);
    this._reviewsStop = setTimeout(() => clearInterval(this._reviewsWait), 10000);
    /* A failed load never emits; stop showing the skeleton after a while. */
    this._settle = setTimeout(() => this.setState({ settled: true }), 4000);
    if (window.VamosLocale) {
      this._offLocale = window.VamosLocale.onChange((v) => this.setState({ lang: v.lang }));
    }
  }
  bindReviews() {
    const store = window.VamosReviews;
    if (!store || this._offReviews) return;
    this._offReviews = store.onChange(() => {
      clearTimeout(this._settle);
      this.setState({ settled: true });
    });
    store.published();
    if (store.ready && store.ready()) this.setState({ settled: true });
  }
  componentWillUnmount() {
    clearInterval(this._reviewsWait);
    clearTimeout(this._reviewsStop);
    clearTimeout(this._settle);
    if (this._onReviews) window.removeEventListener('vamos:reviews', this._onReviews);
    if (this._offReviews) this._offReviews();
    if (this._offLocale) this._offLocale();
  }
  lang() {
    return (this.state && this.state.lang) || (window.VamosLocale ? window.VamosLocale.lang() : 'en');
  }
  /** Returns raw when it is an http(s) URL on the platform's own domain, else ''. */
  hrefOf(raw, source) {
    const v = String(raw || '').trim();
    if (!v) return '';
    let u;
    try { u = new URL(v); } catch (e) { return ''; }
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    const h = u.hostname.toLowerCase();
    const on = (d) => h === d || h.endsWith('.' + d);
    let ok = false;
    if (source === 'google') ok = /(^|\.)google\.[a-z.]{2,}$/.test(h) || on('g.page') || on('goo.gl');
    else if (source === 'trustpilot') ok = on('trustpilot.com');
    else if (source === 'tripadvisor') ok = /(^|\.)tripadvisor\.[a-z.]{2,}$/.test(h);
    return ok ? v : '';
  }
  renderVals() {
    const store = window.VamosReviews;
    const rows = store ? store.published() : [];
    const lang = this.lang();
    const settled = !!(this.state && this.state.settled) || rows.length > 0 || !!(store && store.ready && store.ready());
    const enough = rows.length >= 3;
    const loading = !enough && !settled;
    const PLATFORMS = ['google', 'trustpilot', 'tripadvisor'];
    const dec = (lang === 'de' || lang === 'fr') ? ',' : '.';
    const chips = PLATFORMS.map((id) => {
      const mine = rows.filter((r) => r.source === id);
      if (!mine.length) return null;
      const rated = mine.filter((r) => r.rating > 0);
      const tenths = rated.length ? Math.round(rated.reduce((a, r) => a + r.rating, 0) / rated.length * 10) : 0;
      return {
        id: id,
        label: store.sourceLabel(id),
        logo: '/assets/reviews/' + id + '.svg',
        score: rated.length ? Math.floor(tenths / 10) + dec + (tenths % 10) : '',
        countLabel: mine.length === 1 ? '1 review' : mine.length + ' reviews',
      };
    }).filter(Boolean);
    const cards = rows.map((r) => {
      const platform = PLATFORMS.indexOf(r.source) >= 0;
      const href = platform ? this.hrefOf(r.url, r.source) : '';
      const label = platform ? store.sourceLabel(r.source) : '';
      const o = {
        text: r.text || '',
        name: r.name || '',
        route: r.route || '',
        routeShow: r.route ? 'block' : 'none',
        starsShow: r.rating > 0 ? 'flex' : 'none',
        ratingLabel: 'Rated ' + r.rating + ' out of 5',
        label: label,
        logo: platform ? '/assets/reviews/' + r.source + '.svg' : '',
        url: href,
        markLink: !!href,
        markImg: platform && !href,
        markText: !platform,
        linkLabel: href ? 'Read on ' + label : '',
      };
      for (let s = 1; s <= 5; s++) o['off' + s] = s <= r.rating ? null : '1';
      return o;
    });
    return {
      n16: 16,
      showSection: enough || loading,
      viewState: enough ? 'ready' : 'loading',
      busy: enough ? 'false' : 'true',
      loading: loading,
      ready: enough,
      chips: chips,
      cards: cards,
    };
  }
}
</script>
