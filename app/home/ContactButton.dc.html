<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>
<body>
<div id="vt-boot-cover" aria-hidden="true"></div>
<!-- ContactButton: the one way to reach a person from every public page (261003, owner-signed
     direction B). Twin: app/home/ContactButton.dc.html (byte-identical; a unit test pins it).
     React twin for the Next pages: apps/web/components/shell/ContactButton.tsx.
       float, above 680px  : charcoal CONTACT pill bottom inline-end; open, it reads CLOSE.
       float, 680px down   : 54px charcoal disc with the yellow icon; the menu is a bottom sheet.
       docked              : 54px outline IconButton for a bottom bar (the checkout PAY bar).
     Hidden (each rule is a data attribute the owning component sets; no scroll handler):
       html[data-vt-ck-open]  cookie card open, phone only (CookieBanner);
       html[data-vt-sheet-open] booking sheet open (BookingSheet);
       html[data-vt-trav-open]  travellers sheet open on a phone (home);
       html[data-vt-contact-docked] a docked button is on the page;
       data-kb="1" on the root  a text field has focus on a phone (keyboard up).
     Home on a phone: while the "Where to?" card ([data-contact-lift]) reaches the bottom corner
     the disc sits just above it and scrolls with it; once the card has moved away it drops back
     to the corner (owner, 2026-10-03). An IntersectionObserver decides, not a scroll handler.
     ?cb-gallery=1 (or gallery prop) shows every state side by side for review. -->

/* The menu opens on click/tap; Esc, a tap outside, the close button or following a row close
   it, and focus goes back to the button. The phone sheet is modal (focus stays inside); the
   card is not. Copy is English in the markup; the locale runtime translates it in place. */
const CB_PHONE = '(max-width: 680px)';
const CB_ZONE = 16 + 54 + 16;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.uid = 'vt-cb-' + Math.random().toString(36).slice(2, 9);
    this.rootRef = React.createRef();
    this.panelRef = React.createRef();
    this.gallery = props.gallery === true || props.gallery === 'true' || /[?&]cb-gallery=1(&|$)/.test(String(window.location.search || ''));
    this.state = {
      open: props.open === true || props.open === 'true',
      narrow: this.isNarrow(), lang: this.curLang(), kb: false, lift: false, liftTop: 0,
    };
  }
  variant() { return this.props.variant === 'docked' ? 'docked' : 'float'; }
  isNarrow() {
    if (typeof window.matchMedia === 'function') return window.matchMedia(CB_PHONE).matches;
    return (window.innerWidth || 0) <= 680;
  }
  curLang() {
    const L = window.VamosLocale;
    const v = L && (typeof L.lang === 'function' ? L.lang() : L.lang);
    return v === 'de' || v === 'fr' || v === 'ar' ? v : 'en';
  }
  componentDidMount() {
    const L = window.VamosLocale;
    if (L && typeof L.onChange === 'function') {
      this._offLocale = L.onChange((v) => this.setState({ lang: (v && v.lang) || this.curLang() }));
    }
    if (typeof window.matchMedia === 'function') {
      this._mq = window.matchMedia(CB_PHONE);
      if (this._mq.addEventListener) this._mq.addEventListener('change', this.onMq); else if (this._mq.addListener) this._mq.addListener(this.onMq);
    }
    document.addEventListener('keydown', this.onKey);
    document.addEventListener('pointerdown', this.onDocDown, true);
    document.addEventListener('focusin', this.onFocusIn);
    document.addEventListener('focusout', this.onFocusOut);
    window.addEventListener('resize', this.onResize);
    if (this.variant() === 'docked') document.documentElement.setAttribute('data-vt-contact-docked', '1');
    this._h = window.innerHeight || 0;
    this.setupLift();
    if (this.state.open) this.focusPanel();
  }
  componentWillUnmount() {
    this.unmounted = true;
    if (this._offLocale) this._offLocale();
    if (this._mq) { if (this._mq.removeEventListener) this._mq.removeEventListener('change', this.onMq); else if (this._mq.removeListener) this._mq.removeListener(this.onMq); }
    document.removeEventListener('keydown', this.onKey);
    document.removeEventListener('pointerdown', this.onDocDown, true);
    document.removeEventListener('focusin', this.onFocusIn);
    document.removeEventListener('focusout', this.onFocusOut);
    window.removeEventListener('resize', this.onResize);
    if (this._io) this._io.disconnect();
    clearTimeout(this._kbT); clearTimeout(this._outT);
    if (this.variant() === 'docked') document.documentElement.removeAttribute('data-vt-contact-docked');
  }
  onMq = () => { if (!this.unmounted) this.setState({ narrow: this.isNarrow() }, this.setupLift); };
  onResize = () => {
    const h = window.innerHeight || 0;
    if (Math.abs(h - (this._h || 0)) < 2) return;
    this._h = h;
    this.setupLift();
  };
  /* Home on a phone: the observer's root is the bottom strip the disc lives in. While the
     "Where to?" card reaches into that strip the disc sits just above the card, in the page,
     so it scrolls with the card; when the card leaves the strip the disc goes back to the corner. */
  setupLift = () => {
    if (this._io) { this._io.disconnect(); this._io = null; }
    const el = this.variant() === 'float' && this.state.narrow ? document.querySelector('[data-contact-lift]') : null;
    if (!el || typeof window.IntersectionObserver !== 'function') {
      if (this.state.lift) this.setState({ lift: false });
      return;
    }
    const top = Math.max(0, (window.innerHeight || 0) - CB_ZONE);
    this._io = new window.IntersectionObserver((entries) => {
      const e = entries[entries.length - 1];
      if (!e || this.unmounted) return;
      if (e.isIntersecting) this.setState({ lift: true, liftTop: this.liftTop(el) });
      else if (this.state.lift) this.setState({ lift: false });
    }, { rootMargin: '-' + top + 'px 0px 0px 0px', threshold: 0 });
    this._io.observe(el);
  };
  /** Page position (in the root's containing block) 12px above the card's top edge. */
  liftTop(el) {
    const r = el.getBoundingClientRect();
    let base = -(window.scrollY || window.pageYOffset || 0);
    const root = this.rootRef.current;
    for (let n = root && root.parentElement; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
      const cs = window.getComputedStyle(n);
      if (cs.position !== 'static' || cs.transform !== 'none') { base = n.getBoundingClientRect().top - n.scrollTop; break; }
    }
    return Math.round(r.top - base - 54 - 12);
  }
  isTextField(n) {
    if (!n || n.nodeType !== 1) return false;
    if (n.isContentEditable) return true;
    if (n.tagName === 'TEXTAREA') return true;
    if (n.tagName !== 'INPUT') return false;
    const t = String(n.type || 'text').toLowerCase();
    return ['button', 'submit', 'reset', 'checkbox', 'radio', 'range', 'color', 'file', 'image', 'hidden'].indexOf(t) < 0;
  }
  onFocusIn = (e) => {
    const root = this.rootRef.current;
    if (root && root.contains(e.target)) return;
    if (this.isTextField(e.target) && !this.state.kb) this.setState({ kb: true });
  };
  onFocusOut = () => {
    clearTimeout(this._kbT);
    this._kbT = setTimeout(() => {
      if (this.unmounted) return;
      const kb = this.isTextField(document.activeElement);
      if (kb !== this.state.kb) this.setState({ kb });
    }, 0);
  };
  trigger() { const r = this.rootRef.current; return r ? r.querySelector('[data-cb-trigger]') : null; }
  focusTrigger() { const t = this.trigger(); if (t) { try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); } } }
  focusPanel() { const p = this.panelRef.current; if (p) { try { p.focus({ preventScroll: true }); } catch (e) { p.focus(); } } }
  openMenu() { this.setState({ open: true }, () => this.focusPanel()); }
  close(restore) {
    if (!this.state.open) return;
    this.setState({ open: false }, () => { if (restore) this.focusTrigger(); });
  }
  toggle = () => { if (this.state.open) this.close(true); else this.openMenu(); };
  follow = () => this.close(true);
  scrimClose = () => this.close(true);
  closeBtn = () => this.close(true);
  onDocDown = (e) => {
    if (!this.state.open) return;
    const root = this.rootRef.current;
    if (root && root.contains(e.target)) return;
    this.close(false);
    clearTimeout(this._outT);
    this._outT = setTimeout(() => {
      const a = document.activeElement;
      if (!a || a === document.body || a === document.documentElement) this.focusTrigger();
    }, 0);
  };
  onKey = (e) => {
    if (!this.state.open) return;
    if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); this.close(true); return; }
    if (e.key !== 'Tab' || !this.state.narrow) return;
    const box = this.panelRef.current;
    if (!box) return;
    const f = Array.prototype.filter.call(box.querySelectorAll('a[href],button:not([disabled])'), (n) => n.getClientRects().length > 0);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!box.contains(a)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && (a === first || a === box)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  };
  renderVals() {
    const s = this.state;
    const v = this.variant();
    const open = !!s.open;
    const narrow = !!s.narrow;
    const lifted = v === 'float' && narrow && !!s.lift;
    const menuId = this.uid + '-menu';
    const contactHref = s.lang === 'en' ? '/contact' : '/' + s.lang + '/contact';
    const aria = (o) => (o ? 'Close contact options' : 'Open contact options');
    const gal = this.gallery;
    return {
      yes: true, no: false, n20: 20, n22: 22,
      rootRef: this.rootRef, panelRef: this.panelRef,
      variant: v,
      narrowAttr: narrow ? '1' : '0', openAttr: open ? '1' : '0', liftAttr: lifted ? '1' : '0', kbAttr: s.kb ? '1' : '0',
      rootStyle: lifted ? 'top:' + s.liftTop + 'px' : '',
      showPill: v === 'float' && !narrow,
      showDisc: v === 'float' && narrow,
      showDocked: v === 'docked',
      showCard: open && !narrow,
      showSheet: open && narrow,
      triggerIcon: open ? 'x' : 'message-circle',
      pillLabel: open ? 'Close' : 'Contact',
      triggerLabel: aria(open),
      openStr: open ? 'true' : 'false',
      ariaControls: open ? menuId : undefined,
      menuId, titleId: this.uid + '-title',
      contactHref,
      toggle: this.toggle, follow: this.follow, scrimClose: this.scrimClose, closeBtn: this.closeBtn,
      gallery: gal,
      galPills: gal ? [
        { s: undefined, cap: 'pill · default', icon: 'message-circle', label: 'Contact', aria: aria(false) },
        { s: 'hover', cap: 'pill · hover', icon: 'message-circle', label: 'Contact', aria: aria(false) },
        { s: 'press', cap: 'pill · press', icon: 'message-circle', label: 'Contact', aria: aria(false) },
        { s: 'focus', cap: 'pill · focus', icon: 'message-circle', label: 'Contact', aria: aria(false) },
        { s: undefined, cap: 'pill · open', icon: 'x', label: 'Close', aria: aria(true) },
      ] : [],
      galDiscs: gal ? [
        { s: undefined, cap: 'phone disc · default', icon: 'message-circle', aria: aria(false) },
        { s: 'hover', cap: 'phone disc · hover', icon: 'message-circle', aria: aria(false) },
        { s: 'press', cap: 'phone disc · press', icon: 'message-circle', aria: aria(false) },
        { s: 'focus', cap: 'phone disc · focus', icon: 'message-circle', aria: aria(false) },
        { s: undefined, cap: 'phone disc · open', icon: 'x', aria: aria(true) },
      ] : [],
      galDocks: gal ? [
        { cap: 'in the pay bar', icon: 'message-circle', aria: aria(false) },
        { cap: 'in the pay bar · open', icon: 'x', aria: aria(true) },
      ] : [],
      galRows: gal ? [
        { s: '', size: 'card', cap: 'row · default' },
        { s: 'hover', size: 'card', cap: 'row · hover' },
        { s: 'press', size: 'card', cap: 'row · press' },
        { s: 'focus', size: 'card', cap: 'row · focus' },
        { s: '', size: 'sheet', cap: 'row · sheet (64px)' },
      ] : [],
    };
  }
}
</script>
</body>
