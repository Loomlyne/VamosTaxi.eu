<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>

<style>:root{--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}
:root{--vt-icon-base:"../../assets/icons/"}body{margin:0}
/* Sheet frame. Fixed and full-screen when open; relative inside a frame in the states gallery. */
[data-bs]{box-sizing:border-box;display:flex;flex-direction:column;min-width:0;background:var(--vt-bg-surface);color:var(--vt-text-primary);font-family:var(--vt-font-body);z-index:400;overflow:hidden}
/* The sheet always covers the whole layout viewport, keyboard or not; only its content is sized to what is visible
   (--bs-h, --bs-top from visualViewport), so the page behind never shows under the footer. */
[data-bs][data-inline="0"]{position:fixed;inset-inline:0;top:0;height:100vh;height:100lvh;padding-block-start:var(--bs-top,0px);padding-block-end:max(0px,calc(100lvh - var(--bs-h,100dvh) - var(--bs-top,0px)));animation:vt-bs-in 320ms var(--vt-ease-out) both}
[data-bs][data-inline="1"]{position:relative;height:100%;width:100%}
[data-bs][data-leaving="1"]{animation:vt-bs-out 200ms var(--vt-ease-in) both;pointer-events:none}
@keyframes vt-bs-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes vt-bs-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(16px)}}
@keyframes vt-bs-fade{from{opacity:0}to{opacity:1}}
[data-bs] *{box-sizing:border-box}
[data-bs-head]{flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top)) 8px 0;border-block-end:1px solid var(--vt-border-subtle);background:var(--vt-bg-surface)}
[data-bs-row]{display:flex;align-items:center;justify-content:flex-end;height:44px}
[data-bs-slot]{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center}
[data-bs-sec]{display:flex;flex-direction:column;gap:16px;min-width:0;padding-block-start:24px;border-block-start:1px solid var(--vt-border-subtle)}
[data-bs-sec]:first-of-type{padding-block-start:0;border-block-start:0}
[data-bs-sech]{margin:0;font-family:var(--vt-font-display);font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.01em;color:var(--vt-text-primary)}
[data-bs-body]{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 32px}
[data-bs-col]{max-inline-size:560px;margin-inline:auto;display:flex;flex-direction:column;gap:24px;min-width:0}
[data-bs-title]{margin:0;font-family:var(--vt-font-display);font-size:20px;font-weight:600;line-height:1.18;letter-spacing:-.01em;color:var(--vt-text-primary);outline:none}
[data-bs-pane]{display:flex;flex-direction:column;gap:16px;min-width:0;animation:vt-bs-fade 140ms var(--vt-ease-standard) both}
[data-bs-field]{display:flex;flex-direction:column;min-width:0}
[data-bs-fade]{animation:vt-bs-fade 140ms var(--vt-ease-standard) both}
[data-bs-kr]{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 6px}
[data-bs-kicker]{display:block;font-size:13px;font-weight:600;line-height:18px;letter-spacing:var(--vt-label-tracking);text-transform:uppercase;color:var(--vt-text-secondary)}
[data-bs-opt]{font-size:13px;font-weight:400;line-height:18px;color:var(--vt-text-muted)}
[data-bs-hint]{display:block;margin-block-start:6px;font-size:13px;font-weight:400;line-height:1.45;color:var(--vt-text-secondary)}
/* Place combobox: same look as the laptop box, 54px. */
[data-bs] [data-vtcombo]{display:flex;align-items:center;gap:10px;height:var(--vt-control-h-lg);min-height:var(--vt-control-h-lg);max-height:var(--vt-control-h-lg);width:100%;padding-inline:12px 4px;background:var(--vt-bg-surface);border:var(--vt-border-w) solid var(--vt-border-subtle);border-radius:999px;overflow:hidden;transition:border-color 140ms var(--vt-ease-standard)}
[data-bs] [data-vtcombo]:hover{border-color:var(--vt-grey-300)}
[data-bs] [data-vtcombo]:focus-within{border-color:var(--vt-charcoal-900)}
[data-bs] [data-vtcombo][data-err="true"]{border-color:var(--vt-danger)}
[data-bs] [data-vtcombo] input{all:unset;-webkit-appearance:none;appearance:none;background:transparent;flex:1 1 auto;min-width:0;height:100%;font-family:var(--vt-font-body);font-size:16px;color:var(--vt-text-primary);line-height:1.4;text-overflow:ellipsis}

[data-combo-x]:hover{background:var(--vt-grey-100);color:var(--vt-charcoal-900)}
[data-combo-x]:focus-visible{box-shadow:var(--vt-ring)}
[data-bs-sug]{display:flex;flex-direction:column;gap:2px;margin-block-start:8px;min-width:0}

/* Date and time: the laptop box picker (WhenPicker), stacked, 54px pill triggers. */
[data-bs-when]{display:flex;flex-direction:column;gap:16px;min-width:0}
[data-bs-when]>div{min-width:0}
/* Travellers steppers (26.3 box pattern). */
[data-trav-row]{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
[data-trav-label]{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--vt-text-primary)}
[data-stepper]{display:inline-flex;align-items:center;gap:12px}
[data-step]{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:var(--vt-border-w) solid var(--vt-border-subtle);background:var(--vt-bg-surface);color:var(--vt-text-primary);cursor:pointer;transition:var(--vt-transition-control)}

[data-bs-foot]{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-block-start:1px solid var(--vt-border-subtle);background:var(--vt-bg-surface);display:flex;flex-direction:column;gap:8px}
[data-bs-msg]{min-height:20px;font-size:13px;font-weight:400;line-height:1.45;color:var(--vt-text-secondary);max-inline-size:560px;width:100%;margin-inline:auto}
[data-bs-msg] [data-bs-warn]{display:inline-flex;align-items:flex-start;gap:6px;color:var(--vt-danger)}
[data-bs-msg] [data-bs-warn]>span:first-child{margin-block-start:1px}
[data-bs-next]{max-inline-size:560px;width:100%;margin-inline:auto}
[data-bs-hide]{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (min-width:681px){[data-bs-body]{padding-inline:24px}[data-bs-foot]{padding-inline:24px}}
@media (prefers-reduced-motion:reduce){[data-bs],[data-bs-pane],[data-bs-fade]{animation:none!important}[data-bs] *{transition:none!important}}</style>

/**
 * BookingSheet: full-screen ONE-page booking sheet (phone and tablet home, 26.4.2).
 * Where (From, flight number, To), When (Date, then Time, both the laptop box's WhenPicker) and Who (passengers, bags)
 * are all on the page when it opens; one SEE PRICES button at the bottom.
 * Holds no trip data. Every value arrives as a prop and every change leaves through a callback,
 * so home's single trip state feeds both this sheet and the laptop box. No storage APIs.
 * Mechanics (skipped when `inline`): scroll lock, one history entry, focus trap, visualViewport sizing.
 */

  constructor(props) {

    this._depth = 0;

  /**

   * The first missing answer wins, in page order: From, flight, To, date, time. msg is the English source string.
   */
  tripIssue() {
    const p = this.props;
    const has = (v) => !!(v && String(v).trim());
    if (!has(p.fromText)) return { msg: 'Enter a pickup address', field: 'from' };
    if (!p.fromChosen) return { msg: 'Choose a pickup address from the list', field: 'from' };
    if (p.fromAirport && !has(p.flight)) return { msg: 'Enter the flight number', field: 'flight' };
    if (has(p.flight) && !p.flightValid) return { msg: 'Check the flight number', field: 'flight' };
    if (!has(p.toText)) return { msg: 'Enter a drop-off address', field: 'to' };
    if (!p.toChosen) return { msg: 'Choose a drop-off address from the list', field: 'to' };
    if (p.samePlace) return { msg: 'Pickup and drop-off are the same place', field: 'to' };
    const day = +p.dayNum || 0;
    if (!day && !p.time) return { msg: 'Choose a date and a pickup time', field: 'date' };
    if (!day) return { msg: 'Choose a date', field: 'date' };
    if (!p.time) return { msg: 'Choose a pickup time', field: 'time' };

  _keepFocusVisible() {

  /** Walks the browser back over the entry the sheet pushed; cb runs once the resulting popstate lands. */
  _flush(cb) {

  /* ---------- actions ---------- */
  _submit = () => {

    if (this.props.inline || this._depth === 0) { this._cb('onSubmit'); return; }

  };
  _focusField(field) {
    let el = this._el(field);
    if (!el && this._root && (field === 'date' || field === 'time')) el = this._root.querySelector('[data-bs-' + field + '] button[aria-haspopup]');
    if (el && el.focus) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
  }
  _pick(field, id) {

    this.setState({ sugIdx: -1 });
  }
  _hits(field) { const p = this.props; const h = field === 'from' ? p.fromHits : p.toHits; return Array.isArray(h) ? h : []; }

    else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ sugField: field, sugIdx: i <= 0 ? n - 1 : i - 1 }); }
    else if (e.key === 'Enter') { e.preventDefault(); const h = this._hits(field)[i >= 0 ? i : 0]; if (h) this._pick(field, h.id); }

    setTimeout(() => { if (t && t.scrollIntoView && document.contains(t)) t.scrollIntoView({ block: 'nearest' }); }, 60);
  };

  _bodyRef = (el) => { this._bodyEl = el; };

      return {
        id: u + '-' + field + '-o' + i, name: String(h.name || ''), sub: String(h.sub || ''),
        icon: h.icon || 'map-pin', tone: h.tone || '', sel: sel ? 'true' : 'false',
        css: sel ? 'background:var(--vt-grey-50)' : '',
        hold: (e) => e.preventDefault(),
        pick: () => this._pick(field, h.id),
      };
    });
  }

  renderVals() {
    const p = this.props, s = this.state, u = this._uid;
    const has = (v) => !!(v && String(v).trim());
    const issue = this.tripIssue();
    const show = !!issue && this._showing();
    /* 16 = the database limit on a leg; home passes the class-row cap (most seats among the bookable classes). */
    const cap = Number.isFinite(+p.paxMax) && +p.paxMax >= 1 ? Math.min(16, Math.floor(+p.paxMax)) : 16;
    const pax = Math.min(cap, Math.max(1, Number.isFinite(+p.pax) ? +p.pax : 1));
    const bags = Math.min(16, Math.max(0, Number.isFinite(+p.bags) ? +p.bags : 0));
    const inline = !!p.inline;
    const fieldErr = (f) => (show && issue.field === f ? 'true' : 'false');
    const errBool = (f) => show && issue.field === f;
    const flightReq = !!p.fromAirport;
    const flightVis = this._flightVisible(p);
    const sugFrom = this._sugOpen('from'), sugTo = this._sugOpen('to');
    const setPax = (n) => () => this._cb('onPax', n);
    const setBags = (n) => () => this._cb('onBags', n);
    const ed = (name) => (e) => this._cb(name, e && e.target ? e.target.value : e);
    const active = (field, open) => (open && s.sugField === field && s.sugIdx >= 0 ? u + '-' + field + '-o' + s.sugIdx : undefined);
    return {
      n16: 16, n20: 20, yes: true,
      visible: inline || !!p.open || s.leaving,
      inlineAttr: inline ? '1' : '0',
      leavingAttr: s.leaving && !p.open ? '1' : '0',
      rootRef: this._rootRef, bodyRef: this._bodyRef,
      rootCss: !inline && s.vvh > 0 ? '--bs-h:' + s.vvh + 'px;--bs-top:' + s.vvTop + 'px' : '',
      titleId: u + '-title', msgId: u + '-msg',
      secWhere: u + '-sec-where', secWhen: u + '-sec-when', secWho: u + '-sec-who',
      idFrom: u + '-from', idTo: u + '-to', idFlight: u + '-flight',
      listFrom: u + '-list-from', listTo: u + '-list-to',
      activeFrom: active('from', sugFrom), activeTo: active('to', sugTo),
      announce: show ? issue.msg : '',
      close: () => this._closeSelf(), onKey: this._onKey, bodyFocus: this._bodyFocus,
      fromText: p.fromText || '', toText: p.toText || '',

      focFrom: () => this._cb('onFieldFocus', 'from'), focTo: () => this._cb('onFieldFocus', 'to'),

      comboKey: (e) => { const f = e && e.target && e.target.id === u + '-to' ? 'to' : 'from'; this._comboKey(f)(e); },
      rowsFrom: this._rowsFor('from'), rowsTo: this._rowsFor('to'),
      sugFrom: sugFrom, sugTo: sugTo, sugFromStr: sugFrom ? 'true' : 'false', sugToStr: sugTo ? 'true' : 'false',
      errFrom: fieldErr('from'), errTo: fieldErr('to'), errFlight: fieldErr('flight'),
      errDate: errBool('date'), errTime: errBool('time'),
      flightShown: flightVis, flightOptional: !flightReq, flightRequiredStr: flightReq ? 'true' : 'false',
      flightIcon: flightReq ? 'plane-landing' : 'plane',
      flightHint: flightReq ? 'We track it and move the pickup if you land late' : 'It does not change the price.',
      flight: p.flight || '', inFlight: ed('onFlight'),
      opener: !flightVis && !!p.fromChosen, openFlight: () => this._cb('onFlightOpen'),
      dateLabel: p.dateLabel || '', dayNum: +p.dayNum || 0, dayY: +p.dayY || 0, dayM: +p.dayM || 0, time: p.time || '', baseMonth: p.baseMonth || '', lang: p.lang || 'en',
      pickDay: (d, label, y, m) => this._cb('onDay', d, label, y, m),
      pickTime: (v) => this._cb('onTime', v),
      whenClear: () => this._cb('onWhenClear'),
      paxN: pax, bagsN: bags, paxAtMin: pax <= 1, paxAtMax: pax >= cap, bagsAtMin: bags <= 0, bagsAtMax: bags >= 16,
      decPax: setPax(pax - 1), incPax: setPax(pax + 1), decBag: setBags(bags - 1), incBag: setBags(bags + 1),
      showIssue: show, noIssue: !show, issueMsg: show ? issue.msg : '',
      submit: this._submit,
    };
  }
}
</script>
