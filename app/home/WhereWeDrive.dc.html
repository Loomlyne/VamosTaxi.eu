<section data-ww="1" id="where-we-drive" dir="{{ dir }}" data-screen-label="Where we drive" aria-labelledby="ww-title">
<div data-ww-wrap="1">
<div data-ww-head="1">
<p data-ww-kicker="1">Where we drive</p>
<h2 id="ww-title" data-ww-title="1">Choose an airport. See where we take you.</h2>
</div>
<div data-ww-tabs="1" role="tablist" aria-label="Airports" onKeyDown="{{ onTabKey }}">
<sc-for list="{{ tabs }}" as="a" hint-placeholder-count="3">
<button type="button" role="tab" id="{{ a.tabId }}" data-ww-tab="1" aria-selected="{{ a.sel }}" aria-controls="ww-panel" tabindex="{{ a.tab }}" onClick="{{ a.select }}">
<x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="plane-landing" size="{{ n18 }}" hint-size="18px,18px"></x-import>
<span>{{ a.city }}</span><span class="vt-dir-keep" data-vt-no-i18n="1">{{ a.code }}</span>
</button>
</sc-for>
</div>
<div data-ww-split="1" id="ww-panel" role="tabpanel" aria-labelledby="{{ activeTabId }}">
<div data-ww-photo="1" data-airport="{{ activeId }}"><img src="{{ photo }}" alt=""></div>
<div>
<div data-ww-list="1">
<sc-if value="{{ showSkel }}" hint-placeholder-val="{{ false }}">
<div data-ww-skel="1" aria-hidden="true"></div>
<div data-ww-skel="1" aria-hidden="true"></div>
</sc-if>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<a data-ww-row="1" href="/#book" onClick="{{ r.pick }}">
<span data-ww-row-main="1"><span>{{ airportName }}</span><span data-ww-arrow="1" aria-hidden="true"><x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="arrow-right" size="{{ n16 }}" hint-size="16px,16px"></x-import></span><span>{{ r.name }}</span><sc-if value="{{ r.fixed }}" hint-placeholder-val="{{ false }}"><span data-ww-tag="1">Fixed route</span></sc-if></span>
<span data-ww-chev="1" aria-hidden="true"><x-import component-from-global-scope="VamosTaxiDesignSystem_245af1.Icon" name="chevron-right" size="{{ n16 }}" hint-size="16px,16px"></x-import></span>
</a>
</sc-for>
</div>
<p data-ww-note="1">Not on the list? Type any address in the booking card.</p>
</div>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props="{}">
const AIRPORTS = [
  { id: 'zrh', code: 'ZRH', city: 'Zurich', label: 'Zurich Airport', places: ['Zurich', 'Lucerne', 'Interlaken', 'Zermatt', 'Bern'] },
  { id: 'gva', code: 'GVA', city: 'Geneva', label: 'Geneva Airport', places: ['Geneva', 'Lausanne', 'Zermatt', 'Bern'] },
  { id: 'bsl', code: 'BSL', city: 'Basel', label: 'Basel EuroAirport', places: ['Basel', 'Bern', 'Lucerne', 'Zurich'] },
];
/** One GET /api/quote per page: shared with home.dc.html and HowItWorks via window.__vamosIdleBoard. */
function idleBoard() {
  if (typeof window === 'undefined' || typeof fetch === 'undefined') return Promise.resolve(null);
  if (!window.__vamosIdleBoard) {
    window.__vamosIdleBoard = fetch('/api/quote', { headers: { accept: 'application/json' } })
      .then((r) => r.json().catch(() => null))
      .catch(() => null);
  }
  return window.__vamosIdleBoard;
}
function isRtl() { return typeof document !== 'undefined' && document.documentElement.dir === 'rtl'; }
class Component extends DCLogic {
  state = { lang: (window.VamosLocale && window.VamosLocale.lang && window.VamosLocale.lang()) || 'en', active: 0, fixed: null };
  componentDidMount() {
    if (window.VamosLocale && window.VamosLocale.onChange) {
      this._offLocale = window.VamosLocale.onChange((v) => this.setState({ lang: v.lang }));
    }
    this._on = true;
    idleBoard().then((j) => {
      if (!this._on) return;
      const out = [];
      const seen = {};
      if (j && j.ok === true && Array.isArray(j.fixed_routes)) {
        j.fixed_routes.forEach((f) => {
          if (!f || typeof f.from !== 'string' || typeof f.to !== 'string') return;
          if (f.from.indexOf('Zurich Airport') !== 0) return;
          const label = f.to.split(',')[0].trim();
          if (label.length < 2 || seen[label]) return;
          seen[label] = 1;
          out.push({ name: label, fixed: true, toMapboxId: f.to_mapbox_id || '', fromMapboxId: f.from_mapbox_id || '' });
        });
      }
      this.setState({ fixed: out });
    }).catch(() => { if (this._on) this.setState({ fixed: [] }); });
  }
  componentWillUnmount() {
    this._on = false;
    if (this._offLocale) this._offLocale();
  }
  selectTab(i, focus) {
    this.setState({ active: i });
    if (focus) {
      const el = document.getElementById('ww-tab-' + AIRPORTS[i].id);
      if (el && el.focus) el.focus();
    }
  }
  onTabKey = (e) => {
    const k = e && e.key;
    const n = AIRPORTS.length;
    const cur = this.state.active;
    const fwd = isRtl() ? 'ArrowLeft' : 'ArrowRight';
    const back = isRtl() ? 'ArrowRight' : 'ArrowLeft';
    let next = -1;
    if (k === fwd) next = (cur + 1) % n;
    else if (k === back) next = (cur + n - 1) % n;
    else if (k === 'Home') next = 0;
    else if (k === 'End') next = n - 1;
    if (next < 0) return;
    if (e.preventDefault) e.preventDefault();
    this.selectTab(next, true);
  };
  pick(e, airport, row) {
    if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (e.button && e.button > 0))) return;
    if (e && e.preventDefault) e.preventDefault();
    const place = String(row.name || '').replace(/\s+/g, ' ').trim().slice(0, 200);
    if (place.length < 2) return;
    const detail = { name: place, kind: row.fixed ? 'route' : 'city', from: airport.label, fromCode: airport.code, handled: false };
    if (row.fixed) { detail.fromMapboxId = row.fromMapboxId; detail.toMapboxId = row.toMapboxId; }
    try { window.dispatchEvent(new CustomEvent('vamos:dest-pick', { detail: detail })); } catch (err) {}
    if (detail.handled === true) return;
    const reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = document.getElementById('book');
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.pageYOffset - 24;
    window.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' });
  }
  renderVals() {
    const a = AIRPORTS[this.state.active] || AIRPORTS[0];
    const fixedRows = a.id === 'zrh' && Array.isArray(this.state.fixed) ? this.state.fixed : [];
    const rows = fixedRows.concat(a.places.map((p) => ({ name: p, fixed: false }))).map((r) => ({
      name: r.name,
      fixed: r.fixed,
      pick: (e) => this.pick(e, a, r),
    }));
    return {
      dir: this.state.lang === 'ar' ? 'rtl' : 'ltr',
      n16: 16,
      n18: 18,
      onTabKey: this.onTabKey,
      tabs: AIRPORTS.map((x, i) => ({
        tabId: 'ww-tab-' + x.id,
        city: x.city,
        code: x.code,
        sel: i === this.state.active ? 'true' : 'false',
        tab: i === this.state.active ? '0' : '-1',
        select: () => this.selectTab(i, false),
      })),
      activeTabId: 'ww-tab-' + a.id,
      activeId: a.id,
      photo: '/assets/photography/dest-' + a.id + '.jpg',
      airportName: a.label,
      showSkel: a.id === 'zrh' && this.state.fixed === null,
      rows: rows,
    };
  }
}
</script>
