<!-- Ground colour + cover live in the STATIC head/body on purpose. The DC runtime
     injects every stylesheet and script from <helmet> only after React has loaded, so
     without these the arriving document paints uncovered frames before
     vamos-page-transition.js exists and can build its overlay. That script adopts
     #vt-boot-cover and removes it once its own sheet is painted at COVER; the 6s
     animation below is the fallback for when the script never runs. -->
<style id="vt-boot">html{background:#F6F6F6}body{margin:0}#vt-boot-cover{position:fixed;inset:0;z-index:2147483000;background:#F6F6F6;pointer-events:none;animation:vt-boot-fail 0s linear 6s forwards}@keyframes vt-boot-fail{to{visibility:hidden}}</style>
</head>
<body>
<div id="vt-boot-cover" aria-hidden="true"></div>

<style>:root{--vt-icon-base:"../../assets/icons/";--vt-logo-base:"../../assets/logo/";--vt-pattern-base:"../../assets/patterns/";--vt-shadow-accent:none}
.vt-input--focus{box-shadow:none}
body{margin:0}
a{color:inherit;text-decoration:none;border-bottom:0}
[data-kicker]{margin:0;display:inline-flex;align-self:flex-start;align-items:center;gap:9px;box-sizing:border-box;inline-size:fit-content;max-inline-size:100%;min-block-size:32px;padding-block:0;padding-inline:12px 15px;border:1px solid rgb(255 255 255 / 0.22);border-radius:var(--vt-radius-pill);background:transparent;font-family:var(--vt-font-body);font-size:12px;font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;line-height:1;white-space:nowrap;color:var(--vt-text-inverse)}
[data-kicker]::before{content:"";flex:0 0 13px;inline-size:13px;block-size:13px;background:url(../../assets/patterns/checker-mark.png) center / contain no-repeat}
[data-title]{margin:0;max-inline-size:18ch;font-family:var(--vt-font-display);font-size:var(--vt-display-2);font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-display-tracking);line-height:var(--vt-display-leading);text-wrap:balance;color:var(--vt-text-inverse)}
:focus-visible:not(input):not(select):not(textarea){outline:none;box-shadow:var(--vt-ring-inverse)}
/* Section: charcoal ground, so it stops the eye between the two grey
   sections around it (TrustFacts above, FAQ below). The closing CTA is also charcoal,
   but FAQ sits between them, so the two dark bands never touch. */
[data-biz]{position:relative;overflow:hidden;isolation:isolate;background:var(--vt-bg-inverse);color:var(--vt-text-inverse);font-family:var(--vt-font-body)}
[data-wrap]{position:relative;z-index:1;box-sizing:border-box;max-inline-size:var(--vt-container-lg);margin-inline:auto;padding-block:clamp(56px,7vw,104px);padding-inline:var(--vt-gutter)}
[data-biz-grid]{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"media" "copy" "act";gap:clamp(24px,3vw,32px);align-items:start}
[data-biz-media]{grid-area:media;position:relative;margin:0;min-inline-size:0;overflow:hidden;border-radius:var(--vt-radius-lg);background:var(--vt-bg-inverse-raised)}
[data-biz-photo]{display:block;inline-size:100%;block-size:100%;aspect-ratio:3 / 2;object-fit:cover;object-position:50% 60%}
@media (min-width:600px) and (max-width:899.98px){[data-biz] [data-biz-photo]{aspect-ratio:16 / 9}}

[data-chips]{display:flex;flex-direction:column;gap:0;margin:8px 0 0;padding:0;list-style:none;inline-size:100%;max-inline-size:440px;border-block-start:1px solid rgb(255 255 255 / 0.14)}
[data-chip]{display:flex;align-items:center;gap:12px;min-block-size:48px;box-sizing:border-box;padding-block:10px;border-block-end:1px solid rgb(255 255 255 / 0.14);font-family:var(--vt-font-body);font-size:var(--vt-body-md);font-weight:var(--vt-weight-medium);color:var(--vt-text-inverse)}
[data-chip-mark]{display:inline-grid;place-items:center;flex:0 0 28px;inline-size:28px;block-size:28px;border-radius:var(--vt-radius-pill);background:var(--vt-accent);color:var(--vt-text-on-accent)}
[data-band-act]{grid-area:act;display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-inline-size:0}
[data-btn]{display:inline-flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;min-block-size:54px;padding-inline:24px;border:1px solid var(--vt-accent);border-radius:var(--vt-radius-pill);background:var(--vt-accent);color:var(--vt-text-on-accent);font-family:var(--vt-font-body);font-size:13px;font-weight:var(--vt-weight-semibold);letter-spacing:var(--vt-label-tracking);text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background-color 140ms var(--vt-ease-standard),border-color 140ms var(--vt-ease-standard),color 140ms var(--vt-ease-standard),transform 80ms var(--vt-ease-standard)}
/* colour restated on hover: the page-wide a:hover rule would paint the label link-hover brown */
[data-btn]:hover{background:var(--vt-accent-hover);border-color:var(--vt-accent-hover);color:var(--vt-text-on-accent)}
[data-btn]:active{transform:translateY(1px)}
/* WhatsApp: the original green glyph on the charcoal ground (brand-mark exception). */
[data-btn="wa"]{background:transparent;border-color:rgb(255 255 255 / 0.7);color:var(--vt-text-inverse)}
[data-btn="wa"]:hover{background:var(--vt-white);border-color:var(--vt-white);color:var(--vt-charcoal-900)}
/* Services.dc.html ships a page-wide :focus-visible rule with !important (charcoal outline,
   4px radius) that would square these pills and vanish on charcoal; win it back here. */
section[data-biz] [data-band-act] [data-btn]:focus-visible{outline:none!important;border-radius:var(--vt-radius-pill)!important;box-shadow:var(--vt-ring-inverse)}
[data-wa-mark]{display:block;flex:0 0 20px;inline-size:20px;block-size:20px}

/* Split: copy at the start, the framed fleet photograph at the end. */
@media (min-width:900px){
  [data-biz] [data-biz-grid]{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:". media" "copy media" "act media" ". media";grid-template-rows:1fr auto auto 1fr;column-gap:clamp(40px,5vw,80px);row-gap:0;align-items:center}
  [data-biz] [data-band-act]{margin-block-start:32px}
  [data-biz] [data-biz-photo]{aspect-ratio:4 / 3}
}

@media (max-width:640px){[data-band-act]{flex-direction:column;align-items:stretch;inline-size:100%}[data-btn]{inline-size:100%}}
@media (prefers-reduced-motion:reduce){[data-btn]{transition:none}[data-btn]:active{transform:none}}
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:640}}">
/**
 * Business travel band. Re-renders when the platform language changes; static copy.
 * Charcoal split, copy beside the framed fleet photograph.
 */
class Component extends DCLogic {
  state = { lang: null };
  componentDidMount() {
    this._offLocale = window.VamosLocale.onChange((v) => this.setState({ lang: v.lang }));
  }
  componentWillUnmount() {
    if (this._offLocale) this._offLocale();
  }
  renderVals() {
    return { n16: 16, n18: 18 };
  }
}
</script>
