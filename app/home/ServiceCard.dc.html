    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const top = el.getBoundingClientRect().top + window.pageYOffset - 88;
    window.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' });
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  };
  componentDidMount() {}
  componentDidUpdate() { this.resize(); this.draw(); }
  componentWillUnmount() {
    window.removeEventListener('pointermove', this.onPointer);
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this.gl) { const e = this.gl.getExtension('WEBGL_lose_context'); if (e) e.loseContext(); }
    this.gl = null;
  }
  renderVals() {
    const image = (this.props.image || '').trim();
    return {
      n44: 44,
      n16: 16,
      onGo: this.onGo,
      cta: (this.props.cta || '').trim(),
      hasCta: !!(this.props.cta || '').trim(),
      glyph: this.props.icon || 'car-front',
      accentAttr: this.props.accent ? '1' : '0',
      toneAttr: this.props.tone === 'charcoal' ? 'charcoal' : 'grey',
      hasImage: !!image,
      hasImageAttr: image ? '1' : '0',
      image,
      imageFocus: this.props.imageFocus || 'center',
      mediaRef: this.mediaRef,
      fxRef: this.fxRef,
    };
  }
}
</script>
</body>
