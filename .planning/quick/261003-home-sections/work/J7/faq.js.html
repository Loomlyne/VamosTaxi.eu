/**
 * Home · FAQ — topics rail + accordion. Desktop (above 900px): a 280px rail of
 * four topic buttons (count beside each) and a charcoal "Still a question?" box,
 * beside the accordion of the selected topic. At 900px and below the topics are a
 * sideways swipe row and the help box moves under the questions. The open item is
 * a white card with the answer straight under the question: no divider inside.
 * Closed items are hairline rows. One item open at a time; picking a topic opens
 * its first item. Topics are a tablist (arrow keys move), items are buttons with
 * aria-expanded / aria-controls. Panel animates 0fr to 1fr; reduced motion is
 * instant. Markup stays literal so every string is directly editable and
