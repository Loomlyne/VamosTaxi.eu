packages:
  - "apps/*"
  - "packages/*"
overrides:
  postcss: 8.5.26
  sharp: ^0.35.5            # GHSA-wq5f-xc86-pv6w (high); was an exact 0.35.4 pin
  # Dependabot on main, 2026-10-02: 41 open alerts (15 high) across five transitive
  # packages. Caret, not >=, on purpose: >= let fast-uri jump 3 -> 4 and js-yaml 4 -> 5,
  # which is a dependency upgrade wearing a security fix's clothes. Every bump below
  # stays inside its own major.
  fast-uri: ^3.1.9          # SSRF, host confusion, authority injection (6 alerts; 3.1.9 on 2026-10-26)
  brace-expansion@2: ^2.1.7 # DoS by uncontrolled recursion
  brace-expansion@5: ^5.0.12
  undici@7: ^7.30.1         # TLS validation bypass, DoS, cache poisoning (28 alerts; 7.30.1 on 2026-10-26)
  undici@8: ^8.12.3
  js-yaml: ^4.3.2           # CPU exhaustion via merge keys
  qs: ^6.16.0
  # Dependabot on main, 2026-10-26: express (via @opennextjs/aws) pulls body-parser 2 below the fix.
  body-parser@2: ^2.4.0
# braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm, high, stack exhaustion on deeply nested patterns): no patched
# version exists. 3.0.3 is the newest on npm (checked 2026-10-05) and the advisory lists no fixed
# release, so an override to ^3.0.4 fails with ERR_PNPM_NO_MATCHING_VERSION. It is reachable only from
# stylelint > fast-glob > micromatch, a dev tool that globs this repo's own CSS files; it never ships
# in the Worker (`pnpm audit --prod` is clean). Ignored here so `pnpm audit` stays a useful gate.
# Remove this entry as soon as braces publishes a fix and `pnpm audit` stops listing it.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  supabase: true
  workerd: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - typescript-eslint@8.68.0
