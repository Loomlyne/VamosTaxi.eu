packages:
  - "apps/*"
  - "packages/*"
overrides:
  postcss: 8.5.26
  sharp: 0.35.4
  # Dependabot on main, 2026-10-02: 41 open alerts (15 high) across five transitive
  # packages. Caret, not >=, on purpose: >= let fast-uri jump 3 -> 4 and js-yaml 4 -> 5,
  # which is a dependency upgrade wearing a security fix's clothes. Every bump below
  # stays inside its own major.
  fast-uri: ^3.1.8          # SSRF, host confusion, authority injection (6 alerts)
  brace-expansion@2: ^2.1.7 # DoS by uncontrolled recursion
  brace-expansion@5: ^5.0.12
  undici@7: ^7.29.1         # TLS validation bypass, DoS, cache poisoning (28 alerts)
  undici@8: ^8.10.2
  js-yaml: ^4.3.2           # CPU exhaustion via merge keys
  qs: ^6.16.0
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  supabase: true
  workerd: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - typescript-eslint@8.68.0
